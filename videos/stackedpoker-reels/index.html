<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0D1526; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!--
      StackedPoker - high-density 9:16 performance film. 1080x1920, 22.0s.

      Eleven scenes with deliberate rhythm rather than one uniform speed:
      2.0 / 2.2 / 1.6 / 1.4 / 2.0 / 2.6 / 2.4 / 1.8 / 2.4 / 1.6 / 2.0.
      Scene 3 is the pause - the options simply hold while the viewer answers.
      Scene 6 is the fast beat - four canonical ranges, 0.55s apart, on a grid
      that never moves.

      No injected transitions: every cut is a hard cut between two numerically
      identical frozen states.
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="21.6"
         data-width="1080" data-height="1920">

      <div id="el-01-hook" class="scene" data-composition-id="01-hook"
           data-composition-src="compositions/frames/01-hook.html"
           data-start="0.0" data-duration="2.0" data-track-index="1"></div>
      <div id="el-02-spot" class="scene" data-composition-id="02-spot"
           data-composition-src="compositions/frames/02-spot.html"
           data-start="2.0" data-duration="2.2" data-track-index="1"></div>
      <div id="el-03-options" class="scene" data-composition-id="03-options"
           data-composition-src="compositions/frames/03-options.html"
           data-start="4.2" data-duration="1.6" data-track-index="1"></div>
      <div id="el-04-answer" class="scene" data-composition-id="04-answer"
           data-composition-src="compositions/frames/04-answer.html"
           data-start="5.8" data-duration="1.4" data-track-index="1"></div>
      <div id="el-05-range" class="scene" data-composition-id="05-range"
           data-composition-src="compositions/frames/05-range.html"
           data-start="7.2" data-duration="2.0" data-track-index="1"></div>
      <div id="el-06-montage" class="scene" data-composition-id="06-montage"
           data-composition-src="compositions/frames/06-montage.html"
           data-start="9.2" data-duration="2.6" data-track-index="1"></div>
      <div id="el-07-theory" class="scene" data-composition-id="07-theory"
           data-composition-src="compositions/frames/07-theory.html"
           data-start="11.8" data-duration="2.4" data-track-index="1"></div>
      <div id="el-08-depth" class="scene" data-composition-id="08-depth"
           data-composition-src="compositions/frames/08-depth.html"
           data-start="14.2" data-duration="1.8" data-track-index="1"></div>
      <div id="el-09-coach" class="scene" data-composition-id="09-coach"
           data-composition-src="compositions/frames/09-coach.html"
           data-start="16.0" data-duration="2.0" data-track-index="1"></div>
      <div id="el-10-payoff" class="scene" data-composition-id="10-payoff"
           data-composition-src="compositions/frames/10-payoff.html"
           data-start="18.0" data-duration="1.6" data-track-index="1"></div>
      <div id="el-11-cta" class="scene" data-composition-id="11-cta"
           data-composition-src="compositions/frames/11-cta.html"
           data-start="19.6" data-duration="2.0" data-track-index="1"></div>

      <audio id="el-01-hook-voice" src="assets/voice/reels/r1.wav"
             data-start="0.0" data-duration="1.74" data-track-index="10" data-volume="1"></audio>
      <audio id="el-03-options-voice" src="assets/voice/reels/r3.wav"
             data-start="4.2" data-duration="1.2" data-track-index="10" data-volume="1"></audio>
      <audio id="el-05-range-voice" src="assets/voice/reels/r5.wav"
             data-start="7.2" data-duration="2.07" data-track-index="10" data-volume="1"></audio>
      <audio id="el-07-theory-voice" src="assets/voice/reels/r7.wav"
             data-start="11.8" data-duration="2.18" data-track-index="10" data-volume="1"></audio>
      <audio id="el-09-coach-voice" src="assets/voice/reels/r9.wav"
             data-start="16.0" data-duration="2.65" data-track-index="10" data-volume="1"></audio>
      <audio id="el-11-cta-voice" src="assets/voice/reels/r11.wav"
             data-start="19.6" data-duration="1.78" data-track-index="10" data-volume="1"></audio>

      <audio id="el-bgm" src="assets/bgm/track.mp3"
             data-start="0" data-duration="21.6" data-track-index="11" data-volume="0.5"></audio>

      <audio id="el-sfx-00-u-swell-long" src="assets/sfx/u-swell-long.mp3" data-start="0.0" data-duration="3.2" data-track-index="20" data-volume="0.26"></audio>  <!-- the film opens -->
      <audio id="el-sfx-01-u-card" src="assets/sfx/u-card.mp3" data-start="0.1" data-duration="0.26" data-track-index="21" data-volume="0.42"></audio>  <!-- card one snaps -->
      <audio id="el-sfx-02-u-card" src="assets/sfx/u-card.mp3" data-start="0.21" data-duration="0.26" data-track-index="22" data-volume="0.38"></audio>  <!-- card two follows -->
      <audio id="el-sfx-03-u-glass" src="assets/sfx/u-glass.mp3" data-start="2.25" data-duration="1.62" data-track-index="23" data-volume="0.26"></audio>  <!-- the table forms -->
      <audio id="el-sfx-04-u-tick" src="assets/sfx/u-tick.mp3" data-start="3.1" data-duration="0.35" data-track-index="24" data-volume="0.1"></audio>  <!-- SB blind -->
      <audio id="el-sfx-05-u-tick" src="assets/sfx/u-tick.mp3" data-start="3.2" data-duration="0.35" data-track-index="25" data-volume="0.1"></audio>  <!-- BB blind -->
      <audio id="el-sfx-06-u-accent" src="assets/sfx/u-accent.mp3" data-start="2.23" data-duration="2.4" data-track-index="26" data-volume="0.2"></audio>  <!-- peaks on CO's raise at 3.38 -->
      <audio id="el-sfx-07-u-tick" src="assets/sfx/u-tick.mp3" data-start="4.82" data-duration="0.35" data-track-index="27" data-volume="0.11"></audio>  <!-- option 1 -->
      <audio id="el-sfx-08-u-tick" src="assets/sfx/u-tick.mp3" data-start="4.92" data-duration="0.35" data-track-index="28" data-volume="0.11"></audio>  <!-- option 2 -->
      <audio id="el-sfx-09-u-tick" src="assets/sfx/u-tick.mp3" data-start="5.02" data-duration="0.35" data-track-index="29" data-volume="0.11"></audio>  <!-- option 3 -->
      <audio id="el-sfx-10-u-shimmer" src="assets/sfx/u-shimmer.mp3" data-start="5.3" data-duration="3.32" data-track-index="30" data-volume="0.17"></audio>  <!-- peaks as 3-Bet resolves at 6.00 -->
      <audio id="el-sfx-11-u-glass" src="assets/sfx/u-glass.mp3" data-start="7.55" data-duration="1.62" data-track-index="31" data-volume="0.22"></audio>  <!-- the grid arrives -->
      <audio id="el-sfx-12-u-shimmer" src="assets/sfx/u-shimmer.mp3" data-start="7.3" data-duration="3.32" data-track-index="32" data-volume="0.2"></audio>  <!-- peaks as the strategy resolves at 8.00 -->
      <audio id="el-sfx-13-u-tick" src="assets/sfx/u-tick.mp3" data-start="9.45" data-duration="0.35" data-track-index="33" data-volume="0.17"></audio>  <!-- range 2 -->
      <audio id="el-sfx-14-u-tick" src="assets/sfx/u-tick.mp3" data-start="10.0" data-duration="0.35" data-track-index="34" data-volume="0.17"></audio>  <!-- range 3 -->
      <audio id="el-sfx-15-u-tick" src="assets/sfx/u-tick.mp3" data-start="10.55" data-duration="0.35" data-track-index="35" data-volume="0.17"></audio>  <!-- range 4 -->
      <audio id="el-sfx-16-u-tick" src="assets/sfx/u-tick.mp3" data-start="11.1" data-duration="0.35" data-track-index="36" data-volume="0.17"></audio>  <!-- range 5 -->
      <audio id="el-sfx-17-u-glass" src="assets/sfx/u-glass.mp3" data-start="12.2" data-duration="1.62" data-track-index="37" data-volume="0.18"></audio>  <!-- the reason -->
      <audio id="el-sfx-18-u-tick" src="assets/sfx/u-tick.mp3" data-start="14.52" data-duration="0.35" data-track-index="38" data-volume="0.15"></audio>  <!-- module 1 -->
      <audio id="el-sfx-19-u-tick" src="assets/sfx/u-tick.mp3" data-start="14.78" data-duration="0.35" data-track-index="39" data-volume="0.15"></audio>  <!-- module 2 -->
      <audio id="el-sfx-20-u-tick" src="assets/sfx/u-tick.mp3" data-start="15.04" data-duration="0.35" data-track-index="40" data-volume="0.15"></audio>  <!-- module 3 -->
      <audio id="el-sfx-21-u-tick" src="assets/sfx/u-tick.mp3" data-start="15.3" data-duration="0.35" data-track-index="41" data-volume="0.15"></audio>  <!-- module 4 -->
      <audio id="el-sfx-22-u-tick" src="assets/sfx/u-tick.mp3" data-start="15.56" data-duration="0.35" data-track-index="42" data-volume="0.15"></audio>  <!-- module 5 -->
      <audio id="el-sfx-23-u-glass" src="assets/sfx/u-glass.mp3" data-start="16.3" data-duration="1.62" data-track-index="43" data-volume="0.17"></audio>  <!-- the coach -->
      <audio id="el-sfx-24-u-accent" src="assets/sfx/u-accent.mp3" data-start="19.05" data-duration="2.4" data-track-index="44" data-volume="0.24"></audio>  <!-- peaks on UNDERSTAND WHY. at 20.20 -->
      <audio id="el-sfx-25-u-tick" src="assets/sfx/u-tick.mp3" data-start="20.82" data-duration="0.35" data-track-index="45" data-volume="0.1"></audio>  <!-- the CTA -->
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
