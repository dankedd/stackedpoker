<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0C101D;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-the-hand"
        class="scene"
        data-composition-id="01-the-hand"
        data-composition-src="compositions/frames/01-the-hand.html"
        data-start="0"
        data-duration="5"
        data-track-index="1"
      ></div>
      <audio
        id="el-01-the-hand-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-theory"
        class="scene"
        data-composition-id="02-theory"
        data-composition-src="compositions/frames/02-theory.html"
        data-start="5"
        data-duration="5"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-theory-voice"
        src="assets/voice/02.wav"
        data-start="5"
        data-duration="5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-decision"
        class="scene"
        data-composition-id="03-decision"
        data-composition-src="compositions/frames/03-decision.html"
        data-start="10"
        data-duration="6"
        data-track-index="1"
      ></div>
      <audio
        id="el-03-decision-voice"
        src="assets/voice/03.wav"
        data-start="10"
        data-duration="6"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-range"
        class="scene"
        data-composition-id="04-range"
        data-composition-src="compositions/frames/04-range.html"
        data-start="16"
        data-duration="6"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-range-voice"
        src="assets/voice/04.wav"
        data-start="16"
        data-duration="6"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-05-explanation"
        class="scene"
        data-composition-id="05-explanation"
        data-composition-src="compositions/frames/05-explanation.html"
        data-start="22"
        data-duration="5"
        data-track-index="1"
      ></div>
      <audio
        id="el-05-explanation-voice"
        src="assets/voice/05.wav"
        data-start="22"
        data-duration="5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-06-close"
        class="scene"
        data-composition-id="06-close"
        data-composition-src="compositions/frames/06-close.html"
        data-start="27"
        data-duration="3"
        data-track-index="1"
      ></div>
      <audio
        id="el-06-close-voice"
        src="assets/voice/06.wav"
        data-start="27"
        data-duration="3"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/track.mp3"
        data-start="0"
        data-duration="30"
        data-track-index="11"
        data-volume="0.5"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
