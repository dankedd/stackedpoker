  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var scope = document.querySelector('[data-composition-id="02-theory"]');
      var card = scope.querySelector("#f02t-card");
      var divider = scope.querySelector("#f02t-divider");
      var words = scope.querySelectorAll(".f02t-w");
      var pips = scope.querySelectorAll("[data-glow]");

      /* ---- initial states, OUTSIDE the timeline ---- */
      /* The card's CSS carries its FINAL box (left 580 / top 280 / 760x600).
         Frame 1's inherited box (660,280,600x420) is restored here as an
         x-offset of +80 plus the smaller width/height, so t=0 paints the
         seam exactly and nothing has to "enter". */
      gsap.set(card, { x: 80, y: 0, width: 600, height: 420 });
      gsap.set(divider, { opacity: 0, scaleX: 0.5 });
      gsap.set(words, { opacity: 0, y: 10 });

      var tl = gsap.timeline({ paused: true });

      /* ------------------------------------------------------------------
         Scene 1 (0.0–0.4s) — the inherited state, completely static.
         Nothing is authored here on purpose: the card sits at x660 y280
         w600 h420 and the two poker cards at 818–1102 x 470–656 straight
         out of CSS, exactly as Frame 1 left them. The seam is invisible.
         ------------------------------------------------------------------ */

      /* ---- Scene 2 (0.4–1.6s): the card grows around the cards ----
         The left edge travels 660 -> 580 as a pure `x` TRANSFORM (80 -> 0)
         against the card's static CSS left:580 — no layout property carries
         the position, so the ease-out tail cannot snap to integer device
         pixels under the seek-by-frame capture engine. Only the box size
         (600->760 wide, 420->600 tall) is a layout tween, and because the
         element is never scaled the 1.5px glass hairline stays 1.5px and the
         14px radius stays 14px for the whole growth.
         Top edge pinned at y=280 (y stays 0). The two poker cards are
         canvas-absolute SIBLINGS of the card, not children, so neither the
         transform nor the resize can move them: 818–1102 x 470–656 holds
         from t=0 to t=5. One long-tail power3 ease. */
      tl.fromTo(
        card,
        { x: 80, y: 0, width: 600, height: 420 },
        {
          x: 0,
          y: 0,
          width: 760,
          height: 600,
          duration: 1.2,
          ease: "power3.out",
        },
        0.4,
      );

      /* ---- Scene 3 (1.6–3.0s): hairline divider, then the sentence ---- */
      tl.fromTo(
        divider,
        { opacity: 0, scaleX: 0.5 },
        { opacity: 1, scaleX: 1, duration: 0.5, ease: "power3.out" },
        1.6,
      );

      tl.fromTo(
        words,
        { opacity: 0, y: 10 },
        {
          opacity: 1,
          y: 0,
          duration: 0.5,
          ease: "power3.out",
          stagger: 0.042,
        },
        1.95,
      );

      /* ---- Scene 4 (3.0–4.2s): asr-keyword-glow on the spade pips ----
         One linear driver over the whole scene; the envelope is 0 before
         start, linear attack to 1, sustain, then a release down to a rest
         level it holds forever after. Both windows finish releasing at
         t=4.20 exactly, so Scene 5 is numerically frozen. */
      var ATTACK_DUR = 0.22;
      var RELEASE = 0.35;
      var REST_LEVEL = 0.4;
      var MAX_BLUR = 18;
      var MAX_SCALE_BOOST = 0.03;

      /* monotonic, non-overlapping */
      var TIMINGS = {
        ace: { start: 3.0, end: 3.42 },
        five: { start: 3.55, end: 3.85 },
      };

      /* The card face is light, so the pip's rest colour IS the canonical
         card ink (#0C101D) — at env 0 the pip is exactly the Frame-1 pip.
         The lift is a deep violet that still reads at 4.5:1 on the face. */
      var REST_RGB = { r: 12, g: 16, b: 29 }; /* #0C101D — canonical ink */
      var ACTIVE_RGB = { r: 109, g: 40, b: 217 }; /* #6D28D9 violet lift */

      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        var releaseEnd = end + RELEASE;
        if (time < releaseEnd) {
          return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
        }
        return REST_LEVEL;
      }

      function lerpChannel(a, b, t) {
        return Math.round(a + (b - a) * t);
      }

      function colorAt(env) {
        var t = env * 0.6;
        return (
          "rgb(" +
          lerpChannel(REST_RGB.r, ACTIVE_RGB.r, t) +
          ", " +
          lerpChannel(REST_RGB.g, ACTIVE_RGB.g, t) +
          ", " +
          lerpChannel(REST_RGB.b, ACTIVE_RGB.b, t) +
          ")"
        );
      }

      var driver = { t: 0 };

      tl.to(
        driver,
        {
          t: 5,
          duration: 5,
          ease: "none",
          onUpdate: function () {
            for (var i = 0; i < pips.length; i++) {
              var el = pips[i];
              var timing = TIMINGS[el.getAttribute("data-glow")];
              if (!timing) continue;
              var env = envelope(driver.t, timing.start, timing.end);
              var alpha = 0.1 + 0.62 * env;
              var blur = (MAX_BLUR * env).toFixed(2);
              var wide = (MAX_BLUR * 2.2 * env).toFixed(2);
              el.style.filter =
                "drop-shadow(0 0 " +
                blur +
                "px rgba(167, 139, 250, " +
                alpha.toFixed(3) +
                ")) drop-shadow(0 0 " +
                wide +
                "px rgba(139, 92, 246, " +
                (alpha * 0.55).toFixed(3) +
                "))";
              el.style.color = colorAt(env);
              if (el.getAttribute("data-glow") === "ace") {
                el.style.transform =
                  "scale(" + (1 + MAX_SCALE_BOOST * env).toFixed(4) + ")";
              }
            }
          },
        },
        0,
      );

      /* ---- Scene 5 (4.2–5.0s): held. No tween lands in this window. ---- */

      window.__timelines["02-theory"] = tl;
    })();
  </script>
