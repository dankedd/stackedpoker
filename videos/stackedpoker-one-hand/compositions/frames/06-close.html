  <script>
    (function () {
      var g = window.gsap;
      var scope = document.querySelector('[data-composition-id="06-close"]') || document;
      var q = function (sel) { return scope.querySelector(sel); };

      /* ---------------------------------------------------------------
         Rebuild frame 5's 13x13 range grid so the hard cut lands on an
         identical surface. Deterministic: fixed rank table, fixed weights.
      --------------------------------------------------------------- */
      var RANKS = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
      var gridEl = q('#f06close-grid');

      function weightFor(r, c) {
        if (r === 0 && c === 9) return 0.85;            // A5s — brightest
        if (r === 0 && c >= 8 && c <= 12) return 0.5;   // A2s-A6s bluff cluster
        if (r === 0 && c >= 1 && c <= 7) return 0.28;   // the rest of Ax suited
        if (r === c && r <= 6) return 0.22;             // pairs down to 88
        if (r < c && r <= 3 && c <= 4) return 0.24;     // suited broadways
        if (r < c && c - r === 1 && r <= 8) return 0.16; // suited connectors
        return 0.045;
      }

      var frag = document.createDocumentFragment();
      for (var r = 0; r < 13; r++) {
        for (var c = 0; c < 13; c++) {
          var cell = document.createElement('div');
          cell.className = 'f06close-cell';
          cell.textContent =
            r === c ? RANKS[r] + RANKS[c]
              : r < c ? RANKS[r] + RANKS[c] + 's'
                : RANKS[c] + RANKS[r] + 'o';
          // Ported verbatim from Frame 5 so the inherited grid is identical
          // at the 27s seam. Frame 6 previously used its own weightFor(), which
          // lit noticeably more cells than Frame 5 left on screen.
          var F5_HERO_R = 0, F5_HERO_C = 9; /* A5s */
          var F5_CLUSTER = {"0-7":1,"0-8":1,"0-10":1,"0-11":1,"0-12":1,
                            "6-7":1,"7-8":1,"8-9":1,"9-10":1};
          var f5key = r + "-" + c;
          if (r === F5_HERO_R && c === F5_HERO_C) {
            cell.style.background = "rgba(139, 92, 246, 0.92)";
            cell.style.border = "1px solid rgba(167, 139, 250, 0.85)";
          } else if (F5_CLUSTER[f5key]) {
            cell.style.background = "rgba(139, 92, 246, 0.30)";
            cell.style.border = "1px solid rgba(139, 92, 246, 0.38)";
          } else if (r === c) {
            cell.style.background = "rgba(139, 92, 246, 0.09)";
          } else if (r < c) {
            cell.style.background = "rgba(139, 92, 246, 0.055)";
          } else {
            cell.style.background = "rgba(139, 92, 246, 0.035)";
          }
          frag.appendChild(cell);
        }
      }
      gridEl.appendChild(frag);

      /* ---------------------------------------------------------------
         Geometry contract.
         Cards open at 88x186*(2/3) = 88x124 spanning 344-472 x 310-434,
         and land at their authored 132x186 boxes: 818-1102 x 250-436.
      --------------------------------------------------------------- */
      var SCALE_IN = 2 / 3;
      var cardA = q('#f06close-cardA');
      var card5 = q('#f06close-card5');

      /* Initial states live OUTSIDE the timeline — a zero-duration set at
         position 0 does not render while the playhead sits exactly at 0. */
      g.set(cardA, { x: -474, y: 60, scale: SCALE_IN, transformOrigin: '0px 0px', force3D: false });
      g.set(card5, { x: -586, y: 60, scale: SCALE_IN, transformOrigin: '0px 0px', force3D: false });
      g.set('#f06close-centerglow', { opacity: 0 });
      g.set('#f06close-mark', { opacity: 0, y: 10 });
      g.set(['#f06close-h1a', '#f06close-h1b'], { opacity: 0, y: 8 });
      g.set('#f06close-ctawrap', { opacity: 0, y: 12 });
      g.set('#f06close-sub', { opacity: 0, y: 8 });

      var tl = g.timeline({ paused: true });

      /* Scene 1 (0.0-1.0) — the stage clears; only the cards survive,
         travelling home in one continuous move. */
      tl.to(['#f06close-lesson', '#f06close-coach', '#f06close-spot'],
        { opacity: 0, duration: 0.9, ease: 'power3.inOut' }, 0);
      tl.to('#f06close-centerglow',
        { opacity: 1, duration: 1.2, ease: 'power3.out' }, 0.1);
      tl.to(cardA,
        { x: 0, y: 0, scale: 1, duration: 1.1, ease: 'power3.out' }, 0);
      tl.to(card5,
        { x: 0, y: 0, scale: 1, duration: 1.1, ease: 'power3.out' }, 0);

      /* Scene 2 (1.0-1.7) — the mark resolves below them. */
      tl.to('#f06close-mark',
        { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 1.0);

      /* Scene 3 (1.7-2.4) — the headline, two lines a beat apart. */
      tl.to('#f06close-h1a',
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 1.7);
      tl.to('#f06close-h1b',
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 1.9);

      /* Scene 4 (2.4-2.8) — the one solid element in the film. */
      tl.to('#f06close-ctawrap',
        { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 2.4);
      tl.to('#f06close-sub',
        { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out' }, 2.5);

      /* Scene 5 (2.8-3.0) — completely still. */

      window.__timelines = window.__timelines || {};
      window.__timelines['06-close'] = tl;
    })();
