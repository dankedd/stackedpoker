    <script>
      (function () {
        var root =
          (document.currentScript &&
            document.currentScript.closest(

            )) ||
          document.querySelector('[data-composition-id="05-explanation"]');

        /* ---------- build the 13x13 range grid (inherited, lit as Frame 4 left it) ---------- */
        var RANKS = ["A", "K", "Q", "J", "T", "9", "8", "7", "6", "5", "4", "3", "2"];
        var STEP = 43;
        var HERO_R = 0,
          HERO_C = 9; /* A5s */
        var CLUSTER = {
          "0-7": 1,
          "0-8": 1,
          "0-10": 1,
          "0-11": 1,
          "0-12": 1,
          "6-7": 1,
          "7-8": 1,
          "8-9": 1,
          "9-10": 1
        };

        var host = root.querySelector("#f05-gridhost");
        var frag = document.createDocumentFragment();

        /* soft glow behind the hero cell */
        var glow = document.createElement("div");
        glow.className = "f05-glow";
        glow.style.left = HERO_C * STEP + 20 - 84 + "px";
        glow.style.top = HERO_R * STEP + 20 - 84 + "px";
        frag.appendChild(glow);

        for (var r = 0; r < 13; r++) {
          for (var c = 0; c < 13; c++) {
            var cell = document.createElement("div");
            cell.className = "f05-cell";
            cell.style.left = c * STEP + "px";
            cell.style.top = r * STEP + "px";

            var key = r + "-" + c;
            if (r === HERO_R && c === HERO_C) {
              cell.style.background = "rgba(139, 92, 246, 0.92)";
              cell.style.border = "1px solid rgba(167, 139, 250, 0.85)";
            } else if (CLUSTER[key]) {
              cell.style.background = "rgba(139, 92, 246, 0.30)";
              cell.style.border = "1px solid rgba(139, 92, 246, 0.38)";
            } else if (r === c) {
              cell.style.background = "rgba(139, 92, 246, 0.09)";
            } else if (r < c) {
              cell.style.background = "rgba(139, 92, 246, 0.055)";
            } else {
              cell.style.background = "rgba(139, 92, 246, 0.035)";
            }
            frag.appendChild(cell);
          }
        }

        /* row / column labels, text-light, very small */
        for (var i = 0; i < 13; i++) {
          var col = document.createElement("div");
          col.className = "f05-lbl";
          col.textContent = RANKS[i];
          col.style.left = i * STEP + "px";
          col.style.top = "-18px";
          frag.appendChild(col);

          var row = document.createElement("div");
          row.className = "f05-lbl row";
          row.textContent = RANKS[i];
          // Right of the grid (host-relative 564 -> absolute 1034), matching
          // Frame 4, which places its row axis at absolute 1264 — 8px right of
          // its grid edge. On the left these labels landed at absolute 450 and

          row.style.left = "564px";
          row.style.top = i * STEP + 15 + "px";
          frag.appendChild(row);
        }
        host.appendChild(frag);

        /* ---------- hidden states (outside the timeline) ---------- */
        var coach = root.querySelector("#f05-coach");
        var head = root.querySelector("#f05-head");
        var sep = root.querySelector("#f05-sep");
        var words = root.querySelectorAll("#f05-sentence .f05-word");
        var em1 = root.querySelector("#f05-em1");
        var em2 = root.querySelector("#f05-em2");
        var em3 = root.querySelector("#f05-em3");
        var uls = root.querySelectorAll("#f05-sentence .f05-ul");

        gsap.set(coach, { opacity: 0, transformOrigin: "50% 50%" });

        gsap.set(sep, { scaleX: 0, transformOrigin: "0% 50%" });

        gsap.set(uls, { scaleX: 0, transformOrigin: "0% 50%" });

        /* ---------- timeline ---------- */
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        /* Scene 1 (0.0-0.3): inherited state, static. Nothing re-enters. */

        /* Scene 2 (0.3-1.3): the whole lesson surface slides left, x530 -> x300.
           Grid + poker cards travel with it as one object. */
        tl.fromTo(
          "#f05-lesson",
          { x: 0 },
          { x: -230, duration: 1.0, ease: "power3.inOut" },
          0.3
        );

        /* Scene 3 (1.3-2.3): the AI Coach panel opens — soft horizontal
           expansion, glass-slide. A small header identifies it. */
        tl.fromTo(
          "#f05-coach",
          { opacity: 0, x: 26, scaleX: 0.9 },
          { opacity: 1, x: 0, scaleX: 1, duration: 0.85, ease: "power3.out" },

        tl.fromTo(
          "#f05-head",

          { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" },
          1.62
        );
        tl.fromTo(
          "#f05-sep",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.7, ease: "power3.out" },
          1.72
        );

        /* Scene 4 (2.3-3.6): one written explanation, per-word staggered. */
        tl.fromTo(
          words,
          { opacity: 0, y: 10 },
          {
            opacity: 1,
            y: 0,
            duration: 0.5,
            ease: "power3.out",
            stagger: 0.055
          },
          2.3
        );

        /* Scene 5 (3.55-4.19): three phrases receive subtle emphasis,
           one after another. Nothing else moves. */
        var EM = [
          { group: em1, at: 3.55 },
          { group: em2, at: 3.72 },
          { group: em3, at: 3.89 }
        ];
        for (var e = 0; e < EM.length; e++) {
          tl.to(
            EM[e].group.querySelectorAll(".f05-word"),
            { color: "#E6EAF0", duration: 0.3, ease: "power3.out" },
            EM[e].at
          );
          tl.fromTo(
            EM[e].group.querySelector(".f05-ul"),
            { scaleX: 0 },
            { scaleX: 1, duration: 0.3, ease: "power3.out" },
            EM[e].at
          );
        }

        /* Scene 6 (4.19-5.0): held. */

        window.__timelines["05-explanation"] = tl;
      })();
