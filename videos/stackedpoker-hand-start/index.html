<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0D1526; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!--
      StackedPoker - "The hand is only the start." 1080x1920, 24.0s.

      Lesson `they-raised-back` (Preflop Aggression), step `trb-final-5`:
      6-max, Hero HJ with T-hearts T-clubs, 100bb. UTG folds, HJ opens to 2.3,
      CO 3-bets to 7.5. The lesson's own best answer is Call.

      The reference film's transferable idea is DEPTH - product surfaces live in
      one perspective and move through it. Every frame here shares a single
      2200px perspective origin, so "further away" means the same thing
      throughout: the table tilts back as the decision comes forward, and the
      grid tilts back as the reason comes forward.

      No injected transitions - every cut is a hard cut between two numerically
      identical frozen states.
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="24"
         data-width="1080" data-height="1920">

      <div id="el-01-hand" class="scene" data-composition-id="01-hand"
           data-composition-src="compositions/frames/01-hand.html"
           data-start="0.0" data-duration="2.0" data-track-index="1"></div>
      <div id="el-02-context" class="scene" data-composition-id="02-context"
           data-composition-src="compositions/frames/02-context.html"
           data-start="2.0" data-duration="2.0" data-track-index="1"></div>
      <div id="el-03-action" class="scene" data-composition-id="03-action"
           data-composition-src="compositions/frames/03-action.html"
           data-start="4.0" data-duration="1.8" data-track-index="1"></div>
      <div id="el-04-decision" class="scene" data-composition-id="04-decision"
           data-composition-src="compositions/frames/04-decision.html"
           data-start="5.8" data-duration="2.0" data-track-index="1"></div>
      <div id="el-05-range" class="scene" data-composition-id="05-range"
           data-composition-src="compositions/frames/05-range.html"
           data-start="7.8" data-duration="2.4" data-track-index="1"></div>
      <div id="el-06-depth" class="scene" data-composition-id="06-depth"
           data-composition-src="compositions/frames/06-depth.html"
           data-start="10.2" data-duration="2.4" data-track-index="1"></div>
      <div id="el-07-why" class="scene" data-composition-id="07-why"
           data-composition-src="compositions/frames/07-why.html"
           data-start="12.6" data-duration="2.2" data-track-index="1"></div>
      <div id="el-08-coach" class="scene" data-composition-id="08-coach"
           data-composition-src="compositions/frames/08-coach.html"
           data-start="14.8" data-duration="2.4" data-track-index="1"></div>
      <div id="el-09-system" class="scene" data-composition-id="09-system"
           data-composition-src="compositions/frames/09-system.html"
           data-start="17.2" data-duration="2.2" data-track-index="1"></div>
      <div id="el-10-payoff" class="scene" data-composition-id="10-payoff"
           data-composition-src="compositions/frames/10-payoff.html"
           data-start="19.4" data-duration="2.2" data-track-index="1"></div>
      <div id="el-11-cta" class="scene" data-composition-id="11-cta"
           data-composition-src="compositions/frames/11-cta.html"
           data-start="21.6" data-duration="2.4" data-track-index="1"></div>

      <audio id="el-01-hand-voice" src="assets/voice/hs/h1.wav"
             data-start="0.0" data-duration="1.92" data-track-index="10" data-volume="1"></audio>
      <audio id="el-02-context-voice" src="assets/voice/hs/h2.wav"
             data-start="2.0" data-duration="2.12" data-track-index="10" data-volume="1"></audio>
      <audio id="el-06-depth-voice" src="assets/voice/hs/h3.wav"
             data-start="10.2" data-duration="4.33" data-track-index="10" data-volume="1"></audio>
      <audio id="el-11-cta-voice" src="assets/voice/hs/h5.wav"
             data-start="21.6" data-duration="2.27" data-track-index="10" data-volume="1"></audio>

      <audio id="el-bgm" src="assets/bgm/track.mp3"
             data-start="0" data-duration="24" data-track-index="11" data-volume="0.74"></audio>

      <audio id="el-sfx-00-u-swell-long" src="assets/sfx/u-swell-long.mp3" data-start="0.0" data-duration="3.0" data-track-index="20" data-volume="0.14"></audio>  <!-- the room opens -->
      <audio id="el-sfx-01-u-card" src="assets/sfx/u-card.mp3" data-start="0.14" data-duration="0.26" data-track-index="21" data-volume="0.34"></audio>  <!-- the first ten -->
      <audio id="el-sfx-02-u-card" src="assets/sfx/u-card.mp3" data-start="0.25" data-duration="0.26" data-track-index="22" data-volume="0.3"></audio>  <!-- the second -->
      <audio id="el-sfx-03-u-glass" src="assets/sfx/u-glass.mp3" data-start="2.25" data-duration="1.62" data-track-index="23" data-volume="0.24"></audio>  <!-- the table forms -->
      <audio id="el-sfx-04-u-tick" src="assets/sfx/u-tick.mp3" data-start="4.06" data-duration="0.35" data-track-index="24" data-volume="0.11"></audio>  <!-- small blind -->
      <audio id="el-sfx-05-u-tick" src="assets/sfx/u-tick.mp3" data-start="4.15" data-duration="0.35" data-track-index="25" data-volume="0.11"></audio>  <!-- big blind -->
      <audio id="el-sfx-06-u-tick" src="assets/sfx/u-tick.mp3" data-start="4.4" data-duration="0.35" data-track-index="26" data-volume="0.15"></audio>  <!-- Hero opens -->
      <audio id="el-sfx-07-u-accent" src="assets/sfx/u-accent.mp3" data-start="3.65" data-duration="2.4" data-track-index="27" data-volume="0.2"></audio>  <!-- peaks on CO's 3-bet at 4.80 -->
      <audio id="el-sfx-08-u-glass" src="assets/sfx/u-glass.mp3" data-start="6.2" data-duration="1.62" data-track-index="28" data-volume="0.22"></audio>  <!-- the decision comes forward -->
      <audio id="el-sfx-09-u-tick" src="assets/sfx/u-tick.mp3" data-start="6.35" data-duration="0.35" data-track-index="29" data-volume="0.12"></audio>  <!-- Call -->
      <audio id="el-sfx-10-u-tick" src="assets/sfx/u-tick.mp3" data-start="6.45" data-duration="0.35" data-track-index="30" data-volume="0.12"></audio>  <!-- 4-Bet -->
      <audio id="el-sfx-11-u-tick" src="assets/sfx/u-tick.mp3" data-start="6.55" data-duration="0.35" data-track-index="31" data-volume="0.12"></audio>  <!-- Fold -->
      <audio id="el-sfx-12-u-tick" src="assets/sfx/u-tick.mp3" data-start="7.9" data-duration="0.35" data-track-index="32" data-volume="0.16"></audio>  <!-- Call resolves -->
      <audio id="el-sfx-13-u-shimmer" src="assets/sfx/u-shimmer.mp3" data-start="8.36" data-duration="3.32" data-track-index="33" data-volume="0.19"></audio>  <!-- peaks as the grid lands at 9.06 -->
      <audio id="el-sfx-14-u-tick" src="assets/sfx/u-tick.mp3" data-start="10.5" data-duration="0.35" data-track-index="34" data-volume="0.15"></audio>  <!-- UTG -->
      <audio id="el-sfx-15-u-tick" src="assets/sfx/u-tick.mp3" data-start="10.98" data-duration="0.35" data-track-index="35" data-volume="0.15"></audio>  <!-- CO -->
      <audio id="el-sfx-16-u-tick" src="assets/sfx/u-tick.mp3" data-start="11.46" data-duration="0.35" data-track-index="36" data-volume="0.15"></audio>  <!-- BTN -->
      <audio id="el-sfx-17-u-tick" src="assets/sfx/u-tick.mp3" data-start="11.94" data-duration="0.35" data-track-index="37" data-volume="0.15"></audio>  <!-- BB defend -->
      <audio id="el-sfx-18-u-glass" src="assets/sfx/u-glass.mp3" data-start="12.9" data-duration="1.62" data-track-index="38" data-volume="0.2"></audio>  <!-- the reason -->
      <audio id="el-sfx-19-u-glass" src="assets/sfx/u-glass.mp3" data-start="15.22" data-duration="1.62" data-track-index="39" data-volume="0.18"></audio>  <!-- the coach -->
      <audio id="el-sfx-20-u-tick" src="assets/sfx/u-tick.mp3" data-start="17.54" data-duration="0.35" data-track-index="40" data-volume="0.1"></audio>  <!-- module 1 -->
      <audio id="el-sfx-21-u-tick" src="assets/sfx/u-tick.mp3" data-start="17.78" data-duration="0.35" data-track-index="41" data-volume="0.1"></audio>  <!-- module 2 -->
      <audio id="el-sfx-22-u-tick" src="assets/sfx/u-tick.mp3" data-start="18.02" data-duration="0.35" data-track-index="42" data-volume="0.1"></audio>  <!-- module 3 -->
      <audio id="el-sfx-23-u-tick" src="assets/sfx/u-tick.mp3" data-start="18.26" data-duration="0.35" data-track-index="43" data-volume="0.1"></audio>  <!-- module 4 -->
      <audio id="el-sfx-24-u-tick" src="assets/sfx/u-tick.mp3" data-start="18.5" data-duration="0.35" data-track-index="44" data-volume="0.1"></audio>  <!-- module 5 -->
      <audio id="el-sfx-25-u-tick" src="assets/sfx/u-tick.mp3" data-start="18.74" data-duration="0.35" data-track-index="45" data-volume="0.1"></audio>  <!-- module 6 -->
      <audio id="el-sfx-26-u-accent" src="assets/sfx/u-accent.mp3" data-start="19.45" data-duration="2.4" data-track-index="46" data-volume="0.24"></audio>  <!-- peaks on UNDERSTAND THE DECISION at 20.60 -->
      <audio id="el-sfx-27-u-tick" src="assets/sfx/u-tick.mp3" data-start="22.84" data-duration="0.35" data-track-index="47" data-volume="0.11"></audio>  <!-- the CTA -->
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });

  </body>
</html>
