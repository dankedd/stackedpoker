<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0C101D;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-the-question"
        class="scene"
        data-composition-id="01-the-question"
        data-composition-src="compositions/frames/01-the-question.html"
        data-start="0"
        data-duration="7"
        data-track-index="0"
      ></div>
      <audio
        id="el-01-the-question-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="7"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-understand-why"
        class="scene"
        data-composition-id="02-understand-why"
        data-composition-src="compositions/frames/02-understand-why.html"
        data-start="7"
        data-duration="5.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-understand-why-voice"
        src="assets/voice/02.wav"
        data-start="7"
        data-duration="5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-understanding"
        class="scene"
        data-composition-id="03-understanding"
        data-composition-src="compositions/frames/03-understanding.html"
        data-start="12"
        data-duration="6.5"
        data-track-index="0"
      ></div>
      <audio
        id="el-03-understanding-voice"
        src="assets/voice/03.wav"
        data-start="12"
        data-duration="6"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-one-place"
        class="scene"
        data-composition-id="04-one-place"
        data-composition-src="compositions/frames/04-one-place.html"
        data-start="18"
        data-duration="6.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-one-place-voice"
        src="assets/voice/04.wav"
        data-start="18"
        data-duration="6"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-05-hero"
        class="scene"
        data-composition-id="05-hero"
        data-composition-src="compositions/frames/05-hero.html"
        data-start="24"
        data-duration="6"
        data-track-index="0"
      ></div>
      <audio
        id="el-05-hero-voice"
        src="assets/voice/05.wav"
        data-start="24"
        data-duration="6"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/track.mp3"
        data-start="0"
        data-duration="30"
        data-track-index="11"
        data-volume="0.3"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-02-understand-why", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 12);
        tl.fromTo("#el-03-understanding", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 12);
        tl.to("#el-03-understanding", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 18);
        tl.fromTo("#el-04-one-place", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 18);
        tl.to("#el-04-one-place", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 24);
        tl.fromTo("#el-05-hero", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 24);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
