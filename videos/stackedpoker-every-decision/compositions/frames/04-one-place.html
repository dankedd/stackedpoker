                  <span class="f04-dot"></span><span class="f04-dot"></span><span class="f04-dot"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["04-one-place"] = tl;

        var q = function (s) {
          return document.querySelector(s);
        };

        var DURATION = 6;

        /* =========================================================
           THE CAMERA — ONE continuous decelerating pull-back.
           Same ease family and the same unhurried rate as frame 01:
           log-space scale eased with outCubic, no re-push, no second
           tween. A single linear clock proxy drives one writer, so
           every seek is order-independent and deterministic.
           ========================================================= */
        var cam = q("#f04-cam");
        var midPlane = q("#f04-plane-mid");
        var farPlane = q("#f04-plane-far");

        var S0 = 2.42; // opening scale — the core dashboard fills the frame
        var Z0 = Math.log(S0);

        var SETTLE_DUR = 0.8, // Scene 1: frame 3's move still bleeding off
          SETTLE_AMT = 0.012;
        var PULL_AT = 0.8, // Scene 2: the widening
          PULL_DUR = 3.9; // decelerates to a full stop at 4.7s (Scene 3)

        // parallax depth: nearest = camera rate only, furthest = fastest
        var K_MID = 0.1,
          K_FAR = 0.24;

        var DRIFT_AMP_X = 3,
          DRIFT_AMP_Y = 2,
          DRIFT_CYCLES = 1.15,
          DRIFT_FREQ_RATIO = 1.3;
        var DAMP_AT = 3.6,
          DAMP_DUR = 1.1; // drift is exactly zero from 4.7s on

        var CLOCK = { t: 0 };

        function clamp01(v) {
          return v < 0 ? 0 : v > 1 ? 1 : v;
        }
        function outCubic(p) {
          var i = 1 - p;
          return 1 - i * i * i;
        }
        function outQuart(p) {
          var i = 1 - p;
          return 1 - i * i * i * i;
        }

        function writeCamera() {
          var t = CLOCK.t;

          // the one pull-back, in log space so the widening reads evenly
          var p = clamp01((t - PULL_AT) / PULL_DUR);
          var s = Math.exp(Z0 * (1 - outCubic(p)));

          // residual of the previous shot decaying to nothing by 0.8s —
          // same direction as the pull, so it flows straight into it
          var q0 = clamp01(t / SETTLE_DUR);
          s *= 1 + SETTLE_AMT * (1 - outCubic(q0));

          // organic drift, enveloped to zero when the camera lands
          var env =
            t <= DAMP_AT ? 1 : t >= DAMP_AT + DAMP_DUR ? 0 : 1 - outCubic((t - DAMP_AT) / DAMP_DUR);
          var ph = (t / DURATION) * Math.PI * 2 * DRIFT_CYCLES;
          var dx = Math.sin(ph) * DRIFT_AMP_X * env;
          var dy = Math.sin(ph * DRIFT_FREQ_RATIO) * DRIFT_AMP_Y * env;

          cam.style.transform = "scale(" + s + ") translate(" + dx + "px, " + dy + "px)";

          // three planes, three rates — depth, not a wall
          midPlane.style.transform = "scale(" + (1 + K_MID * (1 - outCubic(p))) + ")";
          farPlane.style.transform = "scale(" + (1 + K_FAR * (1 - outQuart(p))) + ")";
        }
        writeCamera(); // t=0 state correct before the first seek

        tl.fromTo(
          CLOCK,
          { t: 0 },
          { t: DURATION, duration: DURATION, ease: "none", onUpdate: writeCamera },
          0,
        );

        /* =========================================================
           SCENE 3 (3.6–4.8s) — the planes settle apart on depth of
           field: nearest crisp, furthest softened. The blur is a
           resting state that eases DOWN as the camera stops; it is
           not an entrance, the surfaces were always there.
           ========================================================= */
        tl.fromTo(
          "#f04-plane-mid",
          { "--dof": "3px" },
          { "--dof": "1.2px", duration: 2.2, ease: "power2.inOut" },
          2.4,
        );
        tl.fromTo(
          "#f04-plane-far",
          { "--dof": "5px" },
          { "--dof": "3px", duration: 2.2, ease: "power2.inOut" },
          2.4,
        );

        /* =========================================================
           SCENE 2→3 — as each plane becomes legible its own detail
           resolves. Index-derived stagger only; nothing arrives from
           nothing, the contents simply come into focus.
           ========================================================= */

        // far plane: the module rail resolves first (it enters frame first)
        tl.fromTo(
          ".f04-mod",
          { opacity: 0.42 },
          { opacity: 1, duration: 0.6, ease: "power2.out", stagger: 0.085 },
          2.15,
        );
        tl.fromTo(
          ".f04-mod-fill",
          { scaleX: 0.18 },
          { scaleX: 1, duration: 0.75, ease: "power3.out", stagger: 0.085 },
          2.3,
        );

        // mid plane: the drill grid lights up cell by cell
        tl.fromTo(
          ".f04-cell",
          { opacity: 0.24 },
          { opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.014 },
          2.75,
        );

        // near plane: the coach is already talking
        tl.fromTo(
          ".f04-dot",
          { opacity: 0.25, scale: 0.7 },
          { opacity: 1, scale: 1, duration: 0.34, ease: "power2.out", stagger: 0.12 },
          3.05,
        );

        // mid plane: the progress ring draws as the camera decelerates
        var ring = q("#f04-ring");
        var RING_LEN = ring.getTotalLength();
        ring.style.strokeDasharray = RING_LEN;
        ring.style.strokeDashoffset = RING_LEN;
        tl.to(
          ring,
          { strokeDashoffset: RING_LEN * 0.28, duration: 0.95, ease: "power3.out" },
          3.45,
        );
        tl.fromTo(
          ".f04-pchip",
          { opacity: 0.35 },
          { opacity: 1, duration: 0.45, ease: "power2.out", stagger: 0.12 },
          3.9,
        );

        /* =========================================================
           SCENE 3 tail (4.1–5.1s) — the outermost surface, the
           bankroll curve, is the last thing to resolve.
           ========================================================= */
        var curve = q("#f04-curve");
        var CURVE_LEN = curve.getTotalLength() * 1.02;
        curve.style.strokeDasharray = CURVE_LEN;
        curve.style.strokeDashoffset = CURVE_LEN;
        tl.to(curve, { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" }, 4.05);
        tl.to("#f04-curve-area", { fillOpacity: 1, duration: 0.42, ease: "power1.out" }, 4.62);
        tl.fromTo(
          "#f04-curve-dot",
          { opacity: 0, scale: 0.4 },
          { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" },
          4.82,
        );

        /* =========================================================
           SCENE 4 (4.8–6.0s) — held. The camera does not move again.
           The only life left is a barely-there jitter on the NEAREST
           plane, enveloped so it starts and ends at exactly zero.
           Its own wrapper, so nothing else writes this transform.
           ========================================================= */
        var jit = q("#f04-jit");
        var JIT = { p: 0 };
        var JIT_CYCLES = 1.05,
          JIT_AMP = 1.3,
          JIT_END = Math.PI * 2 * JIT_CYCLES;
        tl.fromTo(
          JIT,
          { p: 0 },
          {
            p: JIT_END,
            duration: 1.2,
            ease: "none",
            onUpdate: function () {
              var u = JIT.p / JIT_END;
              var e = Math.sin(Math.PI * u); // 0 at both ends: no pop, dead still after
              jit.style.transform =
                "translate(" +
                Math.sin(JIT.p) * JIT_AMP * e +
                "px, " +
                Math.sin(JIT.p * 1.3) * JIT_AMP * 0.6 * e +
                "px)";
            },
          },
          4.8,
        );
      })();
    </script>
  </div>
</template>
