  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="03-understanding"]');
      var $ = function (s) { return root.querySelector(s); };
      var SVGNS = "http://www.w3.org/2000/svg";

      /* ═══════════════════════════════════════════════════════════════════
         THE MORPH ENGINE

         One container is held as hero for the whole frame. It never cuts and
         it never swaps: its proportions, radius and surface tint are written
         every rendered frame from a single clock by a single writer.

         Shape is carried on TWO surfaces that are mathematically locked to
         the same rectangle:
           · .f03-shell  — the glass + hairline, reached by a non-layout
                           transform (no width/height tween anywhere).
           · .f03-clip   — the content plane, clipped by the identical
                           rounded rect, so contents genuinely clip as the
                           shape changes instead of overflowing.
         Because both are derived from ONE state object in ONE function, they
         can never drift apart mid-morph.
         ═══════════════════════════════════════════════════════════════════ */
      var CX = 960, CY = 470;          // the held centre — constant, camera holds
      var BASE_W = 1560, BASE_H = 660; // shell base = the largest state

      /*  w      h     r    fill-alpha  stroke-alpha */
      var STATES = [
        { w: 900,  h: 640, r: 14, f: 0.040, s: 0.20 }, // 01 range trainer
        { w: 1180, h: 520, r: 12, f: 0.050, s: 0.20 }, // 02 board builder
        { w: 1320, h: 640, r: 14, f: 0.045, s: 0.22 }, // 03 decision spot
        { w: 1000, h: 600, r: 12, f: 0.040, s: 0.20 }, // 04 lesson
        { w: 700,  h: 400, r: 14, f: 0.060, s: 0.28 }, // 05 achievement
        { w: 1560, h: 660, r: 14, f: 0.035, s: 0.20 }  // 06 dashboard
      ];

      /* five handoffs, each shorter than the last — the film's own pacing */
      var MORPHS = [
        { at: 0.95, dur: 0.72 },
        { at: 1.96, dur: 0.68 },
        { at: 2.96, dur: 0.64 },
        { at: 3.94, dur: 0.60 },
        { at: 4.92, dur: 0.56 }
      ];

      var shell = $("#f03-shell");
      var rect = $("#f03-rect");
      var clipper = $("#f03-clip");
      var trav = $("#f03-trav");
      var PIP_PITCH = 44;

      function power2InOut(p) {
        return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      }
      function lerp(a, b, p) { return a + (b - a) * p; }

      function write(w, h, r, f, s, idx) {
        var sx = w / BASE_W, sy = h / BASE_H;
        shell.style.transform = "scale(" + sx + "," + sy + ")";
        /* radius is pre-scale on both axes, so the APPARENT corner stays
           circular and lands exactly on r no matter the proportion */
        rect.setAttribute("rx", r / sx);
        rect.setAttribute("ry", r / sy);
        rect.setAttribute("fill", "rgba(139,92,246," + f + ")");
        rect.setAttribute("stroke", "rgba(139,92,246," + s + ")");

        var top = CY - h / 2, left = CX - w / 2;
        clipper.style.clipPath =
          "inset(" + top + "px " + (1920 - CX - w / 2) + "px " +
          (1080 - CY - h / 2) + "px " + left + "px round " + r + "px)";

        trav.style.transform = "translateX(" + (idx * PIP_PITCH) + "px)";
      }

      /* the ONE clock. Derived state, so a seek to any time reproduces the
         exact same rectangle — no stored progress, no randomness. */
      var CLOCK = { t: 0 };
      function tick() {
        var t = CLOCK.t, i, m;
        var a = STATES[0], idx = 0, p = 0, b = null;
        for (i = 0; i < MORPHS.length; i++) {
          m = MORPHS[i];
          if (t >= m.at + m.dur) { idx = i + 1; a = STATES[i + 1]; }
          else if (t > m.at) {
            p = power2InOut((t - m.at) / m.dur);
            a = STATES[i]; b = STATES[i + 1]; idx = i + p;
            break;
          } else break;
        }
        if (b) {
          write(lerp(a.w, b.w, p), lerp(a.h, b.h, p), lerp(a.r, b.r, p),
                lerp(a.f, b.f, p), lerp(a.s, b.s, p), idx);
        } else {
          write(a.w, a.h, a.r, a.f, a.s, idx);
        }
      }
      tick(); // frame 0 is correct before the first seek

      /* ═══════════════════════════════════════════════════════════════════
         SURFACE CONTENT — built synchronously and deterministically.
         Every grid, board and seat here is a VISUAL MODEL of a StackedPoker
         surface. No frequency, EV or solver output is printed anywhere.
         ═══════════════════════════════════════════════════════════════════ */
      var RANKS = ["A", "K", "Q", "J", "T", "9", "8", "7", "6", "5", "4", "3", "2"];
      function handLabel(r, c) {
        if (r === c) return RANKS[r] + RANKS[r];
        return c > r ? RANKS[r] + RANKS[c] + "s" : RANKS[c] + RANKS[r] + "o";
      }
      function inOpen(r, c) {
        if (r === c) return r <= 9;
        return c > r ? (r + c) <= 12 : (r + c) <= 8;
      }

      /* 01 — the 13×13 (cell 30 + gap 3 = 426) */
      var gridHost = $("#f03-grid");
      var cells = [];
      for (var r = 0; r < 13; r++) {
        for (var c = 0; c < 13; c++) {
          var cell = document.createElement("div");
          cell.className = "f03-cell";
          cell.style.left = (c * 33) + "px";
          cell.style.top = (r * 33) + "px";
          var strength = r === c ? 0.85 : (c > r ? 0.62 : 0.4);
          var fillEl = document.createElement("i");
          fillEl.style.background = "rgba(139,92,246," + strength + ")";
          cell.appendChild(fillEl);
          var lab = document.createElement("b");
          lab.textContent = handLabel(r, c);
          cell.appendChild(lab);
          gridHost.appendChild(cell);
          if (inOpen(r, c)) cells.push({ fill: fillEl, dist: Math.max(r, c) });
        }
      }

      /* suits are drawn — the shipped font carries no suit glyphs */
      var SUITS = {
        s: { d: "M12 2 C6 8 3 10 3 14 A4.6 4.6 0 0 0 11 17.2 L10 22 H14 L13 17.2 A4.6 4.6 0 0 0 21 14 C21 10 18 8 12 2 Z", fill: "#121726" },
        h: { d: "M12 21.4 C6 16.2 2 12.4 2 8.4 A4.6 4.6 0 0 1 12 6.2 A4.6 4.6 0 0 1 22 8.4 C22 12.4 18 16.2 12 21.4 Z", fill: "#b41c22" },
        d: { d: "M12 2 L21 12 L12 22 L3 12 Z", fill: "#b41c22" },
        c: { d: "M12 2 A4.4 4.4 0 0 1 15.2 9.4 A4.4 4.4 0 1 1 16.4 17.6 A4.4 4.4 0 0 1 13 15.6 L14 22 H10 L11 15.6 A4.4 4.4 0 0 1 7.6 17.6 A4.4 4.4 0 1 1 8.8 9.4 A4.4 4.4 0 0 1 12 2 Z", fill: "#121726" }
      };
      function miniCard(rank, suit, w, h) {
        var el = document.createElement("div");
        el.className = "f03-mini";
        el.style.width = w + "px";
        el.style.height = h + "px";
        el.innerHTML = "<span>" + rank + "</span>" +
          '<svg viewBox="0 0 24 24"><path d="' + SUITS[suit].d + '" fill="' + SUITS[suit].fill + '"></path></svg>';
        return el;
      }

      /* 02 — tray of seven, one of them flies into the third flop slot */
      var TRAY = [["A", "s"], ["K", "h"], ["Q", "d"], ["J", "c"], ["T", "s"], ["9", "h"], ["8", "d"]];
      var tray = $("#f03-tray");
      var trayEls = [];
      for (var t2 = 0; t2 < TRAY.length; t2++) {
        var mc = miniCard(TRAY[t2][0], TRAY[t2][1], 96, 128);
        mc.style.left = (188 + t2 * 118) + "px";
        mc.style.top = "100px";
        tray.appendChild(mc);
        trayEls.push(mc);
      }
      trayEls[3].style.opacity = "0.18";
      var fly = miniCard(TRAY[3][0], TRAY[3][1], 96, 128);
      fly.id = "f03-fly";
      fly.style.left = "542px";
      fly.style.top = "100px";
      fly.style.zIndex = "20";
      $("#f03-flywrap").appendChild(fly);
      var FLY_DX = 688 - 542, FLY_DY = 302 - 100;

      /* 03 — six seats, a pot, a three-card board */
      var seatsG = $("#f03-seats");
      var POS = ["UTG", "HJ", "CO", "BTN", "SB", "BB"];
      var seatEls = [];
      for (var k = 0; k < 6; k++) {
        var ang = (-90 + k * 60) * Math.PI / 180;
        var sxp = 624 + 412 * Math.cos(ang);
        var syp = 176 + 172 * Math.sin(ang);
        var g = document.createElementNS(SVGNS, "g");
        g.setAttribute("class", k === 3 ? "f03-seat f03-seat-hero" : "f03-seat");
        g.style.transformOrigin = sxp + "px " + syp + "px";
        var cc = document.createElementNS(SVGNS, "circle");
        cc.setAttribute("cx", sxp); cc.setAttribute("cy", syp); cc.setAttribute("r", 34);
        var tt = document.createElementNS(SVGNS, "text");
        tt.setAttribute("x", sxp); tt.setAttribute("y", syp + 1);
        tt.textContent = POS[k];
        g.appendChild(cc); g.appendChild(tt);
        seatsG.appendChild(g);
        seatEls.push(g);
      }
      /* pot — a label and a chip stack, never a figure */
      var potG = $("#f03-pot");
      var potLbl = document.createElementNS(SVGNS, "text");
      potLbl.setAttribute("x", 624); potLbl.setAttribute("y", 78);
      potLbl.setAttribute("text-anchor", "middle");
      potLbl.setAttribute("font-family", "Geist Mono, monospace");
      potLbl.setAttribute("font-size", "13");
      potLbl.setAttribute("letter-spacing", "0.06em");
      potLbl.setAttribute("fill", "#728297");
      potLbl.textContent = "POT";
      potG.appendChild(potLbl);
      for (var ch = 0; ch < 5; ch++) {
        var chip = document.createElementNS(SVGNS, "circle");
        chip.setAttribute("cx", 590 + ch * 17);
        chip.setAttribute("cy", 104);
        chip.setAttribute("r", 8);
        chip.setAttribute("fill", "rgba(139,92,246," + (0.28 + ch * 0.11) + ")");
        potG.appendChild(chip);
      }
      var boardG = $("#f03-board");
      var BOARD = [["9", "s"], ["7", "h"], ["2", "d"]];
      for (var bd = 0; bd < 3; bd++) {
        var bx = 540 + bd * 58;
        var br = document.createElementNS(SVGNS, "rect");
        br.setAttribute("x", bx); br.setAttribute("y", 140);
        br.setAttribute("width", 52); br.setAttribute("height", 74);
        br.setAttribute("rx", 7); br.setAttribute("fill", "#e6eaf0");
        boardG.appendChild(br);
        var brt = document.createElementNS(SVGNS, "text");
        brt.setAttribute("x", bx + 9); brt.setAttribute("y", 165);
        brt.setAttribute("font-size", "22"); brt.setAttribute("font-weight", "700");
        brt.setAttribute("fill", "#121726");
        brt.setAttribute("font-family", "Geist, sans-serif");
        brt.textContent = BOARD[bd][0];
        boardG.appendChild(brt);
        var bsp = document.createElementNS(SVGNS, "path");
        bsp.setAttribute("d", SUITS[BOARD[bd][1]].d);
        bsp.setAttribute("fill", SUITS[BOARD[bd][1]].fill);
        bsp.setAttribute("transform", "translate(" + (bx + 26) + ",174) scale(0.88)");
        boardG.appendChild(bsp);
      }

      /* 05 — twelve marks, the record. No shimmer, no burst, no green. */
      var ticksHost = $("#f03-ticks");
      for (var tk = 0; tk < 12; tk++) {
        var tick2 = document.createElement("div");
        tick2.className = "f03-tick";
        tick2.style.left = (40 + tk * 14) + "px";
        tick2.style.top = "300px";
        ticksHost.appendChild(tick2);
      }

      /* 06 — the curve is drawn, never guessed */
      var line = $("#f03-line");
      var LINE_LEN = 900;
      try { LINE_LEN = line.getTotalLength() || 900; } catch (e) { LINE_LEN = 900; }
      line.style.strokeDasharray = LINE_LEN;
      line.style.strokeDashoffset = LINE_LEN;

      /* ═══════════════════════════════════════════════════════════════════
         TIMELINE — one paused timeline. The camera never moves; the only
         movement in this frame is the window's contents becoming each other.
         ═══════════════════════════════════════════════════════════════════ */
      var tl = gsap.timeline({ paused: true });

      /* the morph clock, running the whole frame so no state ever stops */
      tl.to(CLOCK, { t: 6, duration: 6, ease: "none", onUpdate: tick }, 0);

      /* ── Scene 1 (0.0–1.0s) · the window resolves out of Frame 2's drawer ─
         scale-swap-transition: outgoing shrinks away on power2.in, incoming
         arrives with weight on back.out, overlapping by ~0.14s. Shared centre,
         shared transform-origin — one object becoming another, not a cut. */
      tl.fromTo("#f03-drawer",
        { scale: 1, opacity: 1 },
        { scale: 0.72, opacity: 0, duration: 0.34, ease: "power2.in" }, 0);
      tl.fromTo("#f03-window",
        { scale: 0.74, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.52, ease: "back.out(1.4)" }, 0.06);

      /* chrome settles under it */
      tl.fromTo("#f03-kicker", { opacity: 0, x: -14 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.18);
      tl.fromTo("#f03-tag", { opacity: 0, x: 14 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.26);
      tl.fromTo([".f03-dot", "#f03-trav"], { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power1.out", stagger: 0.05 }, 0.34);

      /* range trainer — the grid fills by an index-derived sweep out of AA */
      tl.fromTo("#f03-st1 .f03-hd", { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 0.20);
      tl.fromTo("#f03-l1a", { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.38, ease: "power2.out" }, 0.30);
      cells.forEach(function (cl) {
        tl.fromTo(cl.fill, { scaleX: 0 },
          { scaleX: 1, duration: 0.34, ease: "power2.out" }, 0.30 + cl.dist * 0.046);
      });
      ["#f03-k0", "#f03-k1", "#f03-k2"].forEach(function (sel, i) {
        tl.fromTo(sel, { opacity: 0, x: -16 },
          { opacity: 1, x: 0, duration: 0.40, ease: "power3.out" }, 0.50 + i * 0.11);
      });
      tl.fromTo("#f03-acc1", { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.38, ease: "power2.out" }, 0.80);
      tl.fromTo("#f03-tr1f", { scaleX: 0 },
        { scaleX: 0.72, duration: 0.86, ease: "power2.out" }, 0.62);

      /* ── the five handoffs ────────────────────────────────────────────────
         Each is one crossfade INSIDE the held window: the outgoing surface
         leaves across the first ~42% of the morph, the incoming arrives across
         the last ~42%, and the shape-only gap between the two is the blink.
         The container itself never blinks — it is the constant. */
      var STATE_IDS = ["#f03-st1", "#f03-st2", "#f03-st3", "#f03-st4", "#f03-st5", "#f03-st6"];
      var FADE = 0.42;
      MORPHS.forEach(function (m, i) {
        tl.fromTo(STATE_IDS[i],
          { opacity: 1, scale: 1 },
          { opacity: 0, scale: 1.02, duration: m.dur * FADE, ease: "power1.in", immediateRender: false },
          m.at);
        tl.fromTo(STATE_IDS[i + 1],
          { opacity: 0, scale: 0.982 },
          { opacity: 1, scale: 1, duration: m.dur * FADE, ease: "power1.out" },
          m.at + m.dur * (1 - FADE));
      });

      /* ── Scene 2 (1.0–2.0s) · board builder — a card lands on the settle ── */
      tl.fromTo("#f03-st2 .f03-hd", { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, 1.36);
      tl.fromTo(["#f03-l2a", "#f03-l2b"], { opacity: 0 },
        { opacity: 1, duration: 0.32, ease: "power1.out", stagger: 0.07 }, 1.36);
      trayEls.forEach(function (el, i) {
        tl.fromTo(el, { opacity: 0, y: -14 },
          { opacity: i === 3 ? 0.18 : 1, y: 0, duration: 0.36, ease: "power3.out" }, 1.38 + i * 0.035);
      });
      tl.fromTo("#f03-swipe", { scaleY: 0, opacity: 0.7 },
        { scaleY: 1, opacity: 0, duration: 0.44, ease: "power2.out" }, 1.42);
      tl.fromTo("#f03-fly",
        { x: 0, y: 0, rotation: -8, scale: 1.06 },
        { x: FLY_DX, y: FLY_DY, rotation: 0, scale: 1, duration: 0.50, ease: "power4.out" }, 1.46);
      tl.fromTo("#f03-land", { opacity: 0, scale: 1.07 },
        { opacity: 1, scale: 1, duration: 0.34, ease: "power2.out" }, 1.92);

      /* ── Scene 3 (2.0–3.0s) · decision spot — one action already committed ─ */
      tl.fromTo("#f03-st3 .f03-hd", { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, 2.34);
      seatEls.forEach(function (el, i) {
        tl.fromTo(el, { opacity: 0, scale: 0.84 },
          { opacity: 1, scale: 1, duration: 0.36, ease: "power3.out" }, 2.34 + i * 0.045);
      });
      tl.fromTo("#f03-board rect, #f03-board text, #f03-board path",
        { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.36, ease: "power2.out", stagger: 0.03 }, 2.46);
      tl.fromTo("#f03-pot circle, #f03-pot text", { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.32, ease: "power2.out", stagger: 0.035 }, 2.54);
      tl.fromTo(["#f03-act0", "#f03-act1", "#f03-act2"],
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power3.out", stagger: 0.08 }, 2.56);
      tl.fromTo("#f03-actring", { opacity: 0, scale: 1.1 },
        { opacity: 1, scale: 1, duration: 0.32, ease: "power2.out" }, 2.80);

      /* ── Scene 4 (3.0–4.0s) · lesson, mid-flow ───────────────────────────── */
      tl.fromTo("#f03-st4 .f03-hd", { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, 3.32);
      tl.fromTo("#f03-prompt", { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.38, ease: "power2.out" }, 3.34);
      ["#f03-ans0", "#f03-ans1", "#f03-ans2"].forEach(function (sel, i) {
        tl.fromTo(sel, { opacity: 0, x: -22 },
          { opacity: 1, x: 0, duration: 0.40, ease: "power3.out" }, 3.40 + i * 0.10);
      });
      tl.fromTo("#f03-pick", { opacity: 0, scaleX: 0.95 },
        { opacity: 1, scaleX: 1, duration: 0.36, ease: "power2.out" }, 3.76);
      tl.fromTo("#f03-l4a", { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power1.out" }, 3.66);
      tl.fromTo("#f03-tr4f", { scaleX: 0 },
        { scaleX: 0.58, duration: 0.56, ease: "power2.out" }, 3.68);

      /* ── Scene 5 (4.0–5.0s) · achievement — evidence, not a reward ────────
         Deliberately restrained: the badge resolves, the border settles, the
         record marks tick in. No shimmer, no halo, no burst, no green. */
      tl.fromTo("#f03-st5 .f03-hd", { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" }, 4.28);
      tl.fromTo("#f03-badge", { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.42, ease: "power2.out" }, 4.30);
      tl.fromTo("#f03-badge",
        { borderColor: "rgba(139,92,246,0.2)" },
        { borderColor: "rgba(139,92,246,0.45)", duration: 0.44, ease: "power2.out" }, 4.40);
      tl.fromTo(["#f03-acht", "#f03-achs"], { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.40, ease: "power2.out", stagger: 0.10 }, 4.42);
      tl.fromTo("#f03-achrule", { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.44, ease: "power2.out" }, 4.54);
      tl.fromTo("#f03-l5a", { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power1.out" }, 4.58);
      tl.fromTo(".f03-tick", { scaleY: 0, opacity: 0.35 },
        { scaleY: 1, opacity: 1, duration: 0.26, ease: "power3.out", stagger: 0.022 }, 4.60);

      /* ── Scene 6 (5.0–6.0s) · dashboard — already a wider environment ─────
         The widest of the six. It settles and holds, so Frame 4 can open
         straight out of it. */
      tl.fromTo("#f03-hd6", { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, 5.24);
      ["#f03-nav0", "#f03-nav1", "#f03-nav2", "#f03-nav3"].forEach(function (sel, i) {
        tl.fromTo(sel, { opacity: 0, x: -18 },
          { opacity: 1, x: 0, duration: 0.38, ease: "power3.out" }, 5.26 + i * 0.06);
      });
      var NAV_W = [0.82, 0.64, 0.47, 0.35];
      root.querySelectorAll(".f03-navfill").forEach(function (el, i) {
        tl.fromTo(el, { scaleX: 0 },
          { scaleX: NAV_W[i], duration: 0.46, ease: "power2.out" }, 5.34 + i * 0.06);
      });
      tl.fromTo("#f03-curvecard", { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.40, ease: "power3.out" }, 5.28);
      tl.to(line, { strokeDashoffset: 0, duration: 0.54, ease: "power2.out" }, 5.34);
      tl.to("#f03-area", { fillOpacity: 1, duration: 0.36, ease: "power1.out" }, 5.72);
      ["#f03-tile0", "#f03-tile1", "#f03-tile2"].forEach(function (sel, i) {
        tl.fromTo(sel, { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.40, ease: "power3.out" }, 5.38 + i * 0.07);
      });
      var TILE_W = [0.74, 0.61, 0.88];
      root.querySelectorAll(".f03-tilefill").forEach(function (el, i) {
        tl.fromTo(el, { scaleX: 0 },
          { scaleX: TILE_W[i], duration: 0.44, ease: "power2.out" }, 5.46 + i * 0.07);
      });
      ["#f03-rec0", "#f03-rec1", "#f03-rec2", "#f03-rec3"].forEach(function (sel, i) {
        tl.fromTo(sel, { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, 5.44 + i * 0.06);
      });
      var REC_W = [0.9, 0.72, 0.55, 0.41];
      root.querySelectorAll(".f03-recfill").forEach(function (el, i) {
        tl.fromTo(el, { scaleX: 0 },
          { scaleX: REC_W[i], duration: 0.40, ease: "power2.out" }, 5.52 + i * 0.06);
      });

      /* 5.95–6.0s — held. The window is at its widest and dead still: the
         environment Frame 4 opens into. No exit; the root transition is it. */

      window.__timelines = window.__timelines || {};
      window.__timelines["03-understanding"] = tl;
    })();
  </script>
