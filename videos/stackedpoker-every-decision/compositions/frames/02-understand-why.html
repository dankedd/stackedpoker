    (function () {
      var DUR = 5;
      var root = document.querySelector('[data-composition-id="02-understand-why"]');
      var q = function (s) { return root.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

      /* -----------------------------------------------------------------
         BUILD — the 13x13 range grid. Exactly ONE cell is the bloom target.
         The lit pattern is a pedagogical placeholder shape, not a solver
         output; no frequencies or figures are asserted anywhere on frame.
      ----------------------------------------------------------------- */
      var RANKS = ["A", "K", "Q", "J", "T", "9", "8", "7", "6", "5", "4", "3", "2"];
      function inRange(i, j) {
        if (i === j) return true;                   // pairs
        if (i < j) return (j - i) <= 4 || i <= 1;   // suited
        return (i - j) <= 3 && j <= 3;              // offsuit
      }
      var BLOOM_R = 0, BLOOM_C = 9;                 // A5s — the one hand that lights up
      var grid = q(".f02-grid");
      for (var r = 0; r < 13; r++) {
        for (var c = 0; c < 13; c++) {
          var cell = document.createElement("div");
          cell.className = "f02-cell";
          cell.textContent = r < c ? RANKS[r] + RANKS[c] + "s"
            : r > c ? RANKS[c] + RANKS[r] + "o"
              : RANKS[r] + RANKS[r];
          if (inRange(r, c)) cell.className += " on";
          if (r === BLOOM_R && c === BLOOM_C) cell.className += " bloom f02-bloom";
          grid.appendChild(cell);
        }
      }
      var bloomCell = q(".f02-bloom");
      var rangeCard = q(".f02-rangecard");
      var keySpan = q(".f02-key");

      /* -----------------------------------------------------------------
         asr-keyword-glow — ONE keyword, ONE envelope, ONE driver.
         Attack -> decay -> high rest, so the bloom is HELD to the end.
      ----------------------------------------------------------------- */
      var ATTACK = 0.20, RELEASE = 0.35, REST = 0.82;
      var MAX_BLUR = 26, MAX_SCALE = 0.06;
      var TIMINGS = { hand: { start: 3.90, end: 4.30 } };
      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK, 1);
        var rEnd = end + RELEASE;
        if (time < rEnd) return 1 - ((time - end) / RELEASE) * (1 - REST);
        return REST;
      }
      var REST_RGB = { r: 230, g: 234, b: 240 };
      var ACT_RGB = { r: 196, g: 181, b: 253 };
      function lerpCh(a, b, t) { return Math.round(a + (b - a) * t); }
      function colorAt(e) {
        return "rgb(" + lerpCh(REST_RGB.r, ACT_RGB.r, e) + "," +
          lerpCh(REST_RGB.g, ACT_RGB.g, e) + "," +
          lerpCh(REST_RGB.b, ACT_RGB.b, e) + ")";
      }

      /* -----------------------------------------------------------------
         TIMELINE
      ----------------------------------------------------------------- */
      var tl = gsap.timeline({ paused: true });

      var left = q(".f02-left");
      var drawer = q(".f02-drawer");
      var cursor = q(".f02-cursor");
      var ripple = q(".f02-ripple");
      var callBtn = q(".f02-call");

      /* --- Scene 1 (0.00-0.70): the card is already there, in the position
             Frame 1 left it. A cursor commits one button. Small and dry:
             cursor-click-ripple (single-ring variation) into the SUBTLE form
             of press-release-spring — no burst, no environmental glow. --- */
      var CALL_X = 520, CALL_Y = 522;   // the Call button's visual centroid, group-local

      // Phase 1 — move (eased, settles before the click)
      tl.fromTo(cursor,
        { x: CALL_X + 188, y: CALL_Y + 126, scale: 1 },
        { x: CALL_X, y: CALL_Y, duration: 0.22, ease: "power3.out" }, 0);

      // Phase 2 — press: cursor compresses more than the target; both linear in
      tl.to(cursor, { scale: 0.85, duration: 0.07, ease: "power2.in" }, 0.26);
      tl.to(callBtn, { scale: 0.955, duration: 0.07, ease: "power1.in" }, 0.26);

      // Phase 2b — release: spring recovery, adjacency keeps state continuous.
      // The committed button takes a QUIET selected ring. No fill, no colour
      // of verdict, no marker, no check — it is only "this is what you chose".
      tl.to(cursor, { scale: 1, duration: 0.30, ease: "back.out(1.6)" }, 0.33);
      tl.to(callBtn, {
        scale: 1,
        borderColor: "rgba(139,92,246,0.45)",
        color: "#E6EAF0",
        duration: 0.38, ease: "back.out(1.4)"
      }, 0.33);

      // Phase 3 — one ring, from the click point
      tl.fromTo(ripple,
        { scale: 0, opacity: 0.5 },
        { scale: 3.6, opacity: 0, duration: 0.50, ease: "power2.out", immediateRender: false }, 0.26);

      /* --- Scene 2 (0.70-1.40): NOTHING HAPPENS. No tween exists in this
             window on purpose. No verdict, no score, no colour, no toast.
             The absence IS the shot. Do not fill this silence. --- */

      /* --- Scene 3 (1.40-2.40): the line fades up on a long settle. Opacity
             and a 10px drift only — it must never pop or scale in. --- */
      tl.fromTo(q(".f02-line"),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 1.00, ease: "power1.out" }, 1.40);

      /* --- Scene 4 (2.40-3.80): panel-edit-live-sync. The Coach drawer slides
             in from the right on a long-tail settle; the decision card EASES
             LEFT to make room. It is never covered. --- */
      tl.fromTo(drawer,
        { x: 820, opacity: 0 },
        { x: 0, opacity: 1, duration: 1.15, ease: "power3.out" }, 2.40);
      tl.fromTo(left, { x: 0 }, { x: -350, duration: 1.15, ease: "power3.out" }, 2.40);

      // the drawer's contents arrive on their own cues, never all at once
      tl.fromTo(q(".f02-dhead"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 2.92);
      tl.fromTo(q(".f02-rule"), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.55, ease: "power2.out" }, 3.04);
      tl.fromTo(q(".f02-why"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.36, ease: "power2.out" }, 3.20);
      tl.fromTo(q(".f02-title"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.44, ease: "power2.out" }, 3.28);
      tl.fromTo(q(".f02-body"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.44, ease: "power2.out" }, 3.44);
      tl.fromTo(q(".f02-highlight"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.44, ease: "power2.out" }, 3.62);
      tl.fromTo(q(".f02-foot"), { opacity: 0 }, { opacity: 1, duration: 0.40, ease: "power2.out" }, 3.74);

      /* --- Scene 5 (3.80-5.00): ONE range blooms, ONCE. A single cell, not a
             sweep. One linear driver carries the whole envelope. --- */
      var driver = { t: 0 };
      tl.to(driver, {
        t: DUR, duration: DUR, ease: "none",
        onUpdate: function () {
          var e = envelope(driver.t, TIMINGS.hand.start, TIMINGS.hand.end);

          // the spoken clause — text-shadow hugs the glyph
          keySpan.style.textShadow = "0 0 " + (MAX_BLUR * e).toFixed(2) +
            "px rgba(167,139,250," + (0.9 * e).toFixed(3) + ")";
          keySpan.style.transform = "scale(" + (1 + MAX_SCALE * e) + ")";
          keySpan.style.color = colorAt(e);

          // the coupled surface — exactly one cell answers
          bloomCell.style.background = "rgba(139,92,246," + (0.07 + 0.78 * e).toFixed(3) + ")";
          bloomCell.style.color = "rgba(230,234,240," + (0.26 + 0.72 * e).toFixed(3) + ")";
          bloomCell.style.transform = "scale(" + (1 + 0.55 * e) + ")";
          bloomCell.style.boxShadow = "0 0 " + (26 * e).toFixed(1) +
            "px rgba(139,92,246," + (0.75 * e).toFixed(3) + ")";

          // the card that holds it lifts a little, so the eye finds the cell
          rangeCard.style.borderColor = "rgba(139,92,246," + (0.2 + 0.34 * e).toFixed(3) + ")";
          rangeCard.style.background = "rgba(139,92,246," + (0.04 + 0.03 * e).toFixed(3) + ")";
        }
      }, 0);

      /* --- depth-of-field-blur: everything but the lit range settles back.
             Small / grouped layers blur; the focal card stays genuinely sharp
             and sits above them (z-index 3). --- */
      qa(".f02-dof").forEach(function (el, i) {
        tl.to(el, { "--dof": (3 + i) + "px", opacity: 0.5, duration: 0.70, ease: "power2.inOut" }, 4.15);
      });

      window.__timelines = window.__timelines || {};
