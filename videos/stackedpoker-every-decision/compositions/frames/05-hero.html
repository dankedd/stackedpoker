  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["05-hero"] = tl;

      /* ── seek-safe starting states for everything that arrives late ──
         These are immediate gsap.set calls OUTSIDE the timeline, never
         zero-duration tl.set(...) at position 0: a set at 0 does not
         render while the playhead sits exactly at 0, so the first frame
         would flash the lockup, headline and CTA before hiding them. */
      gsap.set("#f05-hero-glow", { opacity: 0, scale: 0.86, x: 0, y: 0 });
      gsap.set("#f05-hero-rings", { opacity: 0, scale: 0.92 });
      gsap.set("#f05-hero-seed", { opacity: 0, scale: 0.5 });
      gsap.set("#f05-hero-lockup", { opacity: 0, scale: 0.72 });
      gsap.set("#f05-hero-l1", { opacity: 0 });
      gsap.set("#f05-hero-l2", { opacity: 0 });
      gsap.set("#f05-hero-cta", { opacity: 0 });
      gsap.set("#f05-hero-note", { opacity: 0 });

      /* ══ Scene 1 (0.0–1.2s) ═══════════════════════════════════════
         The spatial composition fades. Every plane but one MacBook
         recedes and blurs out; the MacBook holds centre-left with the
         interface at rest. Hero is visible at t = 0 — no entrance on it,
         only a hair of settle so it reads as coming to rest.          */
      tl.fromTo(
        "#f05-hero-mac",
        { scale: 1.025 },
        { scale: 1, duration: 1.15, ease: "power2.out" },
        0
      );

      /* index-derived stagger — deterministic, no Math.random */
      var CLEARING = ["#f05-hero-p0", "#f05-hero-p1", "#f05-hero-p2"];
      CLEARING.forEach(function (sel, i) {
        tl.fromTo(
          sel,
          { opacity: 0.9, y: 0, scale: 1, filter: "blur(0px)" },
          {
            opacity: 0,
            y: 26,
            scale: 0.94,
            filter: "blur(11px)",
            duration: 0.72,
            ease: "power2.in"
          },
          0.1 + i * 0.16
        );
      });

      /* ── ambient-glow-bloom · Form A (bloom-and-hold, pulse-on-arrival)
         The halo sits BEHIND the MacBook, blooms slightly past peak and
         eases down to a steady hold. Peak 0.30, well under the 0.45
         ceiling; no idle breathe, because the close must end still.   */
      tl.fromTo(
        "#f05-hero-glow",
        { opacity: 0, scale: 0.86 },
        { opacity: 0.32, scale: 1.05, duration: 0.98, ease: "power2.out" },
        0.04
      );
      tl.to("#f05-hero-glow", { opacity: 0.27, scale: 1.0, duration: 0.55, ease: "power2.out" }, 1.02);

      /* ══ Scene 2 (1.2–2.0s) ═══════════════════════════════════════
         The MacBook eases back and dims; the halo drifts to centre and
         the lockup resolves inside it.                                */
      tl.to("#f05-hero-mac", { scale: 0.9, duration: 0.7, ease: "power2.inOut" }, 1.18);
      tl.to("#f05-hero-mac", { opacity: 0, filter: "blur(11px)", duration: 0.62, ease: "power2.in" }, 1.24);

      /* the spotlight re-centres from the MacBook to the lockup */
      tl.to("#f05-hero-glow", { x: 260, y: -30, duration: 0.92, ease: "power2.inOut" }, 1.18);

      /* closing atmosphere — rings, faint, arriving with the lockup */
      tl.fromTo(
        "#f05-hero-rings",
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 1.1, ease: "power2.out" },
        1.3
      );

      /* ── scale-swap-transition ─────────────────────────────────────
         Outgoing: the spotlight seed shrinks + fades away (power2.in).
         Incoming: the lockup — spade glyph + StackedPoker as ONE object
         — arrives with weight (back.out), z-index above the outgoing,
         both absolute/inset-0 in one wrapper on transform-origin 50%. */
      tl.fromTo(
        "#f05-hero-seed",
        { opacity: 0, scale: 0.5 },
        /* 0.30, not 0.34: the exit below fires at 1.42, and a 0.34 in-tween ran to
           1.46 — 40ms where both tweens wrote opacity and scale on the same element.
           Shortened rather than using overwrite:"auto", which is less predictable
           under a seeked paused timeline and this film must render identically. */
        { opacity: 1, scale: 1, duration: 0.30, ease: "power2.out" },
        1.12
      );
      /* TRIGGER = 1.42 · EXIT_DUR = 0.30 · OVERLAP = 0.14 */
      tl.to("#f05-hero-seed", { scale: 0.72, opacity: 0, duration: 0.3, ease: "power2.in" }, 1.42);
      tl.fromTo(
        "#f05-hero-lockup",
        { scale: 0.72, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.5)" },
        1.58
      );

      /* ══ Scenes 3 + 4 (2.0–4.0s) — discrete-text-sequence ══════════
         The headline lands in TWO beats, never one. Whole text states
         are swapped instantly at their thresholds by a reverse search,
         with a written 0.92s hold between "Learn Poker" and
         "By Playing." — the pause is in the script; do not shorten.   */
      var SEQUENCE = [
        { t: 0.0, l1: "", l2: "" },
        { t: 2.2, l1: "Learn Poker", l2: "" },
        { t: 3.12, l1: "Learn Poker", l2: "By Playing." }
      ];

      function stateAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i];
        }
        return SEQUENCE[0];
      }

      var l1 = document.getElementById("f05-hero-l1");
      var l2 = document.getElementById("f05-hero-l2");
      var driver = { t: 0 };

      tl.to(
        driver,
        {
          t: 6,
          duration: 6,
          ease: "none",
          onUpdate: function () {
            var s = stateAt(driver.t);
            if (l1.textContent !== s.l1) l1.textContent = s.l1;
            if (l2.textContent !== s.l2) l2.textContent = s.l2;
          }
        },
        0
      );

      /* long-tail settle on each beat as its state lands */
      tl.fromTo(
        "#f05-hero-l1",
        { opacity: 0, y: 32 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
        2.2
      );
      tl.fromTo(
        "#f05-hero-l2",
        { opacity: 0, y: 32 },
        { opacity: 1, y: 0, duration: 0.66, ease: "power3.out" },
        3.12
      );

      /* ══ Scene 5 (4.0–4.8s) ═══════════════════════════════════════
         Start Free — the only solid, non-glass element in the film —
         then the reassurance line under it.                           */
      tl.fromTo(
        "#f05-hero-cta",
        { opacity: 0, y: 26, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "back.out(1.6)" },
        4.06
      );
      tl.fromTo(
        "#f05-hero-note",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" },
        4.26
      );

      /* ══ Scene 6 (4.8–6.0s) ═══════════════════════════════════════
         Held and completely still. Nothing is scheduled past 4.60 —
         no breathe, no drift, no jitter. The film has stopped.        */
    })();
  </script>
