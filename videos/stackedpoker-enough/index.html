<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0D1526; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!--
      StackedPoker - "ENOUGH." 1080x1920, 21.7s.

      MORE -> ENOUGH -> one real decision -> what do you do -> the answer ->
      you might know the answer, but do you know why -> the range -> four more
      ranges -> why -> the coach -> understand why -> CTA.

      Scene 2 carries almost no sound on purpose: the eight tactile ticks stop,
      one low swell sits under ENOUGH, and the mix opens again on the table.
      That silence is the pattern interrupt.

      No injected transitions - every cut is a hard cut between two numerically
      identical frozen states.
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="21.7"
         data-width="1080" data-height="1920">

      <div id="el-01-more" class="scene" data-composition-id="01-more"
           data-composition-src="compositions/frames/01-more.html"
           data-start="0.0" data-duration="2.3" data-track-index="1"></div>
      <div id="el-02-enough" class="scene" data-composition-id="02-enough"
           data-composition-src="compositions/frames/02-enough.html"
           data-start="2.3" data-duration="0.9" data-track-index="1"></div>
      <div id="el-03-table" class="scene" data-composition-id="03-table"

      <div id="el-04-decision" class="scene" data-composition-id="04-decision"
           data-composition-src="compositions/frames/04-decision.html"
           data-start="5.2" data-duration="2.0" data-track-index="1"></div>
      <div id="el-05-answer" class="scene" data-composition-id="05-answer"
           data-composition-src="compositions/frames/05-answer.html"
           data-start="7.2" data-duration="1.1" data-track-index="1"></div>
      <div id="el-06-pivot" class="scene" data-composition-id="06-pivot"

      <div id="el-07-range" class="scene" data-composition-id="07-range"
           data-composition-src="compositions/frames/07-range.html"
           data-start="9.9" data-duration="1.8" data-track-index="1"></div>
      <div id="el-08-depth" class="scene" data-composition-id="08-depth"
