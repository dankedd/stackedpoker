<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0D1526; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!--
      StackedPoker - 9:16 mobile film. 1080x1920, 30.0s.

      Recomposed for portrait, never cropped from the desktop cut: the table is
      PreflopTable's OWN MOBILE_LAYOUT (aspect 3/4.3, superellipse rail, seat pods
      outside the rail, inline dealer button) and the options are the product's
      stacked mobile buttons. Safe area: nothing critical above y=250 or below
      y=1620.

      Seven scenes, one continuous world, no injected transitions - every cut is a
      hard cut between two numerically identical frozen states.
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="30"
         data-width="1080" data-height="1920">

      <div id="el-01-hook" class="scene"
           data-composition-id="01-hook"
           data-composition-src="compositions/frames/01-hook.html"
           data-start="0" data-duration="4.0" data-track-index="1"></div>
      <div id="el-02-spot" class="scene"
           data-composition-id="02-spot"
           data-composition-src="compositions/frames/02-spot.html"
           data-start="4.0" data-duration="4.5" data-track-index="1"></div>
      <div id="el-03-decision" class="scene"
           data-composition-id="03-decision"
           data-composition-src="compositions/frames/03-decision.html"
           data-start="8.5" data-duration="4.5" data-track-index="1"></div>
      <div id="el-04-range" class="scene"
           data-composition-id="04-range"
           data-composition-src="compositions/frames/04-range.html"
           data-start="13.0" data-duration="6.0" data-track-index="1"></div>
      <div id="el-05-theory" class="scene"
           data-composition-id="05-theory"
           data-composition-src="compositions/frames/05-theory.html"
           data-start="19.0" data-duration="3.5" data-track-index="1"></div>
      <div id="el-06-coach" class="scene"
           data-composition-id="06-coach"
           data-composition-src="compositions/frames/06-coach.html"
           data-start="22.5" data-duration="3.5" data-track-index="1"></div>
      <div id="el-07-cta" class="scene"
           data-composition-id="07-cta"
           data-composition-src="compositions/frames/07-cta.html"
           data-start="26.0" data-duration="4.0" data-track-index="1"></div>

      <audio id="el-01-hook-voice" src="assets/voice/mobile/m1.wav"
             data-start="0" data-duration="4.0" data-track-index="10" data-volume="1"></audio>
      <audio id="el-03-decision-voice" src="assets/voice/mobile/m3.wav"
             data-start="8.5" data-duration="4.5" data-track-index="10" data-volume="1"></audio>
      <audio id="el-04-range-voice" src="assets/voice/mobile/m4.wav"
             data-start="13.0" data-duration="6.0" data-track-index="10" data-volume="1"></audio>
      <audio id="el-05-theory-voice" src="assets/voice/mobile/m5.wav"
             data-start="19.0" data-duration="3.5" data-track-index="10" data-volume="1"></audio>
      <audio id="el-06-coach-voice" src="assets/voice/mobile/m6.wav"
             data-start="22.5" data-duration="3.5" data-track-index="10" data-volume="1"></audio>
      <audio id="el-07-cta-voice" src="assets/voice/mobile/m7.wav"
             data-start="26.0" data-duration="4.0" data-track-index="10" data-volume="1"></audio>

      <audio id="el-bgm" src="assets/bgm/track.mp3"
             data-start="0" data-duration="30" data-track-index="11" data-volume="0.5"></audio>

      <audio id="el-sfx-00-u-swell-long" src="assets/sfx/u-swell-long.mp3" data-start="0.0" data-duration="4.0" data-track-index="20" data-volume="0.3"></audio>  <!-- the film opens -->
      <audio id="el-sfx-01-u-card" src="assets/sfx/u-card.mp3" data-start="1.1" data-duration="0.26" data-track-index="21" data-volume="0.22"></audio>  <!-- the ace lands -->
      <audio id="el-sfx-02-u-card" src="assets/sfx/u-card.mp3" data-start="1.62" data-duration="0.26" data-track-index="22" data-volume="0.2"></audio>  <!-- the five lands -->
      <audio id="el-sfx-03-u-glass" src="assets/sfx/u-glass.mp3" data-start="4.55" data-duration="1.62" data-track-index="23" data-volume="0.34"></audio>  <!-- the table forms -->
      <audio id="el-sfx-04-u-tick" src="assets/sfx/u-tick.mp3" data-start="6.2" data-duration="0.35" data-track-index="24" data-volume="0.1"></audio>  <!-- SB blind -->
      <audio id="el-sfx-05-u-tick" src="assets/sfx/u-tick.mp3" data-start="6.4" data-duration="0.35" data-track-index="25" data-volume="0.1"></audio>  <!-- BB blind -->
      <audio id="el-sfx-06-u-accent" src="assets/sfx/u-accent.mp3" data-start="5.6" data-duration="2.4" data-track-index="26" data-volume="0.22"></audio>  <!-- peaks on CO's raise at 6.75 -->
      <audio id="el-sfx-07-u-tick" src="assets/sfx/u-tick.mp3" data-start="7.15" data-duration="0.35" data-track-index="27" data-volume="0.08"></audio>  <!-- the pot -->
      <audio id="el-sfx-08-u-tick" src="assets/sfx/u-tick.mp3" data-start="9.85" data-duration="0.35" data-track-index="28" data-volume="0.11"></audio>  <!-- option 1 -->
      <audio id="el-sfx-09-u-tick" src="assets/sfx/u-tick.mp3" data-start="10.01" data-duration="0.35" data-track-index="29" data-volume="0.11"></audio>  <!-- option 2 -->
      <audio id="el-sfx-10-u-tick" src="assets/sfx/u-tick.mp3" data-start="10.17" data-duration="0.35" data-track-index="30" data-volume="0.11"></audio>  <!-- option 3 -->
      <audio id="el-sfx-11-u-shimmer" src="assets/sfx/u-shimmer.mp3" data-start="10.85" data-duration="3.32" data-track-index="31" data-volume="0.18"></audio>  <!-- peaks as 3-Bet resolves at 11.55 -->
      <audio id="el-sfx-12-u-glass" src="assets/sfx/u-glass.mp3" data-start="14.45" data-duration="1.62" data-track-index="32" data-volume="0.2"></audio>  <!-- the grid arrives -->
      <audio id="el-sfx-13-u-shimmer" src="assets/sfx/u-shimmer.mp3" data-start="14.9" data-duration="3.32" data-track-index="33" data-volume="0.2"></audio>  <!-- peaks as the strategy resolves at 15.60 -->
      <audio id="el-sfx-14-u-tick" src="assets/sfx/u-tick.mp3" data-start="16.8" data-duration="0.35" data-track-index="34" data-volume="0.09"></audio>  <!-- the hero ring -->
      <audio id="el-sfx-15-u-glass" src="assets/sfx/u-glass.mp3" data-start="19.85" data-duration="1.62" data-track-index="35" data-volume="0.16"></audio>  <!-- the panel opens -->
      <audio id="el-sfx-16-u-glass" src="assets/sfx/u-glass.mp3" data-start="23.15" data-duration="1.62" data-track-index="36" data-volume="0.15"></audio>  <!-- the coach -->
      <audio id="el-sfx-17-u-accent" src="assets/sfx/u-accent.mp3" data-start="26.55" data-duration="2.4" data-track-index="37" data-volume="0.26"></audio>  <!-- peaks on LEARN POKER. at 27.70 -->
      <audio id="el-sfx-18-u-tick" src="assets/sfx/u-tick.mp3" data-start="28.45" data-duration="0.35" data-track-index="38" data-volume="0.09"></audio>  <!-- the CTA -->
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
