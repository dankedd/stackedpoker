    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        var P = "#fr-02-the-decision-";
        var HEADLINE = P + "headline";
        var SURFACE = P + "surface";
        var CTXL = P + "ctx-left";
        var CTXR = P + "ctx-right";
        var RULE = P + "rule";
        var RING = P + "ring";
        var SEATS = ".fr-02-the-decision-seat";
        var SEATHERO = P + "seat-hero";
        var POT = P + "pot";
        var HERO = P + "hero";
        var QUESTION = P + "question";
        var PILL1 = P + "pill-1";
        var PILL2 = P + "pill-2";
        var PILL3 = P + "pill-3";

        var surfaceEl = document.getElementById("fr-02-the-decision-surface");

        // The glass grows from 0.70; a 1px hairline and a 20px radius would
        // both render 1/s too large under that scale, so they are divided by
        // the live scale on every rendered frame (seek included).
        function compensate() {
          if (!surfaceEl) return;
          var s = Number(gsap.getProperty(surfaceEl, "scaleX")) || 1;
          surfaceEl.style.borderWidth = 1 / s + "px";
          surfaceEl.style.borderRadius = 20 / s + "px";
        }

        // Pre-timeline hidden states. The inherited image — ground, cards and
        // the lit headline — is authored in the DOM and never touched at t=0,
        // so the seam with Frame 1 is invisible.
        gsap.set(SURFACE, { opacity: 0, scale: 0.7 });
        gsap.set(
          [CTXL, CTXR, RULE, RING, POT, HERO, QUESTION, PILL1, PILL2, PILL3],
          { opacity: 0 }
        );
        gsap.set(SEATS, { opacity: 0, scale: 0.6 });
        gsap.set(SEATHERO, { opacity: 0, scale: 0.4 });
        compensate();

        var tl = gsap.timeline({ paused: true });

        /* Scene 1 (0.00-0.40) — the inherited state. No tween exists here. */

        /* Scene 2 (0.40-1.60) — the headline releases and the surface expands
           into existence behind the hand, centred on the cards, one long ease.
           The cards are absolutely positioned siblings of the surface, so the
           scale cannot reach them. They do not move. */
        tl.to(
          HEADLINE,
          { opacity: 0, y: -12, duration: 0.55, ease: "power3.out" },
          0.4
        );
        tl.fromTo(
          SURFACE,
          { opacity: 0, scale: 0.7 },
          {
            opacity: 1,
            scale: 1,
            duration: 1.15,
            ease: "power3.out",
            onUpdate: compensate,
          },
          0.42
        );

        /* Scene 3 (1.60-2.60) — the lesson context resolves around the hand,
           every piece at the lowest weight the spec allows. */
        tl.fromTo(
          CTXL,
          { opacity: 0, y: 6 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          1.62
        );
        tl.fromTo(
          RULE,
          { opacity: 0, scaleX: 0.8 },
          { opacity: 1, scaleX: 1, duration: 0.6, ease: "power3.out" },
          1.66
        );
        tl.fromTo(
          CTXR,
          { opacity: 0, y: 6 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          1.7
        );
        tl.fromTo(
          RING,
          { opacity: 0 },
          { opacity: 1, duration: 0.7, ease: "power3.out" },
          1.8
        );
        tl.fromTo(
          SEATS,
          { opacity: 0, scale: 0.6 },
          {
            opacity: 1,
            scale: 1,
            duration: 0.4,
            ease: "power3.out",
            stagger: 0.05,
          },
          1.92
        );
        tl.fromTo(
          POT,
          { opacity: 0, y: 6 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          2.1
        );
        tl.fromTo(
          SEATHERO,
          { opacity: 0, scale: 0.4 },
          { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
          2.16
        );
        tl.fromTo(
          HERO,
          { opacity: 0, y: 6 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
          2.28
        );

        /* Scene 4 (2.60-3.50) — the question resolves below the hand, then the
           three actions settle as one staggered set. Nothing is pressed. */
        tl.fromTo(
          QUESTION,
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          2.62
        );
        tl.fromTo(
          PILL1,
          { opacity: 0, y: 14, scale: 0.985 },
          { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: "power3.out" },
          2.92
        );
        tl.fromTo(
          PILL2,
          { opacity: 0, y: 14, scale: 0.985 },
          { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: "power3.out" },
          3.04
        );
        tl.fromTo(
          PILL3,
          { opacity: 0, y: 14, scale: 0.985 },
          { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: "power3.out" },
          3.16
        );

        /* Scene 5 (3.50-5.50) — held for two full seconds. Nothing selected,
           nothing highlighted, nothing moving. An inert driver only carries
           the timeline to its full length. */
        tl.to({ hold: 0 }, { hold: 1, duration: 2.0, ease: "none" }, 3.5);

        window.__timelines["02-the-decision"] = tl;
      })();
