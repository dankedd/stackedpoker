  <script>
    window.__timelines = window.__timelines || {};

    /* ------------------------------------------------------------------
       t = 0 IS FRAME 2's END STATE. Everything inherited is already lit;
       nothing re-enters. These sets live OUTSIDE the timeline.
       inherited glass  460,250,1000,620   inherited cards 816-1104 x 470-656
       landed   glass   560,300, 800,460   landed   cards 600- 792 x 340-464
       ------------------------------------------------------------------ */
    gsap.set("#swy-glass", { x: -100, y: -50, width: 1000, height: 620 });
    gsap.set("#swy-cards", { x: 0, y: 0, scale: 1 });
    gsap.set("#swy-decision", { opacity: 1 });

    /* the landed statement is the only thing not yet present */
    gsap.set(".swy-hwi", { yPercent: 105, opacity: 0 });
    gsap.set(".swy-w", { y: 12, opacity: 0 });

    var tl = gsap.timeline({ paused: true });

    /* Scene 1 (0.0-0.3s) — the seam. The inherited state, static. */

    /* Scene 2 (0.3-1.5s) — one continuous transform.
       The decision content fades out IN PLACE: opacity only, no slide, no collapse. */
    tl.fromTo("#swy-decision",
      { opacity: 1 },
      { opacity: 0, duration: 0.80, ease: "power3.inOut" }, 0.30);

    /* the surface eases from 460,250,1000,620 to its authored 560,300,800,460:
       position by transform, size by width/height. No scale ever touches the
       glass, so the hairline stays exactly 1px and the corner exactly 20px. */
    tl.fromTo("#swy-glass",
      { x: -100, y: -50, width: 1000, height: 620 },
      { x: 0, y: 0, width: 800, height: 460,
        duration: 1.20, ease: "power3.inOut" }, 0.30);

    /* the pair scales uniformly to 2/3 (132x186 -> 88x124) and travels to the
       top-left of the surface: an anchor, no longer the subject */
    tl.fromTo("#swy-cards",
      { x: 0, y: 0, scale: 1 },
      { x: -216, y: -130, scale: 0.666667, duration: 1.20, ease: "power3.inOut" }, 0.30);

    /* Scene 3 (1.5-2.3s) — START WITH WHY. resolves beside the cards */
    tl.fromTo(".swy-hwi",
      { yPercent: 105, opacity: 0 },
      { yPercent: 0, opacity: 1, duration: 0.68, ease: "power3.out",
        stagger: 0.06 }, 1.52);

    /* Scene 4 (2.3-3.4s) — the sentence, per word */
    tl.fromTo(".swy-w",
      { y: 12, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.50, ease: "power3.out",
        stagger: 0.034 }, 2.32);

    /* Scene 5 (3.4-4.0s) — held. Nothing moves. The viewer reads. */
    tl.to({}, { duration: 0.05 }, 3.95);

    window.__timelines["03-start-with-why"] = tl;
  </script>
