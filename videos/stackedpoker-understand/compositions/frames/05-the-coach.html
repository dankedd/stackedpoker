    /* ---- the lesson surface (inherited from frame 4, travels as one object) ---- */
    #c05-surface { position:absolute; inset:0; }

       as frames 3 and 4 do it. Authoring a native 88x124 variant (radius 9, 35px type)
       instead of scaling the 132x186 one (radius 8, 34.67px type) rasterises glyphs and
       corners differently, which showed up as a visible card pop at the 21s cut. */
    #c05-cards { position:absolute; left:500px; top:270px; width:288px; height:186px;
                 display:flex; gap:24px;
                 transform:scale(0.6666666666666666); transform-origin:0 0; }

    #c05-title { position:absolute; left:500px; top:470px; width:250px;
                 font-size:52px; line-height:1.06; }

    #c05-matrix { position:absolute; left:760px; top:270px; width:556px; height:556px;
                  display:grid; grid-template-columns:repeat(13,40px); grid-auto-rows:40px; gap:3px; }
    .c05-cell      { width:40px; height:40px; border-radius:5px;
                     background:rgba(186,205,247,0.055); }
    .c05-cell-lit  { background:rgba(124,92,255,0.26); }
    .c05-cell-hero { background:rgba(124,92,255,0.88);

    #c05-cols { position:absolute; left:760px; top:242px; width:556px;
                display:grid; grid-template-columns:repeat(13,40px); gap:3px; }
    #c05-rows { position:absolute; left:1326px; top:270px; height:556px;
                display:grid; grid-auto-rows:40px; gap:3px; }
    #c05-cols div, #c05-rows div { font-size:11px; line-height:40px; text-align:center; }
    #c05-cols div { line-height:14px; }

    /* ---- the coach panel ---- */
    #c05-coach { position:absolute; left:1320px; top:330px; width:400px; height:460px;
                 display:flex; flex-direction:column; }
    #c05-coach-head { display:flex; align-items:center; gap:10px; padding:26px 30px 20px; }
    #c05-coach-head svg { display:block; width:16px; height:16px; color:rgba(186,205,247,0.38); }
    #c05-coach-rule { height:1px; margin:0 30px; background:rgba(186,205,247,0.10); }
    #c05-coach-body { flex:1; display:flex; align-items:center; padding:0 30px 26px; }
    #c05-line { font-size:20px; }
    .c05-w { display:inline-block; }
  </style>

  <div id="root"
       data-composition-id="05-the-coach"
       data-start="0"
       data-duration="3.5"
       data-width="1920"
       data-height="1080">

    <div id="c05-ground" class="clip" data-start="0" data-duration="3.5" data-track-index="0">
      <div class="c05-bg"></div>
      <div class="c05-deep"></div>
      <div class="c05-grid"></div>
      <div class="c05-spot"></div>
      <div class="c05-ambient"></div>
    </div>

    <div id="c05-surface" class="clip" data-start="0" data-duration="3.5" data-track-index="1">
      <div id="c05-panel" class="c05-glass"></div>

      <div id="c05-cards">
        <div class="c05-pcard"><div class="c05-prank">A</div>
          <svg class="c05-ppip" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 9c-1.5 1.5-3 3.2-3 5.5A5.5 5.5 0 0 0 7.5 20c1.8 0 3-.5 4.5-2 1.5 1.5 2.7 2 4.5 2a5.5 5.5 0 0 0 5.5-5.5c0-2.3-1.5-4-3-5.5l-7-7-7 7Z" fill="currentColor"/>
            <path d="M12 17.4v4.6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          </svg></div>
        <div class="c05-pcard"><div class="c05-prank">5</div>
          <svg class="c05-ppip" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 9c-1.5 1.5-3 3.2-3 5.5A5.5 5.5 0 0 0 7.5 20c1.8 0 3-.5 4.5-2 1.5 1.5 2.7 2 4.5 2a5.5 5.5 0 0 0 5.5-5.5c0-2.3-1.5-4-3-5.5l-7-7-7 7Z" fill="currentColor"/>
            <path d="M12 17.4v4.6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          </svg></div>
      </div>

      <div id="c05-title" class="c05-headline">THINK IN<br><span class="c05-grad">RANGES.</span></div>

      <div id="c05-cols" class="c05-label"></div>
      <div id="c05-matrix"></div>
      <div id="c05-rows" class="c05-label"></div>
    </div>

    <div id="c05-coach" class="c05-glass clip" data-start="0" data-duration="3.5" data-track-index="2">
      <div id="c05-coach-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 8V4H8"></path>
          <rect width="16" height="12" x="4" y="8" rx="2"></rect>
          <path d="M2 14h2"></path><path d="M20 14h2"></path>
          <path d="M15 13v2"></path><path d="M9 13v2"></path>
        </svg>
        <div class="c05-label">AI Coach</div>
      </div>
      <div id="c05-coach-rule"></div>
      <div id="c05-coach-body">
        <div id="c05-line" class="c05-body"><span class="c05-w">It</span> <span class="c05-w c05-e1">blocks</span> <span class="c05-w c05-e1">the</span> <span class="c05-w c05-e1">aces</span> <span class="c05-w">they</span> <span class="c05-w">need</span> <span class="c05-w">to</span> <span class="c05-w">continue</span> <span class="c05-w">&mdash;</span> <span class="c05-w">and</span> <span class="c05-w">it</span> <span class="c05-w c05-e2">keeps</span> <span class="c05-w c05-e2">enough</span> <span class="c05-w c05-e2">equity</span> <span class="c05-w">to</span> <span class="c05-w">play</span> <span class="c05-w">on.</span></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var RANKS = ["A","K","Q","J","T","9","8","7","6","5","4","3","2"];

      var matrix = document.getElementById("c05-matrix");
      for (var r = 0; r < 13; r++) {
        for (var c = 0; c < 13; c++) {
          var cell = document.createElement("div");
          var cls = "c05-cell";
          if (r === 0 && c === 9) { cls += " c05-cell-hero"; }
          else if (r === 0 && c >= 7 && c <= 12) { cls += " c05-cell-lit"; }
          cell.className = cls;
          matrix.appendChild(cell);
        }
      }
      var cols = document.getElementById("c05-cols");
      var rows = document.getElementById("c05-rows");
      for (var i = 0; i < 13; i++) {
        var a = document.createElement("div"); a.textContent = RANKS[i]; cols.appendChild(a);
        var b = document.createElement("div"); b.textContent = RANKS[i]; rows.appendChild(b);
      }

      var words = gsap.utils.toArray("#c05-line .c05-w");
      var em1 = gsap.utils.toArray("#c05-line .c05-e1");
      var em2 = gsap.utils.toArray("#c05-line .c05-e2");

      /* resting states — outside the timeline */
      gsap.set("#c05-surface", { x: 0 });
      gsap.set("#c05-coach", { x: 56, opacity: 0 });
      gsap.set("#c05-coach-head, #c05-coach-rule", { opacity: 0 });
      gsap.set(words, { opacity: 0, y: 9 });

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0–0.3s) — the inherited state, static. The seam. */

      /* Scene 2 (0.3–1.3s) — the whole lesson surface slides left, 460 → 260. */
      tl.to("#c05-surface", { x: -200, duration: 1.0, ease: "power3.inOut" }, 0.3);

      /* Scene 3 (1.3–2.2s) — the coach panel opens with a soft spatial slide. */
      tl.fromTo("#c05-coach",
        { x: 56, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, 1.3);
      tl.fromTo("#c05-coach-head",
        { opacity: 0, y: 6 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.62);
      tl.fromTo("#c05-coach-rule",
        { opacity: 0, scaleX: 0.4 },
        { opacity: 1, scaleX: 1, duration: 0.55, ease: "power3.out" }, 1.7);

      /* Scene 4 (2.2–3.2s) — one explanation, per-word staggered, then two lifts. */
      tl.fromTo(words,
        { opacity: 0, y: 9 },
        { opacity: 1, y: 0, duration: 0.38, ease: "power3.out", stagger: 0.02 }, 2.2);
      tl.to(em1, { color: "#FFFFFF", fontWeight: 600, duration: 0.16, ease: "power3.out" }, 2.92);
      tl.to(em2, { color: "#FFFFFF", fontWeight: 600, duration: 0.16, ease: "power3.out" }, 3.06);

      /* Scene 5 (3.2–3.5s) — held. */

      window.__timelines["05-the-coach"] = tl;
    })();
  </script>
