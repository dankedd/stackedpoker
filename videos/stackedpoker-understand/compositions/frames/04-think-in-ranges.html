<template>
  <style>
    @font-face { font-family:"Geist"; src:url("capture/assets/fonts/Geist-Regular.woff2") format("woff2");
                 font-weight:100 900; font-style:normal; font-display:block; }
    @font-face { font-family:"Geist Mono"; src:url("capture/assets/fonts/GeistMono-Regular.woff2") format("woff2");
                 font-weight:100 900; font-style:normal; font-display:block; }

    #root { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; }

    .t4-bg      { position:absolute; inset:0; background:#0D1526; }
    .t4-deep    { position:absolute; inset:0;
                  background: radial-gradient(1600px 900px at 50% 118%, #080D1A 0%, rgba(8,13,26,0) 70%); }
    .t4-grid    { position:absolute; inset:0;
                  background-image:
                    linear-gradient(rgba(186,205,247,0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(186,205,247,0.03) 1px, transparent 1px);
                  background-size:80px 80px; }
    .t4-spot    { position:absolute; inset:0;
                  background: radial-gradient(1200px 820px at 50% 8%,
                    rgba(124,92,255,0.20) 0%, rgba(94,168,255,0.09) 40%, rgba(94,168,255,0) 70%); }
    .t4-ambient { position:absolute; inset:0;
                  background: radial-gradient(1500px 700px at 50% 104%,
                    rgba(94,168,255,0.10) 0%, rgba(94,168,255,0) 72%); }

    .t4-glass { background: rgba(14,24,44,0.62);
                border: 1px solid rgba(186,205,247,0.10);
                border-radius: 20px;
                box-shadow: inset 0 1px 0 rgba(186,205,247,0.14), 0 40px 120px rgba(0,0,0,0.45);
                backdrop-filter: blur(18px); }

    /* ---- the canonical poker card, 132x186; the pair is scaled uniformly.
            Byte-for-byte the rule frames 2 and 3 use, so the same rect is
            rasterised the same way on both sides of every cut. ---- */
    .t4-pcard { width:132px; height:186px; border-radius:12px;
                background: linear-gradient(168deg, #FFFFFF 0%, #E8EEFB 100%);
                display:flex; flex-direction:column; align-items:center; justify-content:center;
                gap:12px; color:#0D1526; }
    .t4-prank { font-family:"Geist"; font-size:52px; font-weight:700; line-height:1; letter-spacing:-0.02em; }
    .t4-ppip  { display:block; width:58px; height:58px; }

    .t4-headline { font-family:"Geist"; font-weight:800; letter-spacing:-0.025em; color:#FFFFFF; }
    .t4-body     { font-family:"Geist"; font-weight:400; line-height:1.65; color:rgba(186,205,247,0.62); }
    .t4-label    { font-family:"Geist Mono"; font-weight:500; letter-spacing:0.18em;
                   text-transform:uppercase; color:rgba(186,205,247,0.38); font-size:12px; }
    .t4-grad     { background:linear-gradient(135deg,#7C5CFF 0%,#5EA8FF 100%);
                   -webkit-background-clip:text; background-clip:text; color:transparent; }

    /* ---- the lesson surface ---- */
    #t4-surface { position:absolute; inset:0; }

    /* The glass is ONE canonical element authored at its LANDED rect. The
       inherited rect (560,300,800,460 — frame 3's landed glass) is reached
       with an x/y transform plus a width/height tween. The glass is NEVER
       scaled: scaling is exactly what thins the 1px hairline and distorts
       the 20px radius. */
    #t4-panel { position:absolute; left:460px; top:230px; width:1000px; height:660px; }

    /* Authored at the LANDED position, at the canonical 132x186 size; the
       uniform scale(2/3) yields 88x124 with radius 8 and 34.67px rank type,
       identical to frame 3's landed pair. transform-origin 0 0 so the box
       grows from its own top-left: 600-792 x 340-464 at t=0 (offset +100/+70)
       and 500-692 x 270-394 when landed. */
    #t4-cards { position:absolute; left:500px; top:270px; width:288px; height:186px;
                display:flex; gap:24px; transform-origin:0 0; }

    /* ---- inherited theory text from frame 3 — frame 3's landed statement
            reproduced metric-for-metric, at its exact coordinates. It fades
            out in place: opacity only, nothing repositions. ---- */
    #t4-legacy      { position:absolute; inset:0; }
    #t4-legacy-head { position:absolute; left:840px; top:374px; width:480px;
                      font-size:48px; line-height:1.12; white-space:nowrap; }
    .t4-hw  { display:inline-block; overflow:hidden; vertical-align:bottom; }
    .t4-hwi { display:inline-block; }
    #t4-legacy-body { position:absolute; left:840px; top:545px; width:480px; font-size:22px; }
    .t4-w { display:inline-block; }

    /* ---- the 13x13 range grid ---- */
    #t4-range  { position:absolute; inset:0; }
    #t4-matrix { position:absolute; left:760px; top:270px; width:556px; height:556px;
                 display:grid; grid-template-columns:repeat(13,40px); grid-auto-rows:40px; gap:3px; }
    .t4-cell   { width:40px; height:40px; border-radius:5px;
                 background:rgba(186,205,247,0.055); }

    #t4-cols { position:absolute; left:760px; top:242px; width:556px;
               display:grid; grid-template-columns:repeat(13,40px); gap:3px; }
    #t4-rows { position:absolute; left:1326px; top:270px; height:556px;
               display:grid; grid-auto-rows:40px; gap:3px; }
    #t4-cols div, #t4-rows div { font-size:11px; line-height:40px; text-align:center; }
    #t4-cols div { line-height:14px; }

    /* ---- the headline ---- */
    #t4-title  { position:absolute; left:500px; top:470px; width:250px;
                 font-size:52px; line-height:1.06; }
    .t4-mask   { overflow:hidden; }
    .t4-line   { display:block; }
  </style>

  <div id="root"
       data-composition-id="04-think-in-ranges"
       data-start="0"
       data-duration="5"
       data-width="1920"
       data-height="1080">

    <div id="t4-ground" class="clip" data-start="0" data-duration="5" data-track-index="0">
      <div class="t4-bg"></div>
      <div class="t4-deep"></div>
      <div class="t4-grid"></div>
      <div class="t4-spot"></div>
      <div class="t4-ambient"></div>
    </div>

    <div id="t4-surface" class="clip" data-start="0" data-duration="5" data-track-index="1">
      <div id="t4-panel" class="t4-glass"></div>

      <div id="t4-cards">
        <div class="t4-pcard"><div class="t4-prank">A</div>
          <svg class="t4-ppip" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 9c-1.5 1.5-3 3.2-3 5.5A5.5 5.5 0 0 0 7.5 20c1.8 0 3-.5 4.5-2 1.5 1.5 2.7 2 4.5 2a5.5 5.5 0 0 0 5.5-5.5c0-2.3-1.5-4-3-5.5l-7-7-7 7Z" fill="currentColor"/>
            <path d="M12 17.4v4.6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          </svg></div>
        <div class="t4-pcard"><div class="t4-prank">5</div>
          <svg class="t4-ppip" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 9c-1.5 1.5-3 3.2-3 5.5A5.5 5.5 0 0 0 7.5 20c1.8 0 3-.5 4.5-2 1.5 1.5 2.7 2 4.5 2a5.5 5.5 0 0 0 5.5-5.5c0-2.3-1.5-4-3-5.5l-7-7-7 7Z" fill="currentColor"/>
            <path d="M12 17.4v4.6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          </svg></div>
      </div>

      <div id="t4-range">
        <div id="t4-cols" class="t4-label"></div>
        <div id="t4-matrix"></div>
        <div id="t4-rows" class="t4-label"></div>
      </div>

      <div id="t4-title" class="t4-headline">
        <div class="t4-mask"><span class="t4-line" id="t4-line-1">THINK IN</span></div>
        <div class="t4-mask"><span class="t4-line t4-grad" id="t4-line-2">RANGES.</span></div>
      </div>
    </div>

    <div id="t4-legacy" class="clip" data-start="0" data-duration="5" data-track-index="2">
      <div id="t4-legacy-head" class="t4-headline"><span class="t4-hw"><span class="t4-hwi">START</span></span> <span class="t4-hw"><span class="t4-hwi">WITH</span></span> <span class="t4-hw"><span class="t4-hwi">WHY.</span></span></div>

      <div id="t4-legacy-body" class="t4-body"><span class="t4-w">Suited</span>
        <span class="t4-w">aces</span>
        <span class="t4-w">block</span>
        <span class="t4-w">the</span>
        <span class="t4-w">strongest</span>
        <span class="t4-w">hands</span>
        <span class="t4-w">your</span>
        <span class="t4-w">opponent</span>
        <span class="t4-w">can</span>
        <span class="t4-w">hold</span>
        <span class="t4-w">&#8212;</span>
        <span class="t4-w">and</span>
        <span class="t4-w">they</span>
        <span class="t4-w">still</span>
        <span class="t4-w">play</span>
        <span class="t4-w">well</span>
        <span class="t4-w">when</span>
        <span class="t4-w">called.</span></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var RANKS = ["A", "K", "Q", "J", "T", "9", "8", "7", "6", "5", "4", "3", "2"];

      /* --- build the 13x13 matrix + rank labels (deterministic loops) --- */
      var matrix = document.getElementById("t4-matrix");
      var cells = [];
      for (var r = 0; r < 13; r++) {
        for (var c = 0; c < 13; c++) {
          var cell = document.createElement("div");
          cell.className = "t4-cell";
          matrix.appendChild(cell);
          cells.push(cell);
        }
      }
      var cols = document.getElementById("t4-cols");
      var rows = document.getElementById("t4-rows");
      for (var i = 0; i < 13; i++) {
        var a = document.createElement("div"); a.textContent = RANKS[i]; cols.appendChild(a);
        var b = document.createElement("div"); b.textContent = RANKS[i]; rows.appendChild(b);
      }

      var at = function (row, col) { return cells[row * 13 + col]; };

      var REST  = "rgba(186,205,247,0.055)";
      var LIT   = "rgba(124,92,255,0.26)";
      var HERO  = "rgba(124,92,255,0.88)";
      var PEAK  = "rgba(124,92,255,0.99)";

      /* A5s — row A (0), column 5 (9) */
      var hero = at(0, 9);
      /* the suited-ace family either side of it, ordered outward from the hand */
      var cluster = [at(0, 8), at(0, 10), at(0, 7), at(0, 11), at(0, 12)];

      var CARD_SCALE = 0.6666666666666666;  /* 132x186 -> 88x124, radius 12 -> 8 */

      /* ------------------------------------------------------------------
         t = 0 IS FRAME 3's END STATE. These sets live OUTSIDE the timeline.
         inherited glass  560,300, 800,460   inherited cards 600-792 x 340-464
         landed   glass   460,230,1000,660   landed   cards 500-692 x 270-394
         The glass moves by transform and resizes by width/height — never by
         scale — so its 1px hairline stays a true 1px at every instant.
         ------------------------------------------------------------------ */
      gsap.set("#t4-panel", { x: 100, y: 70, width: 800, height: 460 });
      gsap.set("#t4-cards", { x: 100, y: 70, scale: CARD_SCALE });
      gsap.set("#t4-legacy", { opacity: 1 });
      gsap.set("#t4-range", { opacity: 0, y: 12 });
      gsap.set("#t4-line-1, #t4-line-2", { yPercent: 106, opacity: 0 });

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0–0.3s) — the inherited state, static. The seam. Nothing runs. */

      /* Scene 2 (0.3–1.4s) — ONE continuous transform.
         The theory sentence fades in place; the glass eases to 460,230,1000,660;
         the cards travel to 500–692 × 270–394 at the same scaled size. */
      tl.fromTo("#t4-legacy",
        { opacity: 1 },
        { opacity: 0, duration: 0.68, ease: "power3.inOut" }, 0.3);

      tl.fromTo("#t4-panel",
        { x: 100, y: 70, width: 800, height: 460 },
        { x: 0, y: 0, width: 1000, height: 660, duration: 1.1, ease: "power3.inOut" }, 0.3);

      tl.fromTo("#t4-cards",
        { x: 100, y: 70, scale: CARD_SCALE },
        { x: 0, y: 0, scale: CARD_SCALE, duration: 1.1, ease: "power3.inOut" }, 0.3);

      /* Scene 3 (1.4–2.4s) — the grid resolves AS A WHOLE.
         One tween on one container: no cascade, no per-cell stagger. */
      tl.fromTo("#t4-range",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.95, ease: "power3.out" }, 1.4);

      /* Scene 4 (2.4–3.3s) — A5s lights ALONE, on a soft shimmer, then a held beat. */
      tl.fromTo(hero,
        { backgroundColor: REST },
        { backgroundColor: PEAK, duration: 0.42, ease: "power3.out" }, 2.4);
      tl.to(hero,
        { backgroundColor: HERO, duration: 0.26, ease: "power3.inOut" }, 2.82);
      tl.fromTo(hero,
        { boxShadow: "0px 0px 0px rgba(124,92,255,0)" },
        { boxShadow: "0px 0px 26px rgba(124,92,255,0.45)", duration: 0.6, ease: "power3.out" }, 2.42);
      /* 3.08–3.3s — nothing happens at all. This silence is the pivot. */

      /* Scene 5 (3.3–4.4s) — the surrounding bluff combinations join, index-staggered
         outward from the hand, at a LOWER intensity. No scale, no flash, no bloom. */
      tl.fromTo(cluster,
        { backgroundColor: REST },
        { backgroundColor: LIT, duration: 0.5, ease: "power3.out", stagger: 0.13 }, 3.3);

      /* Scene 6 (3.6–4.8s, overlapping) — the headline resolves at the left.
         RANGES. is the brand gradient's first appearance in the film. */
      tl.fromTo("#t4-line-1",
        { yPercent: 106, opacity: 0 },
        { yPercent: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 3.6);
      tl.fromTo("#t4-line-2",
        { yPercent: 106, opacity: 0 },
        { yPercent: 0, opacity: 1, duration: 0.78, ease: "power3.out" }, 4.0);

      /* Scene 7 (4.8–5.0s) — held. */
      tl.to({}, { duration: 0.2 }, 4.8);

      window.__timelines["04-think-in-ranges"] = tl;
    })();
  </script>
</template>
