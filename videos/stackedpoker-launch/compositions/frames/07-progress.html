    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["07-progress"] = tl;

        var q = function (s) {
          return document.querySelector(s);
        };

        /* =========================================================
           CAMERA — ONE continuous decelerating pull-back, then LOCK.
           No zoom-in anywhere. No camera move at all after t=4.0s.
           Single writer of f07-cam.style.transform, driven by one
           linear time proxy so it is order-independent and seek-safe.
           ========================================================= */
        var cam = q("#f07-cam");
        var STAGE_W = 1920,
          STAGE_H = 1080;
        var TARGET_X = 240, // lesson-card centre — what we open tight on
          TARGET_Y = 191;
        var S0 = 5.0; // opening scale: the lesson surface fills the frame
        var Z0 = Math.log(S0);
        var PULL_AT = 1.0,
          PULL_DUR = 2.4; // 1.0 -> 3.4s
        var LOCK_AT = 3.4,
          LOCK_DUR = 0.6; // drift damps to zero by 4.0s, then dead still
        var DRIFT_AMP_X = 3,
          DRIFT_AMP_Y = 2,
          DRIFT_CYCLES = 1.2,
          DRIFT_FREQ_RATIO = 1.3;

        var CLOCK = { t: 0 };

        function clamp01(v) {
          return v < 0 ? 0 : v > 1 ? 1 : v;
        }
        function outCubic(p) {
          var i = 1 - p;
          return 1 - i * i * i;
        }

        function writeCamera() {
          var t = CLOCK.t;

          // phase scale — log-space so the pull-back reads evenly, easing out
          var p = clamp01((t - PULL_AT) / PULL_DUR);
          var s = Math.exp(Z0 * (1 - outCubic(p)));

          // counter-translation that keeps the lesson card centred while zoomed
          var u = (s - 1) / (S0 - 1);
          var tx = (u * (STAGE_W / 2 - TARGET_X)) / s;
          var ty = (u * (STAGE_H / 2 - TARGET_Y)) / s;

          // organic drift, enveloped to exactly zero at the lock
          var env =
            t <= LOCK_AT ? 1 : t >= LOCK_AT + LOCK_DUR ? 0 : 1 - outCubic((t - LOCK_AT) / LOCK_DUR);
          var ph = (t / 8) * Math.PI * 2 * DRIFT_CYCLES;
          var dx = Math.sin(ph) * DRIFT_AMP_X * env;
          var dy = Math.sin(ph * DRIFT_FREQ_RATIO) * DRIFT_AMP_Y * env;

          cam.style.transform =
            "scale(" + s + ") translate(" + (tx + dx) + "px, " + (ty + dy) + "px)";
        }
        writeCamera(); // t=0 state is correct before the first seek

        tl.to(CLOCK, { t: 8, duration: 8, ease: "none", onUpdate: writeCamera }, 0);

        /* =========================================================
           SCENE 2 (1.0–3.4s) — the dashboard assembles around the
           shrinking lesson card. Three planes expand away from the
           same anchor point the camera is leaving: layered parallax.
           ========================================================= */
        tl.fromTo(
          "#f07-plane-a",
          { opacity: 0, scale: 1.06 },
          { opacity: 1, scale: 1, duration: 1.55, ease: "power3.out" },
          1.3,
        );
        tl.fromTo(
          "#f07-plane-b",
          { opacity: 0, scale: 1.11 },
          { opacity: 1, scale: 1, duration: 1.55, ease: "power3.out" },
          1.62,
        );
        tl.fromTo(
          "#f07-plane-c",
          { opacity: 0, scale: 1.16 },
          { opacity: 1, scale: 1, duration: 1.5, ease: "power3.out" },
          1.94,
        );

        // the surface we came from recedes into supporting weight
        tl.fromTo(
          "#f07-lesson",
          { opacity: 1 },
          { opacity: 0.5, duration: 1.2, ease: "power2.out" },
          2.2,
        );

        /* =========================================================
           SCENE 4 (4.0–5.2s) — camera is locked; the payoff starts.
           XP counts to 8.420 while its scale grows; the bar fill and
           the level ring share the count's exact timing + ease.
           ========================================================= */
        var COUNT_AT = 4.0,
          COUNT_DUR = 1.2,
          COUNT_EASE = "power3.out";

        var xpEl = q("#f07-xp");
        var xpState = { v: 0 };
        tl.to(
          xpState,
          {
            v: 8420,
            duration: COUNT_DUR,
            ease: COUNT_EASE,
            onUpdate: function () {
              xpEl.textContent = Math.round(xpState.v).toLocaleString("de-DE");
            },
          },
          COUNT_AT,
        );
        tl.fromTo(
          xpEl,
          { scale: 0.55, opacity: 0 },
          { scale: 1, opacity: 1, duration: COUNT_DUR, ease: COUNT_EASE },
          COUNT_AT,
        );
        tl.fromTo(
          "#f07-xp-fill",
          { scaleX: 0 },
          { scaleX: 0.86, duration: COUNT_DUR, ease: COUNT_EASE },
          COUNT_AT,
        );

        // level ring — measured draw, not a guessed circumference
        var ring = q("#f07-ring");
        var RING_LEN = ring.getTotalLength();
        ring.style.strokeDasharray = RING_LEN;
        ring.style.strokeDashoffset = RING_LEN;
        tl.to(
          ring,
          { strokeDashoffset: 0, duration: COUNT_DUR, ease: COUNT_EASE },
          COUNT_AT,
        );

        var lvlEl = q("#f07-level");
        var lvlState = { v: 0 };
        tl.to(
          lvlState,
          {
            v: 12,
            duration: COUNT_DUR,
            ease: COUNT_EASE,
            onUpdate: function () {
              lvlEl.textContent = Math.round(lvlState.v);
            },
          },
          COUNT_AT,
        );
        tl.fromTo(
          lvlEl,
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power2.out" },
          COUNT_AT,
        );

        // label arrives before the count peaks; suffix punctuates after it lands
        tl.fromTo(
          "#f07-xp-label, #f07-spark",
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          COUNT_AT + 0.15,
        );
        tl.fromTo(
          "#f07-xp-suffix",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" },
          COUNT_AT + COUNT_DUR,
        );

        /* =========================================================
           SCENE 5 (5.2–6.2s) — the badge flips in carrying the only

        tl.fromTo(
          "#f07-badge",

        tl.fromTo(

          { borderColor: "rgba(139,92,246,0.2)" },

        );
        tl.to(
          "#f07-badge",
          { borderColor: "rgba(139,92,246,0.45)", duration: 0.6, ease: "power2.inOut" },
          5.86,
        );

        // the shimmer itself — one clean sweep across the medallion.
        // transform and opacity are driven by separate tweens on disjoint
        // property sets so neither overwrites the other.
        tl.fromTo(
          "#f07-shimmer",
          { x: -80, rotation: 16 },
          { x: 168, rotation: 16, duration: 0.66, ease: "power2.inOut" },

        );
        tl.fromTo(
          "#f07-shimmer",
          { opacity: 0 },
          { opacity: 1, duration: 0.14, ease: "power1.out" },
          5.44,
        );
        tl.to("#f07-shimmer", { opacity: 0, duration: 0.2, ease: "power1.in" }, 5.9);

        tl.fromTo(
          "#f07-halo",
          { opacity: 0, scale: 0.72 },
          { opacity: 0.95, scale: 1, duration: 0.4, ease: "power2.out" },
          5.34,
        );
        tl.to("#f07-halo", { opacity: 0.3, duration: 0.9, ease: "power2.out" }, 5.8);

        tl.fromTo(
          "#f07-ach-title, #f07-ach-sub",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.1 },
          5.46,
        );

        // three counters, staggered by index
        function tick(sel, target, at) {
          var el = q(sel);
          var st = { v: 0 };
          tl.to(
            st,
            {
              v: target,
              duration: 0.55,
              ease: "power2.out",
              onUpdate: function () {
                el.textContent = Math.round(st.v);
              },
            },
            at,
          );
          tl.fromTo(
            el,
            { scale: 0.62, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.55, ease: "power2.out" },
            at,
          );
        }
        tick("#f07-streak", 14, 5.35);
        tick("#f07-badges", 11, 5.62);
        tick("#f07-modules", 10, 5.89);

        // fourteen days, fourteen marks — the streak's visual, no icon
        tl.fromTo(
          ".f07-tick",
          { scaleY: 0, opacity: 0.35 },
          { scaleY: 1, opacity: 1, duration: 0.3, ease: "power3.out", stagger: 0.028 },
          5.35,
        );

        /* =========================================================
           SCENE 6 (6.2–7.2s) — leaderboard rows settle in sequence,
           the bankroll curve draws left to right.
           ========================================================= */
        tl.fromTo(
          ".f07-row",
          { opacity: 0.22, y: 16 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.13 },
          6.2,
        );

        var curve = q("#f07-curve");
        var CURVE_LEN = curve.getTotalLength() * 1.02;
        curve.style.strokeDasharray = CURVE_LEN;
        curve.style.strokeDashoffset = CURVE_LEN;
        tl.to(curve, { strokeDashoffset: 0, duration: 0.86, ease: "power2.out" }, 6.25);
        tl.to("#f07-curve-area", { fillOpacity: 1, duration: 0.45, ease: "power1.out" }, 6.95);
        tl.fromTo(
          "#f07-curve-dot",
          { opacity: 0, scale: 0.4 },
          { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.8)" },
          7.05,
        );

        /* SCENE 7 (7.2–8.0s) — held, locked, still. Nothing moves. */
      })();
