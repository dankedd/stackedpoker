        },
        {
          segs: [{ t: "Look at what he keeps on " }, { t: "this board", key: "board" }, { t: "." }],
          show: [4.36, 5.32],
          seq: [
            { t: 4.40, n: 0 }, { t: 4.48, n: 5 }, { t: 4.56, n: 12 }, { t: 4.66, n: 21 },
            { t: 4.76, n: 25 }, { t: 4.88, n: 35 }, { t: 4.98, n: 36 }
          ]
        },
        {
          segs: [{ t: "Then price it " }, { t: "at this depth", key: "depth" }, { t: "." }],
          show: [5.32, 7.0],
          seq: [
            { t: 5.36, n: 0 }, { t: 5.44, n: 4 }, { t: 5.52, n: 10 }, { t: 5.60, n: 14 },
            { t: 5.68, n: 17 }, { t: 5.80, n: 27 }, { t: 5.90, n: 28 }
          ]
        }
      ];

      LINES.forEach(function (line, li) {
        var host = q('.f06-line[data-line="' + li + '"]');
        line.spans = line.segs.map(function (seg) {
          var el = document.createElement("span");
          if (seg.key) { el.className = "f06-key"; el.dataset.word = seg.key; }
          host.appendChild(el);
          return el;
        });
        var caret = document.createElement("span");
        caret.className = "f06-caret";
        host.appendChild(caret);
        line.caret = caret;
      });
      var keySpans = qa(".f06-key");

      function seqAt(seq, time) {
        for (var i = seq.length - 1; i >= 0; i--) { if (time >= seq[i].t) return seq[i].n; }
        return 0;
      }
      // Baked typing events (seek-safe: no mutable trackers)
      var CHANGE_TIMES = [];
      LINES.forEach(function (line) {
        line.seq.forEach(function (e, i) { if (i > 0 && e.n !== line.seq[i - 1].n) CHANGE_TIMES.push(e.t); });
      });
      var TYPING_GRACE = 0.07;
      var BLINK_CYCLES = 9; // whole number over DUR

      /* ---------------------------------------------------------------
         asr-keyword-glow — one envelope per keyed clause.
         REST is pushed high on purpose: by the last window all three
         couplings must read as lit AT ONCE.
      --------------------------------------------------------------- */
      var ATTACK = 0.18, RELEASE = 0.30, REST = 0.60;
      var MAX_BLUR = 22, MAX_SCALE = 0.04;
      var TIMINGS = {
        range: { start: 3.50, end: 3.95 },
        board: { start: 4.92, end: 5.30 },
        depth: { start: 5.84, end: 6.15 }
      };
      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK, 1);
        var rEnd = end + RELEASE;
        if (time < rEnd) return 1 - ((time - end) / RELEASE) * (1 - REST);
        return REST;
      }
      var REST_RGB = { r: 230, g: 234, b: 240 };
      var ACT_RGB = { r: 196, g: 181, b: 253 };
      function lerpCh(a, b, t) { return Math.round(a + (b - a) * t); }
      function colorAt(e) {
        return "rgb(" + lerpCh(REST_RGB.r, ACT_RGB.r, e) + "," + lerpCh(REST_RGB.g, ACT_RGB.g, e) + "," + lerpCh(REST_RGB.b, ACT_RGB.b, e) + ")";
      }

      var rangeCard = q(".f06-rangecard");
      var boardCard = q(".f06-boardcard");
      var stackCard = q(".f06-stackcard");
      var pcards = qa(".f06-pcard");

      function litCard(el, e) {
        el.style.borderColor = "rgba(139,92,246," + (0.2 + 0.6 * e).toFixed(3) + ")";
        el.style.background = "rgba(139,92,246," + (0.04 + 0.05 * e).toFixed(3) + ")";
        el.style.boxShadow = "0 0 " + (44 * e).toFixed(1) + "px rgba(139,92,246," + (0.28 * e).toFixed(3) + ")";
      }

      /* ---------------------------------------------------------------
         TIMELINE
      --------------------------------------------------------------- */
      var tl = gsap.timeline({ paused: true });
      var surface = q(".f06-surface");
      var drawer = q(".f06-drawer");

      // Scene 1 (0.0-0.8) — the lesson surface fills the frame, an answer is committed.
      tl.fromTo(surface, { opacity: 0, x: 380, scale: 1.04 }, { opacity: 1, duration: 0.32, ease: "power2.out" }, 0);

      var callBtn = q(".f06-call");
      var burst = q(".f06-burst");
      var bgGlow = q(".f06-bgglow");
      var committed = q(".f06-committed");
      // press-release-spring — linear compression, spring recovery, burst behind
      tl.to(callBtn, { scale: 0.92, backgroundColor: "rgba(139,92,246,0.10)", duration: 0.13, ease: "power1.in" }, 0.34);
      tl.to(callBtn, {
        scale: 1, backgroundColor: "#8B5CF6", color: "#0C101D", borderColor: "#8B5CF6",
        duration: 0.55, ease: "back.out(2)"
      }, 0.47);
      tl.fromTo(burst, { scale: 1, opacity: 0 }, { scale: 5.5, opacity: 0.55, duration: 0.40, ease: "power2.out" }, 0.47);
      tl.to(burst, { opacity: 0, duration: 0.45, ease: "power2.in" }, 0.87);
      tl.fromTo(bgGlow, { opacity: 0 }, { opacity: 0.16, duration: 0.80, ease: "power2.out" }, 0.47);
      tl.fromTo(committed, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(1.7)" }, 0.47);

      // Scene 2 (0.8-1.8) — drawer slides in from the right on a long-tail settle;
      // the surface EASES LEFT to make room rather than being covered.
      tl.fromTo(drawer, { opacity: 0, x: 780 }, { opacity: 1, x: 0, duration: 0.95, ease: "power3.out" }, 0.80);
      tl.to(surface, { x: 0, scale: 1, duration: 0.95, ease: "power3.out" }, 0.80);

      // drawer contents arrive on their own cues (never all at t=0)
      tl.fromTo(q(".f06-dhead"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 1.20);
      tl.fromTo(q(".f06-rule"), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.55, ease: "power2.out" }, 1.34);
      var quotes = qa(".f06-quote");
      tl.fromTo(quotes[0], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 1.62);
      tl.fromTo(quotes[1], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 2.86);
      tl.fromTo(q(".f06-why"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.38, ease: "power2.out" }, 4.18);
      var clauses = qa(".f06-clause");
      tl.fromTo(clauses[0], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.38, ease: "power2.out" }, 4.28);
      tl.fromTo(clauses[1], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.38, ease: "power2.out" }, 5.24);

      // Scenes 3-6 — ONE linear driver: typing, caret, and every coupling envelope.
      var driver = { t: 0 };
      tl.to(driver, {
        t: DUR, duration: DUR, ease: "none",
        onUpdate: function () {
          var time = driver.t;

          // ---- typed lines + context-sensitive caret ----
          var isTyping = false;
          for (var ct = 0; ct < CHANGE_TIMES.length; ct++) {
            if (CHANGE_TIMES[ct] <= time && time - CHANGE_TIMES[ct] < TYPING_GRACE) { isTyping = true; break; }
          }
          var blinkOn = Math.sin((time / DUR) * Math.PI * 2 * BLINK_CYCLES) > 0;

          for (var li = 0; li < LINES.length; li++) {
            var line = LINES[li];
            var n = seqAt(line.seq, time);
            var off = 0, caretColor = "#E6EAF0";
            for (var si = 0; si < line.segs.length; si++) {
              var full = line.segs[si].t;
              var take = Math.max(0, Math.min(n - off, full.length));
              line.spans[si].textContent = full.slice(0, take);
              if (n > off && n <= off + full.length) caretColor = line.segs[si].key ? "#8B5CF6" : "#E6EAF0";
              off += full.length;
            }
            var visible = time >= line.show[0] && time <= line.show[1];
            line.caret.style.background = caretColor;
            line.caret.style.opacity = !visible ? "0" : (isTyping ? "1" : (blinkOn ? "1" : "0"));
          }

          // ---- envelopes ----
          var eRange = envelope(time, TIMINGS.range.start, TIMINGS.range.end);
          var eBoard = envelope(time, TIMINGS.board.start, TIMINGS.board.end);
          var eDepth = envelope(time, TIMINGS.depth.start, TIMINGS.depth.end);
          var ENV = { range: eRange, board: eBoard, depth: eDepth };

          // the spoken clause itself (text-shadow hugs the glyph)
          for (var k = 0; k < keySpans.length; k++) {
            var el = keySpans[k];
            var e = ENV[el.dataset.word] || 0;
            el.style.textShadow = "0 0 " + (MAX_BLUR * e).toFixed(2) + "px rgba(167,139,250," + (0.9 * e).toFixed(3) + ")";
            el.style.transform = "scale(" + (1 + MAX_SCALE * e) + ")";
            el.style.color = colorAt(e);
          }

          // COUPLING 1 — "villain's range" -> cells bloom across the grid
          litCard(rangeCard, eRange);
          for (var b = 0; b < bloomCells.length; b++) {
            var bc = bloomCells[b];
            var ce = envelope(time - parseFloat(bc.dataset.delay), TIMINGS.range.start, TIMINGS.range.end);
            bc.style.background = "rgba(139,92,246," + (0.06 + 0.74 * ce).toFixed(3) + ")";
            bc.style.color = "rgba(230,234,240," + (0.25 + 0.7 * ce).toFixed(3) + ")";
            bc.style.transform = "scale(" + (1 + 0.10 * ce) + ")";
          }

          // COUPLING 2 — "this board" -> the flop lifts and rim-lights
          litCard(boardCard, eBoard);
          for (var p = 0; p < pcards.length; p++) {
            var pe = envelope(time - p * 0.07, TIMINGS.board.start, TIMINGS.board.end);
            pcards[p].style.transform = "translateY(" + (-13 * pe).toFixed(2) + "px) scale(" + (1 + 0.045 * pe) + ")";
            pcards[p].style.boxShadow = "0 " + (12 * pe).toFixed(1) + "px " + (28 * pe).toFixed(1) + "px rgba(6,8,16," + (0.6 * pe).toFixed(3) +
              "), 0 0 0 " + (2.5 * pe).toFixed(2) + "px rgba(139,92,246," + (0.9 * pe).toFixed(3) + ")";
          }

          // COUPLING 3 — "at this depth" -> the stack column pulses (multi-octave)
          litCard(stackCard, eDepth);
          var breathe = 1 + Math.sin(time * 7.5) * 0.20;
          for (var s = 0; s < chips.length; s++) {
            var idx = parseInt(chips[s].dataset.idx, 10);
            var se = envelope(time - idx * 0.02, TIMINGS.depth.start, TIMINGS.depth.end) * breathe;
            if (se < 0) se = 0;
            chips[s].style.background = "rgba(139,92,246," + (0.18 + 0.72 * se).toFixed(3) + ")";
            chips[s].style.transform = "translateY(" + (-idx * 1.1 * se).toFixed(2) + "px) scaleX(" + (1 + 0.04 * se) + ")";
          }
        }
      }, 0);

      // Scene 7 (6.3-7.0) — held. depth-of-field-blur settles everything
      // except the three lit regions. No camera move.
      qa(".f06-dof").forEach(function (el, i) {
        tl.to(el, { "--dof": (4 + i) + "px", opacity: 0.5, duration: 0.55, ease: "power2.inOut" }, 6.30);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["06-ai-coach"] = tl;
    })();
  </script>
</template>
