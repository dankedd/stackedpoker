      <div class="f04-surface" id="f04-surface" data-hf-id="hf-7smt">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var CX = 960, CY = 540;

      var layer    = document.getElementById("f04-clutter");
      var wash     = document.getElementById("f04-wash");
      var core     = document.getElementById("f04-core");
      var glowEl   = document.getElementById("f04-glow");
      var surface  = document.getElementById("f04-surface");
      var eyebrow  = document.getElementById("f04-eyebrow");
      var question = document.getElementById("f04-q");
      var subline  = document.getElementById("f04-sub");
      var pills    = surface.querySelectorAll(".f04-pill");

      /* ── the inherited clutter field ────────────────────────────
         Handoff from frame 03: ~40 cards, opacity 1, centred,
         drifting inward at ~6px/s. Built at load and seeded at t=0
         so it never re-enters or re-fades — it is simply there.     */
      function mulberry32(a) {
        return function () {
          a |= 0; a = a + 0x6D2B79F5 | 0;
          var t = Math.imul(a ^ a >>> 15, 1 | a);
          t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }

      var rnd = mulberry32(40407);
      var COLS = 8, ROWS = 5, cards = [];

      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          var w = 148 + Math.round(rnd() * 56);
          var h = 92 + Math.round(rnd() * 36);
          var px = 240 * (c + 0.5) + (rnd() - 0.5) * 92;
          var py = 122 + 164 * r + (rnd() - 0.5) * 52;
          var bx = px - CX, by = py - CY;
          var len = Math.sqrt(bx * bx + by * by) || 1;

          var el = document.createElement("div");
          el.className = "f04-chip";
          el.style.width = w + "px";
          el.style.height = h + "px";
          el.style.borderColor = "rgba(139, 92, 246, " + (0.16 + rnd() * 0.14).toFixed(3) + ")";

          var variant = (r * COLS + c) % 4;
          var inner = '<div class="f04-rule hd" style="width:' + (34 + Math.round(rnd() * 26)) + '%"></div>';
          if (variant === 0) {
            inner += '<div class="f04-rule" style="width:' + (72 + Math.round(rnd() * 24)) + '%"></div>'
                  +  '<div class="f04-rule" style="width:' + (48 + Math.round(rnd() * 30)) + '%"></div>';
          } else if (variant === 1) {
            inner += '<div class="f04-track"><div class="f04-fill" style="width:' + (38 + Math.round(rnd() * 46)) + '%"></div></div>'
                  +  '<div class="f04-rule" style="width:' + (54 + Math.round(rnd() * 26)) + '%"></div>';
          } else if (variant === 2) {
            inner += '<div class="f04-dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>';
          } else {
            inner += '<div class="f04-tag"></div>'
                  +  '<div class="f04-rule" style="width:' + (62 + Math.round(rnd() * 30)) + '%"></div>';
          }
          el.innerHTML = inner;
          layer.appendChild(el);

          cards.push({
            el: el,
            bx: bx, by: by,
            ux: -bx / len, uy: -by / len,
            rot: (rnd() - 0.5) * 18
          });
        }
      }

      /* center-outward-expansion, run in reverse: ONE shared progress
         value drives every card, so the field collapses in lockstep. */
      var st = { t: 0, p: 1 };
      function applyField() {
        var p = st.p, drift = 6 * st.t;
        var s = (0.26 + 0.74 * p).toFixed(4);
        var o = Math.min(1, p * 2.4).toFixed(3);
        for (var i = 0; i < cards.length; i++) {
          var k = cards[i];
          var x = (k.bx + k.ux * drift) * p;
          var y = (k.by + k.uy * drift) * p;
          k.el.style.transform =
            "translate(-50%,-50%) translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)" +
            " rotate(" + (k.rot * p).toFixed(2) + "deg) scale(" + s + ")";
          k.el.style.opacity = o;
        }
      }

      /* motion-blur-streak — depth smear ("B B", the collapse is a
         scale move), envelope locked to the collapse window AND ease
         so peak blur lands on peak speed. Seeded at 0. */
      var blur = { v: 0 };
      function applyBlur() {
        layer.style.filter = blur.v < 0.05 ? "none" : "blur(" + blur.v.toFixed(2) + "px)";
      }

      applyField();   // frame 0 = the inherited state, exactly
      applyBlur();

      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0–0.5) — the inherited field, live, still drifting inward. */
      tl.to(st, { t: 0.5, duration: 0.5, ease: "none", onUpdate: applyField }, 0);

      /* Scene 2 (0.5–1.1) — every card pulled to a single centre point. */
      tl.to(st, { p: 0, duration: 0.6, ease: "power3.in", onUpdate: applyField }, 0.5);
      tl.to(blur, { v: 19, duration: 0.6, ease: "power3.in", onUpdate: applyBlur }, 0.5);

      /* Scene 3 (1.1–1.4) — the point overshoots into a short violet flash. */
      tl.fromTo(core,
        { scale: 0.05, opacity: 0 },
        { scale: 1.06, opacity: 0.95, duration: 0.14, ease: "power3.out" }, 1.04);
      tl.fromTo(wash,
        { scale: 0.16, opacity: 0 },
        { scale: 1, opacity: 0.30, duration: 0.16, ease: "power2.out" }, 1.06);

      /* Scene 4 (1.4–2.3) — scale-swap-transition out of the flash:
         one centre, one transform-origin, so flash and surface read
         as a single continuous object. */
      tl.to(core, { scale: 0.74, opacity: 0, duration: 0.28, ease: "power2.in" }, 1.22);
      tl.to(wash, { scale: 0.88, opacity: 0, duration: 0.30, ease: "power2.in" }, 1.22);

      tl.fromTo(surface,
        { scale: 0.74, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.58, ease: "back.out(1.4)" }, 1.34);

      /* ambient-glow-bloom — bloom lands ON the surface's settle, one beat. */
      tl.fromTo(glowEl,
        { scale: 0.86, opacity: 0 },
        { scale: 1, opacity: 0.30, duration: 0.58, ease: "power2.out" }, 1.34);

      /* inner content once the container has settled */
      tl.fromTo(eyebrow,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.40, ease: "power3.out" }, 1.74);
      tl.fromTo(question,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.40, ease: "power3.out" }, 1.86);
      tl.fromTo(subline,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.40, ease: "power3.out" }, 1.98);

      /* Scene 5 (2.3–4.0) — held. The pills are the only reveal; then air. */
      for (var q = 0; q < pills.length; q++) {
        tl.fromTo(pills[q],
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.50, ease: "power3.out" }, 2.34 + q * 0.10);
      }

      /* bounded glow breathe — one slow half-cycle; sin(0) = 0 at both
         ends, so the stillness is never broken by a jump. */
      var phase = { p: 0 };
      tl.to(phase, {
        p: Math.PI,
        duration: 2.08,
        ease: "none",
        onUpdate: function () {
          var s = Math.sin(phase.p);
          glowEl.style.opacity = (0.30 + s * 0.022).toFixed(4);
        }
      }, 1.92);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-better-way"] = tl;
    })();
  </script>
