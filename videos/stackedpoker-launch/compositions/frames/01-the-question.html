  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["01-the-question"] = tl;

      var glowWrap = document.getElementById("f01q-glow-wrap");
      var glowCore = document.getElementById("f01q-glow-core");
      var shell = document.getElementById("f01q-shell");
      var card = document.getElementById("f01q-card");

      /* ── tokens ─────────────────────────────────────────────────────── */
      var GLOW_PEAK_OPACITY = 0.3; // core alpha; wrap opacity carries the bloom
      var GLOW_START_SCALE = 0.84;
      var BLOOM_START = 0.05;
      var BLOOM_DUR = 1.0;
      var OPACITY_AMP = 0.03;
      var SCALE_AMP = 0.015;

      var CARD_ENTRY = 0.95;
      var CARD_DUR = 0.95;
      var CARD_SETTLE = CARD_ENTRY + CARD_DUR; // 1.90

      var DEAL_START = 2.0;
      var DEAL_STEP = 0.22;
      var DEAL_DUR = 0.44;

      var BTN_START = 2.8;
      var BTN_STAGGER = 0.07;
      var BTN_DUR = 0.46;

      var DOF_START = 3.02;
      var DOF_DUR = 0.4;
      var BLUR_PER_DEPTH = 2; // px
      var DIM_LEVEL = 0.74;

      var IDLE_START = 2.0;
      var IDLE_DUR = 2.0;
      var IDLE_CYCLES = 1; // whole cycle → sin ends at 0, the hold ends at rest
      var Y_AMP_PX = 2;
      var CARD_SCALE_AMP = 0.004;

      /* ── Scene 1 (0.0–1.1s) — ambient glow bloom, from nothing ──────── */
      tl.fromTo(
        glowWrap,
        { opacity: 0, scale: GLOW_START_SCALE },
        { opacity: 0.72, scale: 0.97, duration: BLOOM_DUR, ease: "power2.out" },
        BLOOM_START
      );
      // the pool finishes opening exactly as the card settles — one beat
      tl.to(
        glowWrap,
        { opacity: 1, scale: 1, duration: CARD_SETTLE - (BLOOM_START + BLOOM_DUR), ease: "power2.out" },
        BLOOM_START + BLOOM_DUR
      );

      /* ── Scene 2 (1.1–2.0s) — the card rises into the pool ──────────── */
      tl.fromTo(
        shell,
        { opacity: 0, y: 72, scale: 0.94, rotation: -0.6 },
        { opacity: 1, y: 0, scale: 1, rotation: 0, duration: CARD_DUR, ease: "power3.out" },
        CARD_ENTRY
      );
      tl.fromTo(
        "#f01q-eyebrow",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        1.5
      );

      /* bounded glow breathe through the hold — finite phase, no yoyo */
      var glowPhase = { p: 0 };
      tl.to(
        glowPhase,
        {
          p: Math.PI * 2 * 0.62,
          duration: 4 - CARD_SETTLE,
          ease: "none",
          onUpdate: function () {
            var s = Math.sin(glowPhase.p);
            glowCore.style.opacity = String(GLOW_PEAK_OPACITY + s * OPACITY_AMP);
            glowCore.style.transform = "scale(" + (1 + s * SCALE_AMP) + ")";
          }
        },
        CARD_SETTLE
      );

      /* ── Scene 3 (2.0–2.8s) — the flop deals left→right on the VO ───── */
      // start/end pre-computed once at build, never inside onUpdate
      var BOARD = [];
      var boardEls = gsap.utils.toArray(".f01q-board-card");
      var cursor = DEAL_START;
      for (var i = 0; i < boardEls.length; i++) {
        BOARD.push({ el: boardEls[i], start: cursor, end: cursor + DEAL_DUR });
        cursor += DEAL_STEP;
      }
      BOARD.forEach(function (entry) {
        tl.fromTo(
          entry.el,
          { opacity: 0, x: -26, y: 14, scale: 0.9 },
          { opacity: 1, x: 0, y: 0, scale: 1, duration: DEAL_DUR, ease: "power3.out" },
          entry.start
        );
      });
      // pot + hero readout fade up behind the board
      tl.fromTo(
        "#f01q-pot",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        2.12
      );
      tl.fromTo(
        "#f01q-seat",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        2.5
      );

      /* ── Scene 4 (2.8–3.4s) — the three buttons arrive, then DoF ────── */
      gsap.utils.toArray(".f01q-action").forEach(function (el, n) {
        tl.fromTo(
          el,
          { opacity: 0, y: 20, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: BTN_DUR, ease: "power3.out" },
          BTN_START + n * BTN_STAGGER
        );
      });

      // focal pull: everything except the button row settles ~2px out of focus
      gsap.utils.toArray(".f01q-dof").forEach(function (el) {
        var depth = Number(el.getAttribute("data-depth")) || 1;
        tl.to(
          el,
          {
            "--dof": BLUR_PER_DEPTH * depth + "px",
            opacity: DIM_LEVEL,
            duration: DOF_DUR,
            ease: "power2.inOut"
          },
          DOF_START
        );
      });
      // the pool recedes with them (dim only — no blur on the giant surface)
      tl.to(glowWrap, { opacity: 0.84, duration: DOF_DUR, ease: "power2.inOut" }, DOF_START);

      /* ── Scene 5 (3.4–4.0s) — held. Only low-amplitude jitter. ──────── */
      var cardPhase = { p: 0 };
      tl.to(
        cardPhase,
        {
          p: Math.PI * 2 * IDLE_CYCLES,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            var s = Math.sin(cardPhase.p);
            card.style.transform =
              "translateY(" + s * Y_AMP_PX + "px) scale(" + (1 + s * CARD_SCALE_AMP) + ")";
          }
        },
        IDLE_START
      );
    })();
  </script>
