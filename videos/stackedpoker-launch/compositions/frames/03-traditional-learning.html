  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FRAME = "03-traditional-learning";
      var root = document.querySelector('[data-composition-id="' + FRAME + '"]');
      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME] = tl;
      if (!root) return;

      var q = function (sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); };

      var CX = 960, CY = 540;
      var cards = q(".f03tl-card");

      /* deterministic geometry: every card's outward unit vector + radius from frame centre */
      var geom = cards.map(function (el) {
        var cx = parseFloat(el.style.left) + parseFloat(el.style.width) / 2;
        var cy = parseFloat(el.style.top) + parseFloat(el.style.height) / 2;
        var dx = cx - CX, dy = cy - CY;
        var r = Math.sqrt(dx * dx + dy * dy) || 1;
        return { el: el, ux: dx / r, uy: dy / r, r: r };
      });
      var G = function (el) {
        for (var i = 0; i < geom.length; i++) { if (geom[i].el === el) return geom[i]; }
        return { ux: 0, uy: 0, r: 1 };
      };

      /* ------------------------------------------------------------------
         SCENE 1 (0.0–1.4s) — the calm lesson surface is still faintly there,
         then the first ring of clutter assembles out of a 3D depth cloud.
         rule: depth-scatter-assemble
      ------------------------------------------------------------------ */
      tl.fromTo("#f03tl-calm-wrap", { opacity: 0.6 }, { opacity: 0, duration: 1.2, ease: "power2.in" }, 0.3);

      var ring1 = q('.f03tl-card[data-ring="1"]');
      var n1 = ring1.length;
      var GOLDEN = Math.PI * (3 - Math.sqrt(5));
      var RADIUS = 420, Z_NEAR = 430, Z_FAR = -330, TUMBLE = 62;

      /* park the cloud BEFORE any tween so frame 0 is the scatter, not the layout */
      ring1.forEach(function (el, i) {
        var a = i * GOLDEN;
        var t = n1 > 1 ? i / (n1 - 1) : 0;
        gsap.set(el, {
          x: Math.cos(a) * RADIUS,
          y: Math.sin(a) * RADIUS,
          z: Z_NEAR - t * (Z_NEAR - Z_FAR),
          rotationX: Math.sin(a) * TUMBLE,
          rotationY: Math.cos(a) * TUMBLE,
          opacity: 0
        });
      });

      /* the cloud has life while it collapses, and resolves flat */
      tl.fromTo("#f03tl-ring1", { rotationY: -18 }, { rotationY: 0, duration: 1.45, ease: "power1.out" }, 0);

      ring1.forEach(function (el, i) {
        tl.to(el, {
          x: 0, y: 0, z: 0, rotationX: 0, rotationY: 0, opacity: 1,
          duration: 0.95, ease: "power3.out"
        }, 0.12 + i * 0.06);
      });

      /* the read living in the last pocket of air */
      tl.fromTo("#f03tl-focus", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.3);
      tl.fromTo("#f03tl-sliver", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 0.3);

      /* ------------------------------------------------------------------
         SCENE 2 (1.4–3.2s) — rings 2 and 3 arrive, staggered outward from
         centre. Density climbs past ~60% of canvas.
      ------------------------------------------------------------------ */
      var R2_AT = 1.4, R2_STAG = 0.055, R2_DUR = 0.85, R2_DIST = 470;
      q('.f03tl-card[data-ring="2"]').forEach(function (el, i) {
        var g = G(el);
        tl.fromTo(el,
          { x: g.ux * R2_DIST, y: g.uy * R2_DIST, scale: 1.14, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: R2_DUR, ease: "power3.out" },
          R2_AT + i * R2_STAG);
      });

      var R3_AT = 2.2, R3_STAG = 0.05, R3_DUR = 0.75, R3_DIST = 620;
      q('.f03tl-card[data-ring="3"]').forEach(function (el, i) {
        var g = G(el);
        tl.fromTo(el,
          { x: g.ux * R3_DIST, y: g.uy * R3_DIST, scale: 1.18, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: R3_DUR, ease: "power3.out" },
          R3_AT + i * R3_STAG);
      });

      /* ------------------------------------------------------------------
         SCENE 3 (3.2–5.0s) — the fourth ring fills the corners and the last
         of the margins, riding a velocity smear so it reads as speed, not
         placement.  rule: motion-blur-streak (path A, directional)
      ------------------------------------------------------------------ */
      var R4_AT = 3.35, R4_STAG = 0.075, R4_DUR = 0.46, R4_DIST = 760, PEAK_BLUR = 16;
      q('.f03tl-card[data-ring="4"]').forEach(function (el, i) {
        var g = G(el);
        var node = root.querySelector("#f03tl-blur-" + el.getAttribute("data-streak"));
        var axisX = Math.abs(g.ux) >= Math.abs(g.uy);
        var proxy = { v: PEAK_BLUR };
        var write = function () {
          var v = proxy.v.toFixed(2);
          if (node) node.setAttribute("stdDeviation", axisX ? v + " 0" : "0 " + v);
        };
        write(); /* seed frame 0 at the streaked start */

        var at = R4_AT + i * R4_STAG;
        tl.fromTo(el,
          { x: g.ux * R4_DIST, y: g.uy * R4_DIST, opacity: 0 },
          { x: 0, y: 0, opacity: 1, duration: R4_DUR, ease: "power4.out" },
          at);
        tl.to(proxy, { v: 0, duration: R4_DUR, ease: "power4.out", onUpdate: write }, at);
      });

      /* ------------------------------------------------------------------
         SCENE 4 (5.0–6.2s) — the whole field closes INWARD from all four
         edges at once. Nothing zooms; the frame is being crowded. Each card
         translates along its own centre-vector by an amount proportional to
         how far out it sits, so the outer edge eats the margins first and
         the last sliver of air shrinks toward centre.
      ------------------------------------------------------------------ */
      var CLOSE_AT = 5.0, CLOSE_DUR = 1.2, CLOSE_K = 0.11;
      geom.forEach(function (g) {
        var d = g.r * CLOSE_K;
        tl.to(g.el, { x: -g.ux * d, y: -g.uy * d, duration: CLOSE_DUR, ease: "power1.inOut" }, CLOSE_AT);
      });
      tl.to("#f03tl-sliver", { scale: 0.72, duration: CLOSE_DUR, ease: "power1.inOut" }, CLOSE_AT);
      tl.to("#f03tl-focus", { scale: 0.94, duration: CLOSE_DUR, ease: "power1.inOut" }, CLOSE_AT);

      /* ------------------------------------------------------------------
         SCENE 5 (6.2–7.0s) — everything goes off-focus together as the VO's
         ellipsis trails out, while the field keeps creeping inward.
         rule: depth-of-field-blur (no dim — the handoff demands opacity 1)

         HANDOFF OUT to frame 04, at t = 7.0 exactly:
           · 40 cards, edge to edge, opacity 1
           · centre of mass at frame centre (every move is radial)
           · still drifting inward — the last leg is linear and covers
             4.8px over 0.8s = 6px/s, so velocity at the boundary is 6px/s
         Do NOT resolve this. Frame 04 owns the release.
      ------------------------------------------------------------------ */
      var DOF_AT = 6.2, DOF_DUR = 0.8;
      var DEPTH_BLUR = { "1": 4, "2": 6, "3": 9, "4": 12 };
      cards.forEach(function (el) {
        var d = DEPTH_BLUR[el.getAttribute("data-depth")] || 6;
        tl.to(el, { "--dof": d + "px", duration: DOF_DUR, ease: "power2.inOut" }, DOF_AT);
      });
      tl.to("#f03tl-focus", { "--dof": "8px", duration: DOF_DUR, ease: "power2.inOut" }, DOF_AT);

      var DRIFT_PX = 4.8; /* 6px/s across the 0.8s tail — the handoff velocity */
      geom.forEach(function (g) {
        var d = g.r * CLOSE_K + DRIFT_PX;
        tl.to(g.el, { x: -g.ux * d, y: -g.uy * d, duration: DOF_DUR, ease: "none" }, DOF_AT);
      });
    })();
  </script>
