  <script>
    (function () {
      var q = function (sel) { return document.querySelector(sel); };

      var CURSOR = "#f02-cursor";
      var BTN = { fold: "#f02-btn-fold", call: "#f02-btn-call", raise: "#f02-btn-raise" };
      var RIP = { fold: "#f02-ripple-fold", call: "#f02-ripple-call", raise: "#f02-ripple-raise" };
      var RING_IN = "#f02-freeze-inner", RING_OUT = "#f02-freeze-outer";

      // cursor rest offsets relative to the Call button centre (its CSS anchor)
      var IDLE = { x: 96, y: 74 };
      var AT = { call: 0, raise: 212, fold: -212 };

      var NEUTRAL = {
        borderColor: "rgba(139,92,246,0.2)",
        backgroundColor: "rgba(139,92,246,0.04)",
        color: "#E6EAF0"
      };
      var FROZEN = {
        borderColor: "#B41C22",
        backgroundColor: "rgba(180,28,34,0.10)",
        color: "#B41C22"
      };

      // ---- deterministic rest state (t = 0) --------------------------------
      gsap.set(CURSOR, { x: IDLE.x, y: IDLE.y, scale: 1 });
      gsap.set([RIP.fold, RIP.call, RIP.raise], { scale: 0, opacity: 0 });
      gsap.set([RING_IN, RING_OUT], { opacity: 0 });
      gsap.set([BTN.fold, BTN.call, BTN.raise], Object.assign({ scale: 1 }, NEUTRAL));
      gsap.set("#f02-verdict-1", { opacity: 0, x: 0, y: 10 });
      gsap.set("#f02-verdict-2", { opacity: 0, x: 0, y: 10 });
      gsap.set("#f02-player-1", { opacity: 1, x: 0 });
      gsap.set("#f02-player-2", { opacity: 0, x: -230 });
      gsap.set("#f02-player-3", { opacity: 0, x: 230 });
      gsap.set(["#f02-top-band", "#f02-card-header", "#f02-board", "#f02-player-row", "#f02-verdict-zone"],
        { "--dof": "0px", opacity: 1 });

      var tl = gsap.timeline({ paused: true });

      // ---- reusable pieces --------------------------------------------------
      // cursor-click-ripple : press depression on cursor + target, then ring
      function commit(opts) {
        var t = opts.at, btn = opts.btn, rip = opts.ripple;

        // cursor depresses more than the target — the cursor is the actor
        tl.fromTo(CURSOR, { scale: 1 },
          { scale: 0.85, duration: 0.07, ease: "power2.in", immediateRender: false }, t);
        tl.fromTo(CURSOR, { scale: 0.85 },
          { scale: 1, duration: 0.10, ease: "power2.out", immediateRender: false }, t + 0.07);

        // press-release-spring on the button: linear compression, spring recovery
        tl.fromTo(btn, { scale: 1 },
          { scale: 0.92, duration: 0.10, ease: "power1.in", immediateRender: false }, t);
        tl.fromTo(btn, { scale: 0.92 },
          { scale: 1, duration: opts.releaseDur, ease: opts.releaseEase, immediateRender: false }, t + 0.10);

        // single ring from the button's visual centre
        tl.fromTo(rip, { scale: 0, opacity: opts.ripOpacity },
          { scale: opts.ripScale, opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false },
          t + 0.03);
      }

      function freezeOn(t, btn) {
        tl.fromTo(btn, NEUTRAL,
          Object.assign({ duration: 0.06, ease: "none", immediateRender: false }, FROZEN), t);
        tl.fromTo([RING_IN, RING_OUT], { opacity: 0 },
          { opacity: 1, duration: 0.05, ease: "none", immediateRender: false }, t);
      }

      function freezeOff(t, btn) {
        tl.fromTo(btn, FROZEN,
          Object.assign({ duration: 0.05, ease: "none", immediateRender: false }, NEUTRAL), t);
        tl.fromTo([RING_IN, RING_OUT], { opacity: 1 },
          { opacity: 0, duration: 0.03, ease: "none", immediateRender: false }, t);
      }

      // cut-the-curve : exit accelerates, entry continues in the SAME direction
      function curveOut(t, sel, dir, dur) {
        tl.fromTo(sel, { x: 0 },
          { x: 230 * dir, duration: dur, ease: "power4.in", immediateRender: false }, t);
        tl.fromTo(sel, { opacity: 1 },
          { opacity: 0, duration: dur - 0.08, ease: "power1.in", immediateRender: false }, t);
      }
      function curveIn(t, sel, dir, dur) {
        tl.fromTo(sel, { x: -230 * dir, opacity: 0.35 },
          { x: 0, opacity: 1, duration: dur, ease: "power4.out", immediateRender: false }, t);
      }

      // ======================================================================
      // Scene 1 (0.0–0.6) — hard cut in. The card is ALREADY here, in the exact
      // position frame 01 left it. Nothing enters, nothing re-animates.
      // ======================================================================

      // ======================================================================
      // Scene 2 (0.6–1.7) — the cursor arrives on Call and commits.
      // ======================================================================
      tl.fromTo(CURSOR, { x: IDLE.x, y: IDLE.y },
        { x: AT.call, y: 0, duration: 0.42, ease: "back.out(1.3)" }, 0.55);

      commit({ at: 1.05, btn: BTN.call, ripple: RIP.call,
               releaseDur: 0.20, releaseEase: "back.out(2)",
               ripScale: 3.2, ripOpacity: 0.85 });

      freezeOn(1.13, BTN.call);

      tl.fromTo("#f02-verdict-1", { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.22, ease: "power2.out", immediateRender: false }, 1.18);
      // 1.53 – 1.70 : the freeze. Nothing moves.

      // ======================================================================
      // Scene 3 (1.7–2.8) — cut-the-curve seam (rightward, matched to the
      // cursor's travel) into a new player who commits Raise. Same red freeze.
      // ======================================================================
      curveOut(1.70, "#f02-verdict-1", 1, 0.24);
      curveOut(1.70, "#f02-player-1", 1, 0.24);
      // the cursor crosses the cut at peak velocity — one continuous move
      tl.fromTo(CURSOR, { x: AT.call },
        { x: AT.raise, duration: 0.44, ease: "power2.inOut", immediateRender: false }, 1.72);

      freezeOff(1.94, BTN.call);
      curveIn(1.94, "#f02-player-2", 1, 0.26);

      commit({ at: 2.24, btn: BTN.raise, ripple: RIP.raise,
               releaseDur: 0.20, releaseEase: "back.out(2)",
               ripScale: 3.2, ripOpacity: 0.85 });

      freezeOn(2.32, BTN.raise);

      tl.fromTo("#f02-verdict-2", { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.22, ease: "power2.out", immediateRender: false }, 2.37);
      // 2.72 – 2.80 : the same freeze again. The repetition is the argument.

      // ======================================================================
      // Scene 4 (2.8–4.0) — the same seam (leftward) into Fold. The press
      // lands and NO verdict arrives. The hairline stays neutral.
      // ======================================================================
      curveOut(2.80, "#f02-verdict-2", -1, 0.26);
      curveOut(2.80, "#f02-player-2", -1, 0.26);
      tl.fromTo(CURSOR, { x: AT.raise },
        { x: AT.fold, duration: 0.50, ease: "power2.inOut", immediateRender: false }, 2.82);

      freezeOff(3.06, BTN.raise);
      curveIn(3.06, "#f02-player-3", -1, 0.28);

      // decelerated cadence: a longer beat of hesitation before this one lands
      commit({ at: 3.52, btn: BTN.fold, ripple: RIP.fold,
               releaseDur: 0.24, releaseEase: "back.out(1.6)",
               ripScale: 2.4, ripOpacity: 0.55 });
      // no freezeOn, no verdict. The slot stays empty.

      // ======================================================================
      // Scene 5 (4.0–5.0) — depth-of-field creeps outward from the button row.

      // ======================================================================
      var BLUR_PER_DEPTH = 4;
      var DIM = { 1: 0.7, 2: 0.55, 3: 0.45 };
      ["#f02-player-row", "#f02-verdict-zone", "#f02-board", "#f02-card-header", "#f02-top-band"]

          tl.fromTo(sel, { "--dof": "0px", opacity: 1 },
            {

              opacity: DIM[depth],
              duration: 0.80,
              ease: "power2.inOut",
              immediateRender: false
            }, 4.05);
        });

      // subtle jitter only — the hesitation held a beat too long
      tl.fromTo(CURSOR, { x: AT.fold, y: 0 },
        { x: AT.fold + 1.6, y: 1.2, duration: 0.26, ease: "sine.inOut", immediateRender: false }, 4.02);
      tl.fromTo(CURSOR, { x: AT.fold + 1.6, y: 1.2 },
        { x: AT.fold - 1.4, y: -0.9, duration: 0.30, ease: "sine.inOut", immediateRender: false }, 4.28);
      tl.fromTo(CURSOR, { x: AT.fold - 1.4, y: -0.9 },
        { x: AT.fold + 1.1, y: 0.8, duration: 0.24, ease: "sine.inOut", immediateRender: false }, 4.58);
      tl.fromTo(CURSOR, { x: AT.fold + 1.1, y: 0.8 },
        { x: AT.fold, y: 0, duration: 0.18, ease: "sine.inOut", immediateRender: false }, 4.82);

      window.__timelines = window.__timelines || {};
      window.__timelines["02-everyone-knows"] = tl;
    })();
