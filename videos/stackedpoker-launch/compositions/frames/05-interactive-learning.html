  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="05-interactive-learning"]');
      var $ = function (sel) { return root.querySelector(sel); };
      var SVGNS = "http://www.w3.org/2000/svg";

      /* ═══════════════════════════════════════════════════════════════════
         CAMERA — exactly ONE move across the whole 12s.
         viewport-change (virtual camera): camera pans right, world
         translates left. Single .world wrapper, single `cam` object,
         single applyCamera() writer.

         The ease is one cubic ("power3") curve: a constant cruise that
         hands off C1-continuously into a power3 deceleration to a full
         stop on station 08. One tween, no cuts, no per-station hold.

         GEOMETRY LAW (the thing that must never drift again):
         station centres are laid out on a UNIFORM pitch, and the arrival
         times are DERIVED by inverting the camera ease. Layout is the
         source of truth; timing follows it. That guarantees the camera and
         the plane can never disagree, and that consecutive cards always
         overlap the viewport edges (pitch 1100 < card 980 + 1920 viewport),
         so no moment of the shot can read as empty canvas.
         ═══════════════════════════════════════════════════════════════════ */
      var CENTER_X = 960;          // viewport centre
      var CARD_W = 980;
      var STEP = 1100;             // uniform station pitch (120px gutter)
      var LEAD = STEP;             // plane runs one pitch before station 01
      var PREROLL = 258;           // ≈0.34s of travel before 01 centres, so the
                                   // frame opens with the camera already moving
      var TRAVEL = PREROLL + STEP * 7;   // total world displacement
      var CAM_START = 0.0;
      var CAM_END = 11.2;
      var CAM_DUR = CAM_END - CAM_START;
      var K = 0.90;                // cruise fraction; decel owns the last 10%
      var V = 3 / (1 + 2 * K);     // cruise velocity that matches the cubic tail
      var A_CRUISE = V * K;        // ease value at the cruise/decel seam

      function camEase(p) {
        if (p <= 0) return 0;
        if (p >= 1) return 1;
        if (p <= K) return V * p;
        var q = (p - K) / (1 - K);
        return A_CRUISE + (1 - A_CRUISE) * (1 - Math.pow(1 - q, 3));
      }
      /* exact inverse of camEase — used to derive arrival times from layout */
      function camEaseInv(u) {
        if (u <= 0) return 0;
        if (u >= 1) return 1;
        if (u <= A_CRUISE) return u / V;
        var rem = 1 - (u - A_CRUISE) / (1 - A_CRUISE);
        var q = 1 - Math.pow(rem, 1 / 3);
        return K + q * (1 - K);
      }

      /* Station world centres — uniform pitch, laid out first. */
      var CENTERS = [];
      for (var ci = 0; ci < 8; ci++) CENTERS.push(CENTER_X + LEAD + PREROLL + ci * STEP);

      /* Arrival times DERIVED from the ease, so each station is dead-centre
         at A[i] without the camera ever stopping or cutting. */
      var A = CENTERS.map(function (c) {
        return CAM_START + CAM_DUR * camEaseInv((c - CENTER_X - LEAD) / TRAVEL);
      });
      /* A ≈ [0.34, 1.78, 3.23, 4.67, 6.12, 7.56, 9.01, 11.20] */

      /* three parallax planes */
      var R_BACK = 0.62, R_MID = 1.0, R_FORE = 1.16;
      function placeAt(center, rate) {
        return CENTER_X * (1 - rate) + rate * center;
      }

      var world = $("#f05-world");
      var backL = $("#f05-back");
      var foreL = $("#f05-fore");
      var railFill = $("#f05-rail-fill");

      var cam = { x: -LEAD, jx: 0, jy: 0 };
      function applyCamera() {
        var x = cam.x + cam.jx;
        world.style.transform = "translate3d(" + x + "px," + cam.jy + "px,0)";
        backL.style.transform = "translate3d(" + ((R_BACK - 1) * cam.x) + "px,0,0)";
        foreL.style.transform = "translate3d(" + ((R_FORE - 1) * cam.x) + "px,0,0)";
        var prog = (-cam.x - LEAD) / TRAVEL;
        railFill.style.transform = "scaleX(" + Math.min(1, Math.max(0, prog)) + ")";
      }

      /* ── lay the mid plane out along the real oversized canvas ─────────── */
      var cards = root.querySelectorAll(".f05-card");
      for (var i = 0; i < cards.length; i++) {
        cards[i].style.left = (CENTERS[i] - CARD_W / 2) + "px";
      }
      /* decorative plane continuation, one pitch outside the run */
      $("#f05-edge-lead").style.left = (CENTERS[0] - STEP - CARD_W / 2) + "px";
      $("#f05-edge-tail").style.left = (CENTERS[7] + STEP - CARD_W / 2) + "px";

      /* ── back plane: ghost station numerals ────────────────────────────── */
      for (var b = 0; b < 8; b++) {
        var g = document.createElement("div");
        g.className = "f05-ghost-num";
        g.style.left = placeAt(CENTERS[b], R_BACK) + "px";
        g.textContent = "0" + (b + 1);
        backL.appendChild(g);
      }

      /* ── fore plane: icon badges (the supplied lucide marks) + stems ───── */
      var ICONS = {
        1: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/>',
        2: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
        3: '<line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.544-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.152A4 4 0 0 0 17.32 5z"/>',
        5: '<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>',
        7: '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/>'
      };
      for (var f = 0; f < 8; f++) {
        var fx = placeAt(CENTERS[f], R_FORE);
        var badge = document.createElement("div");
        badge.className = "f05-badge";

        foreL.appendChild(badge);

        var stem = document.createElement("div");

      applyCamera(); // seed frame 0

      /* ═══════════════════════════════════════════════════════════════════
         STATION CONTENT — built synchronously, deterministically.
         ═══════════════════════════════════════════════════════════════════ */
      var RANKS = ["A", "K", "Q", "J", "T", "9", "8", "7", "6", "5", "4", "3", "2"];
      function handLabel(r, c) {
        if (r === c) return RANKS[r] + RANKS[r];
        return c > r ? RANKS[r] + RANKS[c] + "s" : RANKS[c] + RANKS[r] + "o";
      }
      /* Visual model only — a plausible grid silhouette for a 12s pan.
         No frequency, EV or solver figure is printed anywhere in this frame. */
      function inOpen(r, c) {
        if (r === c) return r <= 9;
        return c > r ? (r + c) <= 12 : (r + c) <= 8;
      }
      function inNarrow(r, c) {
        if (r === c) return r <= 5;
        return c > r ? (r + c) <= 6 : (r + c) <= 4;
      }

      function buildGrid(host, cellSize, gap, fontSize, test, prelit) {
        var out = [];
        for (var r = 0; r < 13; r++) {
          for (var c = 0; c < 13; c++) {
            var cell = document.createElement("div");
            cell.className = "f05-cell";
            cell.style.width = cellSize + "px";
            cell.style.height = cellSize + "px";
            cell.style.left = (c * (cellSize + gap)) + "px";
            cell.style.top = (r * (cellSize + gap)) + "px";

            var lit = test(r, c);
            var strength = r === c ? 0.85 : (c > r ? 0.62 : 0.4);
            var fillEl = document.createElement("i");
            fillEl.style.background = "rgba(139,92,246," + strength + ")";
            if (prelit && lit) fillEl.style.transform = "scaleX(1)";
            cell.appendChild(fillEl);

            var lab = document.createElement("b");
            lab.style.fontSize = fontSize + "px";
            lab.textContent = handLabel(r, c);
            if (fontSize < 9) lab.style.opacity = "0";
            cell.appendChild(lab);

            host.appendChild(cell);
            out.push({ el: cell, fill: fillEl, r: r, c: c, lit: lit, dist: Math.max(r, c) });
          }
        }
        return out;
      }

      /* 02 — the focal 13x13 (530px: cell 38 + gap 3) */
      var openCells = buildGrid($("#f05-grid-open"), 38, 3, 11, inOpen, false);
      /* 06 — villain range, starts wide then narrows (491px: cell 35 + gap 3) */
      var villCells = buildGrid($("#f05-grid-villain"), 35, 3, 10, inOpen, true);

      /* street chips beside the villain grid */
      var streets = ["Flop", "Turn", "River"];
      var streetEls = [];
      var streetHost = $("#f05-streets");
      for (var s = 0; s < streets.length; s++) {
        var chip = document.createElement("div");
        chip.className = "f05-chip";
        chip.style.width = "381px";
        chip.style.height = "66px";
        chip.style.left = "527px";
        chip.style.top = (66 + s * 88) + "px";

        chip.style.fontSize = "22px";
        chip.textContent = streets[s];
        streetHost.appendChild(chip);
        streetEls.push(chip);
      }

      /* suit marks — drawn, never glyphs (the shipped font has no suit range) */
      var SUITS = {
        s: { d: "M12 2 C6 8 3 10 3 14 A4.6 4.6 0 0 0 11 17.2 L10 22 H14 L13 17.2 A4.6 4.6 0 0 0 21 14 C21 10 18 8 12 2 Z", fill: "#121726" },
        h: { d: "M12 21.4 C6 16.2 2 12.4 2 8.4 A4.6 4.6 0 0 1 12 6.2 A4.6 4.6 0 0 1 22 8.4 C22 12.4 18 16.2 12 21.4 Z", fill: "#B41C22" },
        d: { d: "M12 2 L21 12 L12 22 L3 12 Z", fill: "#B41C22" },
        c: { d: "M12 2 A4.4 4.4 0 0 1 15.2 9.4 A4.4 4.4 0 1 1 16.4 17.6 A4.4 4.4 0 0 1 13 15.6 L14 22 H10 L11 15.6 A4.4 4.4 0 0 1 7.6 17.6 A4.4 4.4 0 1 1 8.8 9.4 A4.4 4.4 0 0 1 12 2 Z", fill: "#121726" }
      };
      function miniCard(rank, suit, w, h) {
        var el = document.createElement("div");
        el.className = "f05-mini";
        el.style.width = w + "px";
        el.style.height = h + "px";
        el.innerHTML =
          "<span>" + rank + "</span>" +
          '<svg viewBox="0 0 24 24"><path d="' + SUITS[suit].d + '" fill="' + SUITS[suit].fill + '"></path></svg>';
        return el;
      }

      /* 01 — six seats + a three-card board, all vector */
      var seatRing = $("#f05-spot-seats");
      var SPOT_LABELS = ["UTG", "HJ", "CO", "BTN", "SB", "BB"];
      for (var k = 0; k < 6; k++) {
        var a = (-90 + k * 60) * Math.PI / 180;
        var sx = 454 + 322 * Math.cos(a);
        var sy = 196 + 158 * Math.sin(a);
        var gg = document.createElementNS(SVGNS, "g");
        gg.setAttribute("class", k === 3 ? "f05-seat f05-seat-hero" : "f05-seat");
        var cc = document.createElementNS(SVGNS, "circle");
        cc.setAttribute("cx", sx); cc.setAttribute("cy", sy); cc.setAttribute("r", 32);
        var tt = document.createElementNS(SVGNS, "text");
        tt.setAttribute("x", sx); tt.setAttribute("y", sy + 1);
        tt.setAttribute("font-size", "14");
        tt.textContent = SPOT_LABELS[k];
        gg.appendChild(cc); gg.appendChild(tt);
        seatRing.appendChild(gg);
      }
      var boardG = $("#f05-spot-board");
      var BOARD = [["A", "s"], ["9", "h"], ["4", "d"]];
      for (var bd = 0; bd < 3; bd++) {
        var bx = 358 + bd * 68;
        var rect = document.createElementNS(SVGNS, "rect");
        rect.setAttribute("x", bx); rect.setAttribute("y", 156);
        rect.setAttribute("width", 56); rect.setAttribute("height", 80);
        rect.setAttribute("rx", 7); rect.setAttribute("fill", "#E6EAF0");
        boardG.appendChild(rect);
        var rt = document.createElementNS(SVGNS, "text");
        rt.setAttribute("x", bx + 10); rt.setAttribute("y", 182);
        rt.setAttribute("font-size", "24"); rt.setAttribute("font-weight", "700");
        rt.setAttribute("fill", "#121726");
        rt.setAttribute("font-family", "Geist, sans-serif");
        rt.textContent = BOARD[bd][0];
        boardG.appendChild(rt);
        var sp = document.createElementNS(SVGNS, "path");
        sp.setAttribute("d", SUITS[BOARD[bd][1]].d);
        sp.setAttribute("fill", SUITS[BOARD[bd][1]].fill);
        sp.setAttribute("transform", "translate(" + (bx + 28) + "," + 196 + ") scale(0.92)");
        boardG.appendChild(sp);
      }

      /* 03 — tray + the card that flies into the third flop slot */
      var tray = $("#f05-tray");
      var TRAY = [["K", "c"], ["Q", "d"], ["7", "h"], ["J", "s"], ["T", "d"], ["5", "c"], ["8", "h"]];
      var trayEls = [];
      for (var t = 0; t < TRAY.length; t++) {
        var mc = miniCard(TRAY[t][0], TRAY[t][1], 108, 152);
        mc.style.left = (12 + t * 126) + "px";
        mc.style.top = "36px";
        tray.appendChild(mc);
        trayEls.push(mc);
      }
      var FLY_FROM_X = 12 + 3 * 126, FLY_FROM_Y = 36;
      var fly = miniCard(TRAY[3][0], TRAY[3][1], 108, 152);
      fly.id = "f05-fly";
      fly.style.left = FLY_FROM_X + "px";
      fly.style.top = FLY_FROM_Y + "px";
      fly.style.zIndex = "20";
      $("#f05-fly-wrap").appendChild(fly);
      trayEls[3].style.opacity = "0.18";
      var FLY_DX = (562 + 21) - FLY_FROM_X;   /* slot 3 left + (150-108)/2 */
      var FLY_DY = (262 + 30) - FLY_FROM_Y;   /* slot 3 top  + (212-152)/2 */

      /* 04 — source pool of hands */
      var pool = $("#f05-pool");
      var POOL = ["AJs", "KQo", "T9s", "76s", "A5s", "QJo", "88", "K7s"];
      var poolEls = [];
      for (var p = 0; p < POOL.length; p++) {
        var ch = document.createElement("div");
        ch.className = "f05-chip";
        ch.style.width = "128px";
        ch.style.height = "56px";
        ch.style.left = (63 + (p % 4) * 218) + "px";
        ch.style.top = (40 + Math.floor(p / 4) * 66) + "px";
        ch.textContent = POOL[p];
        pool.appendChild(ch);
        poolEls.push(ch);
      }

      /* 08 — the 6-max seat ring */
      var seatsG = $("#f05-seats");
      var POS = ["UTG", "HJ", "CO", "BTN", "SB", "BB"];
      var seatEls = [];
      for (var q = 0; q < 6; q++) {
        var ang = (-90 + q * 60) * Math.PI / 180;
        var px = 454 + 372 * Math.cos(ang);
        var py = 245 + 200 * Math.sin(ang);
        var sg = document.createElementNS(SVGNS, "g");
        sg.setAttribute("class", q === 3 ? "f05-seat f05-seat-hero" : "f05-seat");
        sg.style.transformOrigin = px + "px " + py + "px";
        var sc = document.createElementNS(SVGNS, "circle");
        sc.setAttribute("cx", px); sc.setAttribute("cy", py); sc.setAttribute("r", 40);
        var st = document.createElementNS(SVGNS, "text");
        st.setAttribute("x", px); st.setAttribute("y", py + 1);
        st.textContent = POS[q];
        sg.appendChild(sc); sg.appendChild(st);
        seatsG.appendChild(sg);
        seatEls.push(sg);
      }

      /* svg-path-draw setup — measured, never guessed */
      function primeDraw(el) {
        var len = 400;
        try { len = el.getTotalLength() || 400; } catch (e) { len = 400; }
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
        return len;
      }
      for (var br = 0; br < 5; br++) primeDraw($("#f05-br-" + br));
      primeDraw($("#f05-ring"));

      /* ═══════════════════════════════════════════════════════════════════
         TIMELINE — one paused timeline. ONE camera tween; everything else
         is element motion firing as the camera arrives at its station.
         Every payoff offset is expressed against A[i], the derived arrival,
         so timing can never drift away from layout again.
         ═══════════════════════════════════════════════════════════════════ */
      var tl = gsap.timeline({ paused: true });

      /* ── THE camera move: 0.0s → 11.2s, one tween, no cuts, no holds ──── */
      tl.fromTo(cam,
        { x: -LEAD },
        { x: -(LEAD + TRAVEL), duration: CAM_DUR, ease: camEase, onUpdate: applyCamera },
        CAM_START);

      /* fixed chrome settles in under the moving plane */
      tl.fromTo("#f05-kicker", { opacity: 0, x: -14 },
        { opacity: 1, x: 0, duration: 0.55, ease: "power2.out" }, 0.15);
      tl.fromTo("#f05-tag", { opacity: 0, x: 14 },
        { opacity: 1, x: 0, duration: 0.55, ease: "power2.out" }, 0.25);
      tl.fromTo("#f05-rail", { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.3);
      tl.fromTo(".f05-rail-cap", { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power1.out", stagger: 0.08 }, 0.35);

      /* ── Scene 1 (A0 ≈ 0.34) · station 01 — the decision commits ──────── */
      tl.fromTo("#f05-spot-board rect, #f05-spot-board text, #f05-spot-board path",
        { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.035 }, A[0] + 0.15);
      tl.fromTo(["#f05-act-0", "#f05-act-1", "#f05-act-2"],
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.09 }, A[0] + 0.34);
      tl.fromTo("#f05-focus-ring",
        { opacity: 0, scale: 1.16 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, A[0] + 0.66);

      /* ── Scene 2 (A1 ≈ 1.78) · station 02 — the range grid fills ──────── */
      /* stat-bars-and-fills: per-cell progress fills, scaleX from a left
         origin, staggered by an index-derived sweep outward from AA. */
      tl.fromTo("#f05-open-legend",
        { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, A[1] - 0.50);
      openCells.forEach(function (cell) {
        if (!cell.lit) return;
        tl.fromTo(cell.fill,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.42, ease: "power2.out" },
          A[1] - 0.44 + cell.dist * 0.05);
      });
      ["#f05-key-0", "#f05-key-1", "#f05-key-2"].forEach(function (sel, idx) {
        tl.fromTo(sel,
          { opacity: 0, x: -16 },
          { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" }, A[1] - 0.30 + idx * 0.13);
      });
      tl.fromTo("#f05-open-accent",
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out" }, A[1] + 0.12);
      tl.fromTo("#f05-open-track",
        { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, A[1] - 0.28);
      tl.fromTo("#f05-open-track .f05-fill",
        { scaleX: 0 }, { scaleX: 1, duration: 0.95, ease: "power2.out" }, A[1] - 0.22);

      /* ── Scene 3 (A2 ≈ 3.23) · station 03 — a card lands, long-tail ───── */
      tl.fromTo("#f05-swipe",
        { scaleX: 0, opacity: 0.55 },
        { scaleX: 1, opacity: 0, duration: 0.55, ease: "power2.out" }, A[2] - 0.34);
      tl.fromTo("#f05-fly",
        { x: 0, y: 0, rotation: -9 },
        { x: FLY_DX, y: FLY_DY, rotation: 0, duration: 0.95, ease: "power4.out" }, A[2] - 0.32);
      tl.fromTo("#f05-fly",
        { scale: 1 }, { scale: 1.13, duration: 0.24, ease: "power2.out" }, A[2] - 0.32);
      tl.to("#f05-fly", { scale: 1, duration: 0.70, ease: "power3.out" }, A[2] - 0.08);
      tl.fromTo("#f05-land",
        { opacity: 0, scale: 1.06 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, A[2] + 0.32);

      /* ── Scene 4 (A3 ≈ 4.67) · station 04 — two drags, cursor + ripple ── */
      /* cursor-click-ripple: move → depression on cursor AND target →
         expanding ring from the drop point. (Depression authored as two
         explicit tweens; yoyo/repeat are banned in HF renders.) */
      var cursor = $("#f05-cursor");
      var chipA = poolEls[0], chipB = poolEls[5];
      /* chip A: (63,40) 128x56 → bucket-0 centre (223,400) */
      var A_TO_X = 223 - 64 - 63, A_TO_Y = 400 - 28 - 40;
      /* chip B: (281,106) 128x56 → bucket-1 centre (685,400) */
      var B_TO_X = 685 - 64 - 281, B_TO_Y = 400 - 28 - 106;

      tl.fromTo(cursor, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, A[3] - 0.80);
      tl.fromTo(cursor, { x: 150, y: 12 },
        { x: 219, y: 398, duration: 0.48, ease: "power2.inOut" }, A[3] - 0.68);
      tl.fromTo(chipA, { x: 0, y: 0 },
        { x: A_TO_X, y: A_TO_Y, duration: 0.48, ease: "power2.inOut" }, A[3] - 0.68);
      tl.to(cursor, { scale: 0.84, duration: 0.08, ease: "power2.in" }, A[3] - 0.20);
      tl.to(cursor, { scale: 1, duration: 0.08, ease: "power2.out" }, A[3] - 0.12);
      tl.to("#f05-bucket-0", { scale: 0.95, duration: 0.08, ease: "power2.in" }, A[3] - 0.20);
      tl.to("#f05-bucket-0", { scale: 1, duration: 0.08, ease: "power2.out" }, A[3] - 0.12);
      tl.fromTo("#f05-ripple-0",
        { scale: 0, opacity: 1 },
        { scale: 4.2, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false },
        A[3] - 0.16);

      tl.to(cursor, { x: 681, y: 398, duration: 0.46, ease: "power2.inOut" }, A[3] + 0.02);
      tl.fromTo(chipB, { x: 0, y: 0 },
        { x: B_TO_X, y: B_TO_Y, duration: 0.46, ease: "power2.inOut" }, A[3] + 0.02);
      tl.to(cursor, { scale: 0.84, duration: 0.08, ease: "power2.in" }, A[3] + 0.48);
      tl.to(cursor, { scale: 1, duration: 0.08, ease: "power2.out" }, A[3] + 0.56);
      tl.to("#f05-bucket-1", { scale: 0.95, duration: 0.08, ease: "power2.in" }, A[3] + 0.48);
      tl.to("#f05-bucket-1", { scale: 1, duration: 0.08, ease: "power2.out" }, A[3] + 0.56);
      tl.fromTo("#f05-ripple-1",
        { scale: 0, opacity: 1 },
        { scale: 4.2, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false },
        A[3] + 0.52);

      /* ── Scene 5 (A4 ≈ 6.12) · station 05 — answers reveal, one commits ─ */
      /* dynamic-content-sequencing: per-row dwell derived ONCE from content
         length (BASE + chars × SEC_PER_CHAR), reduced into absolute offsets. */
      /* Pacing is compressed so all four rows have LANDED by the arrival beat —
         the card must read full at the moment the camera centres it. */
      var ANSWERS = ["Check back", "Small probe bet", "Bet for protection", "Overbet the turn"];
      var BASE_DURATION = 0.10, SEC_PER_CHAR = 0.005;
      var cum = 0;
      var ANSWER_AT = ANSWERS.map(function (txt) {
        var at = cum;
        cum += BASE_DURATION + txt.length * SEC_PER_CHAR;
        return at;
      });
      tl.fromTo(".f05-card[data-st='4'] .f05-prompt",
        { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, A[4] - 1.00);
      ANSWERS.forEach(function (txt, idx) {
        tl.fromTo("#f05-ans-" + idx,
          { opacity: 0, x: -26 },
          { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
          A[4] - 0.85 + ANSWER_AT[idx]);
      });
      tl.fromTo([".f05-card[data-st='4'] .f05-legend", "#f05-pip-0", "#f05-pip-1", "#f05-pip-2"],
        { opacity: 0 }, { opacity: 1, duration: 0.36, ease: "power1.out", stagger: 0.07 }, A[4] - 0.20);
      tl.fromTo("#f05-commit",
        { opacity: 0, scaleX: 0.94 },
        { opacity: 1, scaleX: 1, duration: 0.42, ease: "power2.out" }, A[4] + 0.42);

      /* ── Scene 6 (A5 ≈ 7.56) · station 06 — the villain range narrows ─── */
      tl.fromTo("#f05-vill-legend",
        { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, A[5] - 0.52);
      villCells.forEach(function (cell) {
        if (!cell.lit) return;
        if (inNarrow(cell.r, cell.c)) return;
        tl.to(cell.fill,
          { opacity: 0.06, duration: 0.36, ease: "power2.inOut" },
          A[5] - 0.42 + cell.dist * 0.03);
      });
      streetEls.forEach(function (el, idx) {
        tl.fromTo(el,
          { opacity: 0.24, x: -14 },
          { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, A[5] - 0.36 + idx * 0.30);
      });
      tl.fromTo(".f05-card[data-st='5'] .f05-accent",
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out" }, A[5] + 0.34);

      /* ── Scene 7 (A6 ≈ 9.01) · station 07 — the tree writes itself ────── */
      /* svg-path-draw: measured dasharray, each segment starting at ~75%
         of the previous one so it reads as one continuous hand. */
      var SEG = 0.34, SEG_STEP = 0.24, segStart = A[6] - 0.95;   /* step ≈ 0.71 × SEG */
      tl.fromTo("#f05-nd-root",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.36, ease: "power2.out" }, segStart - 0.06);
      for (var d = 0; d < 5; d++) {
        tl.to("#f05-br-" + d,
          { strokeDashoffset: 0, duration: SEG, ease: "power2.out" },
          segStart + d * SEG_STEP);
      }
      for (var n = 0; n < 5; n++) {
        tl.fromTo("#f05-nd-" + n,
          { opacity: 0, scale: 0.88 },
          { opacity: 1, scale: 1, duration: 0.38, ease: "power2.out" },
          segStart + n * SEG_STEP + 0.28);
      }

      /* ── Scene 8 (A7 = 11.20) · station 08 — the ring closes, camera stops ─
         The camera DECELERATES into 08, so this card owns the centre of frame
         from ~t=9.5 — far earlier than the cruise stations do. The payoff has
         to start there, not at the nominal scene edge, or the biggest element
         on screen is an empty box. It completes exactly as the camera stops. */
      tl.to("#f05-ring", { strokeDashoffset: 0, duration: 1.30, ease: "power2.out" }, A[7] - 1.80);
      seatEls.forEach(function (el, idx) {
        tl.fromTo(el,
          { opacity: 0, scale: 0.82 },
          { opacity: 1, scale: 1, duration: 0.50, ease: "power3.out" }, A[7] - 1.35 + idx * 0.16);
      });

      /* the held tail: subtle deterministic jitter only — never an exit */
      var jit = { p: 0 };
      tl.to(jit, {
        p: 1, duration: 0.8, ease: "none",
        onUpdate: function () {
          cam.jx = Math.sin(jit.p * Math.PI * 4.0) * 1.7;
          cam.jy = Math.sin(jit.p * Math.PI * 3.0) * 1.1;
          applyCamera();
        }
      }, CAM_END);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-interactive-learning"] = tl;
    })();
  </script>
</template>
