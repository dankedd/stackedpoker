<template id="captions-template" data-composition-id="captions" data-width="1920" data-height="1080">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>


<style data-brand-tokens>
      @font-face { font-family: 'Geist'; src: url('capture/assets/fonts/Geist-Regular.woff2') format('woff2'); font-weight: 400; font-display: block; }
      :root {
      --bg: #0C101D;
      --surface: #121726;
      --surface-raised: #191F2E;
      --primary: #8B5CF6;
      --primary-deep: #7C3AED;
      --primary-soft: #A78BFA;
      --text: #E6EAF0;
      --text-muted: #728297;
      --text-light: #64748B;
      --accent-light: rgba(139, 92, 246, 0.08);
      --accent-medium: rgba(139, 92, 246, 0.15);
      --border: rgba(139, 92, 246, 0.2);
      --card-bg: rgba(139, 92, 246, 0.04);
      --positive: #10B981;
      --negative: #B41C22;
      --cap-ink: #E6EAF0;
      --cap-canvas: #0C101D;
      --cap-accent: #7C3AED;
      --cap-accent-2: #8B5CF6;
      --font-display: "Geist", system-ui, serif;
      --font-body: "Geist", system-ui, sans-serif;
      --cap-band-top: 900px;
      --cap-band-height: 180px;
      }
    </style>

<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* THE tinted card — 4% cobalt fill, 1.5px 20%-cobalt border, soft 14px corners,
     NO shadow (the tinted card does the lift; cast depth is forbidden) */
  .caption-pill {
    max-width: 78%;
    padding: 20px 44px 24px;
    background: color-mix(in srgb, var(--cap-accent, #1e2bfa) 4%, var(--cap-canvas, #fdfae7));
    border: 1.5px solid color-mix(in srgb, var(--cap-accent, #1e2bfa) 20%, transparent);
    border-radius: 14px;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.1em 0.34em;
    font-family: "Geist", system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(40px, 4.4vw, 58px);
    line-height: 1.16;
    letter-spacing: -0.02em;
  }

  /* upcoming — muted gray, no chip */
  .caption-word {
    display: inline-block;
    padding: 0 0.18em;
    border-radius: 0.32em;
    color: color-mix(in srgb, var(--cap-ink, #111111) 52%, var(--cap-canvas, #fdfae7));
  }
  /* current word — THE solid cobalt chip (the single-accent gesture; pill-rounded
     fill, NO shadow), cream reading on top */
  .caption-word.is-active {
    color: var(--cap-canvas, #fdfae7);
    background: var(--cap-accent, #1e2bfa);
    box-shadow: none;
  }
  /* already spoken — solid near-black ink, chip cleared */
  .caption-word.is-spoken {
    color: var(--cap-ink, #111111);
    background: transparent;
    box-shadow: none;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  /* brand / key term — cobalt, the system's one accent on a key word */
  .caption-word.cap-brand {
    color: var(--cap-accent, #1e2bfa);
  }
  /* numerals / data — cobalt 700, the figure voice */
  .caption-word.cap-num {
    font-family: "Geist", system-ui, sans-serif;
    font-weight: 700;
    color: var(--cap-accent, #1e2bfa);
  }
  /* emphasis — a directional-red hairline underline (inline only, never a fill) */
  .caption-word.cap-cta {
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-decoration-color: var(--cap-accent-2, #dc2626);
    text-underline-offset: 0.1em;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 92%;
    }
    .caption-line {
      font-size: clamp(34px, 5.4vw, 48px);
    }
  }
</style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="60"
  data-fps="30"
  data-width="1920"
  data-height="1080"
>
  <div class="caption-layer" aria-hidden="true">
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

<script>
  // captions.mjs injects the engine's scene-aware groups + real duration here.
  var GROUPS = [{"id":"caption-group-0","frame":1,"start":0.899,"end":1.179,"text":"What would","words":[{"id":"caption-word-0-0","text":"What","start":0.899,"end":1.019},{"id":"caption-word-0-1","text":"would","start":1.039,"end":1.14}]},{"id":"caption-group-1","frame":1,"start":1.179,"end":1.599,"text":"you do?","words":[{"id":"caption-word-1-0","text":"you","start":1.179,"end":1.279},{"id":"caption-word-1-1","text":"do?","start":1.319,"end":1.479}]},{"id":"caption-group-2","frame":2,"start":4.549,"end":5.629,"text":"Every poker session","words":[{"id":"caption-word-2-0","text":"Every","start":4.549,"end":4.829},{"id":"caption-word-2-1","text":"poker","start":4.869,"end":5.109},{"id":"caption-word-2-2","text":"session","start":5.19,"end":5.589}]},{"id":"caption-group-3","frame":2,"start":5.629,"end":5.93,"text":"is a","words":[{"id":"caption-word-3-0","text":"is","start":5.629,"end":5.729},{"id":"caption-word-3-1","text":"a","start":5.769,"end":5.889}]},{"id":"caption-group-4","frame":2,"start":5.93,"end":7.109,"text":"series of decisions.","words":[{"id":"caption-word-4-0","text":"series","start":5.93,"end":6.269},{"id":"caption-word-4-1","text":"of","start":6.289,"end":6.389},{"id":"caption-word-4-2","text":"decisions.","start":6.409,"end":6.989}]},{"id":"caption-group-5","frame":3,"start":9.669,"end":10.769,"text":"Most players spend","words":[{"id":"caption-word-5-0","text":"Most","start":9.669,"end":9.85},{"id":"caption-word-5-1","text":"players","start":9.909,"end":10.249},{"id":"caption-word-5-2","text":"spend","start":10.269,"end":10.67}]},{"id":"caption-group-6","frame":3,"start":10.769,"end":11.749,"text":"hours watching...","words":[{"id":"caption-word-6-0","text":"hours","start":10.769,"end":11.169},{"id":"caption-word-6-1","text":"watching...","start":11.229,"end":11.629}]},{"id":"caption-group-7","frame":4,"start":16.569,"end":17.109,"text":"We believe","words":[{"id":"caption-word-7-0","text":"We","start":16.569,"end":16.709},{"id":"caption-word-7-1","text":"believe","start":16.73,"end":17.089}]},{"id":"caption-group-8","frame":4,"start":17.109,"end":17.409,"text":"there's a","words":[{"id":"caption-word-8-0","text":"there's","start":17.109,"end":17.289},{"id":"caption-word-8-1","text":"a","start":17.389,"end":17.409}]},{"id":"caption-group-9","frame":4,"start":17.409,"end":18.07,"text":"better way.","words":[{"id":"caption-word-9-0","text":"better","start":17.409,"end":17.649},{"id":"caption-word-9-1","text":"way.","start":17.69,"end":17.95}]},{"id":"caption-group-10","frame":5,"start":20.649,"end":21.089,"text":"Learn by","words":[{"id":"caption-word-10-0","text":"Learn","start":20.649,"end":20.829},{"id":"caption-word-10-1","text":"by","start":20.889,"end":20.989}]},{"id":"caption-group-11","frame":5,"start":21.089,"end":22.449,"text":"making real decisions.","words":[{"id":"caption-word-11-0","text":"making","start":21.089,"end":21.45},{"id":"caption-word-11-1","text":"real","start":21.489,"end":21.649},{"id":"caption-word-11-2","text":"decisions.","start":21.729,"end":22.329}]},{"id":"caption-group-12","frame":6,"start":32.59,"end":33.629,"text":"Understand why.","words":[{"id":"caption-word-12-0","text":"Understand","start":32.59,"end":33.089},{"id":"caption-word-12-1","text":"why.","start":33.209,"end":33.509}]},{"id":"caption-group-13","frame":7,"start":39.569,"end":40.649,"text":"Track every step","words":[{"id":"caption-word-13-0","text":"Track","start":39.569,"end":39.849},{"id":"caption-word-13-1","text":"every","start":40.01,"end":40.229},{"id":"caption-word-13-2","text":"step","start":40.369,"end":40.609}]},{"id":"caption-group-14","frame":7,"start":40.649,"end":41.369,"text":"of your journey.","words":[{"id":"caption-word-14-0","text":"of","start":40.649,"end":40.749},{"id":"caption-word-14-1","text":"your","start":40.769,"end":40.829},{"id":"caption-word-14-2","text":"journey.","start":40.95,"end":41.249}]},{"id":"caption-group-15","frame":8,"start":47.609,"end":47.969,"text":"From your","words":[{"id":"caption-word-15-0","text":"From","start":47.609,"end":47.749},{"id":"caption-word-15-1","text":"your","start":47.809,"end":47.929}]},{"id":"caption-group-16","frame":8,"start":47.969,"end":48.55,"text":"first hand","words":[{"id":"caption-word-16-0","text":"first","start":47.969,"end":48.19},{"id":"caption-word-16-1","text":"hand","start":48.249,"end":48.529}]},{"id":"caption-group-17","frame":8,"start":48.55,"end":49.909,"text":"to advanced strategy.","words":[{"id":"caption-word-17-0","text":"to","start":48.55,"end":48.629},{"id":"caption-word-17-1","text":"advanced","start":48.69,"end":49.149},{"id":"caption-word-17-2","text":"strategy.","start":49.249,"end":49.789}]}];
  var DURATION = 60;

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      // Re-applied after a captions rebuild: the default holds the last group to
      // DURATION, which parked "to advanced strategy." over the entire hero lockup.
      var end = isLast
        ? Math.min(DURATION, Number(group.end) + 0.3)
        : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
      // engine's frame-by-frame seek; .call callbacks would NOT fire).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start); // upcoming (also resets on reverse-seek)
        tl.set(el, { className: "caption-word is-active" }, at); // current
        tl.fromTo(el, { scale: 0.985 }, { scale: 1, duration: 0.18, ease: "power1.out" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt); // demote when next activates
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    // full-span anchor so the sub-comp timeline spans the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>

<style>
  .caption-line { line-height: 1.1 !important; }
</style>
</template>
