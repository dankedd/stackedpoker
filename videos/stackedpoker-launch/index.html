<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0C101D;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-the-question"
        class="scene"
        data-composition-id="01-the-question"
        data-composition-src="compositions/frames/01-the-question.html"
        data-start="0"
        data-duration="4"
        data-track-index="0"
      ></div>
      <audio
        id="el-01-the-question-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="4"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-everyone-knows"
        class="scene"
        data-composition-id="02-everyone-knows"
        data-composition-src="compositions/frames/02-everyone-knows.html"
        data-start="4"
        data-duration="5"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-everyone-knows-voice"
        src="assets/voice/02.wav"
        data-start="4"
        data-duration="5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-traditional-learning"
        class="scene"
        data-composition-id="03-traditional-learning"
        data-composition-src="compositions/frames/03-traditional-learning.html"
        data-start="9"
        data-duration="7"
        data-track-index="0"
      ></div>
      <audio
        id="el-03-traditional-learning-voice"
        src="assets/voice/03.wav"
        data-start="9"
        data-duration="7"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-better-way"
        class="scene"
        data-composition-id="04-better-way"
        data-composition-src="compositions/frames/04-better-way.html"
        data-start="16"
        data-duration="4.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-better-way-voice"
        src="assets/voice/04.wav"
        data-start="16"
        data-duration="4"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-05-interactive-learning"
        class="scene"
        data-composition-id="05-interactive-learning"
        data-composition-src="compositions/frames/05-interactive-learning.html"
        data-start="20"
        data-duration="12"
        data-track-index="0"
      ></div>
      <audio
        id="el-05-interactive-learning-voice"
        src="assets/voice/05.wav"
        data-start="20"
        data-duration="12"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-06-ai-coach"
        class="scene"
        data-composition-id="06-ai-coach"
        data-composition-src="compositions/frames/06-ai-coach.html"
        data-start="32"
        data-duration="7.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-06-ai-coach-voice"
        src="assets/voice/06.wav"
        data-start="32"
        data-duration="7"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-07-progress"
        class="scene"
        data-composition-id="07-progress"
        data-composition-src="compositions/frames/07-progress.html"
        data-start="39"
        data-duration="8.5"
        data-track-index="0"
      ></div>
      <audio
        id="el-07-progress-voice"
        src="assets/voice/07.wav"
        data-start="39"
        data-duration="8"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-08-scale"
        class="scene"
        data-composition-id="08-scale"
        data-composition-src="compositions/frames/08-scale.html"
        data-start="47"
        data-duration="8.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-08-scale-voice"
        src="assets/voice/08.wav"
        data-start="47"
        data-duration="8"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-09-hero"
        class="scene"
        data-composition-id="09-hero"
        data-composition-src="compositions/frames/09-hero.html"
        data-start="55"
        data-duration="5"
        data-track-index="0"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/track.loop.mp3"
        data-start="0"
        data-duration="60"
        data-track-index="11"
        data-volume="0.12"
      ></audio>

      <!-- captions -->
      <div
        id="el-captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="60"
        data-track-index="2"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-04-better-way", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 20);
        tl.fromTo("#el-05-interactive-learning", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 20);
        tl.to("#el-06-ai-coach", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 39);
        tl.fromTo("#el-07-progress", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 39);
        tl.to("#el-07-progress", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 47);
        tl.fromTo("#el-08-scale", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 47);
        tl.to("#el-08-scale", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 55);
        tl.fromTo("#el-09-hero", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 55);
        tl.to({}, { duration: 60 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
